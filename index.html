<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cannon Fight Lab — Next event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Page-specific styles */
  .countdown-bar {
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    border-bottom: 1px solid var(--border);
    padding: 28px 32px;
    text-align: center;
  }
  .countdown-eyebrow {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 8px;
  }
  .countdown-event-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    margin-bottom: 6px;
  }
  .countdown-meta {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 14px;
  }
  .countdown-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--red);
    color: #fff;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .countdown-pill .num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
  }

  /* Stat of the day */
  .stat-strip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
    margin-bottom: 36px;
  }
  .stat-of-day {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .stat-of-day .lbl {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .stat-of-day .big {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .stat-of-day .big .sec {
    font-size: 16px;
    color: var(--text-3);
    font-weight: 600;
    margin-left: 8px;
  }
  .stat-of-day .sub { font-size: 12px; color: var(--text-2); }

  /* Fights list */
  .fights-section { margin-bottom: 40px; }
  .fights-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .fights-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .fights-header .sub {
    font-size: 12px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .fight-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .fight-card:hover { border-color: #2f2f2f; }
  .fight-card.main { border-color: var(--red); }
  .fight-card.title { border-color: #d4af37; }

  .fight-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .fight-card-header .badge {
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--red);
    color: #fff;
    letter-spacing: 0.05em;
  }
  .fight-card-header .badge.title { background: #d4af37; color: #1a1a1a; }
  .fight-card-header .weight { color: var(--text-2); }

  .fight-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 18px 20px;
  }

  .fight-fighter {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .fight-fighter:hover { opacity: 0.85; }
  .fight-fighter.right {
    flex-direction: row-reverse;
    text-align: right;
  }
  .fight-fighter .meta-block {
    flex: 1;
    min-width: 0;
  }
  .fight-fighter .name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fight-fighter .nick {
    font-size: 12px;
    color: var(--text-2);
    font-style: italic;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fight-fighter .record {
    font-size: 12px;
    color: var(--text-3);
    margin-top: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.5px;
  }
  .fight-fighter .record strong { color: var(--text); font-weight: 600; }

  .fight-vs {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--red);
    letter-spacing: 0.1em;
    text-align: center;
  }
  .fight-vs .compare {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-3);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-decoration: none;
    transition: color 0.15s;
  }
  .fight-vs .compare:hover { color: var(--red); }

  /* Comparison-bar stats: each row has fighter A's value+bar on the left,
     fighter B's value+bar on the right, with a thin centerline divider.
     Bar length encodes magnitude — leader's bar always reaches the outer
     edge, trailing fighter's bar shows their fraction of the leader. */
  .fight-stats {
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  /* Two visually distinguishable groupings inside .fight-stats:
     physicals (tape-of-the-tape, on top) and performance (derived stats, below).
     Separated by a subtle divider line so the eye can parse them as
     "static facts about the fighters" vs "computed performance signal." */
  .fstat-section + .fstat-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .fstat-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .fstat-row:last-child { margin-bottom: 0; }
  .fstat-label {
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    text-align: center;
    min-width: 92px;
    line-height: 1.2;
  }
  .fstat-label-link {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--text-3);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .fstat-label-link:hover {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .fstat-side {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 18px;
  }
  .fstat-side.left { justify-content: flex-end; }
  .fstat-side.right { justify-content: flex-start; flex-direction: row-reverse; }
  .fstat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: 0.5px;
    min-width: 44px;
    text-align: center;
    flex-shrink: 0;
  }
  .fstat-side.left .fstat-val { text-align: right; }
  .fstat-side.right .fstat-val { text-align: left; }
  .fstat-val.winner { color: var(--green); }
  .fstat-bar {
    flex: 1;
    height: 6px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
    max-width: 220px;
  }
  .fstat-fill {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--text-3);
    border-radius: 3px;
    transition: width 0.3s;
  }
  .fstat-fill.winner { background: var(--green); }
  .fstat-side.left  .fstat-fill { right: 0; }
  .fstat-side.right .fstat-fill { left: 0; }
  .fstat-tier-tag {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #ffa726;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .fstat-side.right .fstat-tier-tag { margin-left: 0; margin-right: 6px; }

  /* ============== Cardio row — tier word + small score ============== */
  /* Cardio rows replace the bare numeric value with a stacked layout:
     a tier word (Tireless / Steady / etc.) on top, the numeric score
     in muted small text underneath. Reuses .fstat-bar/.fstat-fill so
     the visual rhythm of the stat block is preserved. */
  .cardio-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.05;
    min-width: 56px;
  }
  .fstat-side.right .cardio-stack { align-items: flex-start; }
  .cardio-tier-word {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: 0.3px;
  }
  .cardio-tier-word.winner { color: var(--green); }
  .cardio-score-small {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
    margin-top: 1px;
  }

  /* ============== Edge panel (top 3 fights only) ============== */
  .edge-panel {
    border-top: 1px solid var(--border);
    background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
    padding: 18px 22px 20px;
  }
  .edge-eyebrow {
    font-size: 10px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edge-eyebrow .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red);
    display: inline-block;
  }
  .edge-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .edge-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .edge-row .marker {
    flex-shrink: 0;
    width: 44px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 3px 0;
    border-radius: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .edge-row .marker.favors-a { background: rgba(76, 175, 80, 0.12); color: var(--green); border: 1px solid rgba(76,175,80,0.25); }
  .edge-row .marker.favors-b { background: rgba(55, 138, 221, 0.12); color: var(--blue); border: 1px solid rgba(55,138,221,0.25); }
  .edge-row .marker.neutral  { background: var(--bg-3); color: var(--text-3); border: 1px solid var(--border-2); }
  .edge-row .desc { color: var(--text); flex: 1; }
  .edge-row .desc strong { color: #fff; }
  .edge-row .pct {
    flex-shrink: 0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: 0.5px;
  }

  .edge-summary {
    border-top: 1px solid var(--border);
    padding-top: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .edge-summary .verdict-label {
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    flex-shrink: 0;
  }
  .edge-summary .verdict-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.5px;
    line-height: 1;
  }
  .edge-summary .verdict-name.even { color: var(--text-2); }
  .edge-summary .verdict-pct {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.5px;
  }
  .edge-summary .verdict-pct.even { color: var(--text-3); }
  .edge-summary .verdict-pct .small {
    font-size: 14px;
    color: var(--text-3);
    margin-left: 4px;
    font-weight: 600;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .countdown-event-name { font-size: 30px; }
    .stat-strip { grid-template-columns: 1fr; }
    .fight-body { grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 14px 12px; }
    .fight-fighter { gap: 8px; }
    .fight-fighter .name { font-size: 16px; }
    .fight-fighter .nick { font-size: 10px; }
    .fight-stats { padding: 12px 14px 14px; }
    .fstat-label { min-width: 70px; font-size: 9px; }
    .fstat-row { gap: 8px; margin-bottom: 10px; }
    .fstat-val { font-size: 13px; min-width: 36px; }
    .fstat-bar { max-width: none; }
    .fight-vs { font-size: 14px; }
    .countdown-bar { padding: 20px 16px; }
    .edge-panel { padding: 14px 14px 16px; }
    .edge-row { font-size: 12px; gap: 10px; }
    .edge-row .marker { width: 36px; font-size: 12px; }
    .edge-summary .verdict-name { font-size: 18px; }
    .edge-summary .verdict-pct { font-size: 22px; }
  }
</style>
</head>
<body>

<nav class="cfl-nav"></nav>

<div class="countdown-bar" id="countdownBar">
  <div class="loading-state" style="padding: 12px;">
    <div class="loading-spinner"></div>
    <div>Loading next event…</div>
  </div>
</div>

<div class="page">
  <div class="stat-strip" id="statStrip"></div>
  <div class="fights-section">
    <div class="fights-header">
      <h2>Card</h2>
      <div class="sub" id="cardCount"></div>
    </div>
    <div id="fightsList"></div>
  </div>
</div>

<footer class="cfl-footer"></footer>

<script src="_shared.js"></script>
<script>
cfl.renderNav('home');
cfl.renderFooter();

// =============================================================================
// LOAD: next event + its fights + the fighters in those fights
// =============================================================================

async function load() {
  const sb = window.cflSupabase;

  // 1. Find the next upcoming event (soonest event_date that's still in the future)
  const today = new Date().toISOString().slice(0, 10);
  let { data: events, error: evErr } = await sb
    .from('events')
    .select('id, name, event_date, location, ufc_url')
    .eq('is_upcoming', true)
    .gte('event_date', today)
    .order('event_date', { ascending: true })
    .limit(1);

  if (evErr) {
    document.getElementById('countdownBar').innerHTML = cfl.errorHtml('Failed to load next event: ' + evErr.message);
    return;
  }

  let event = events && events[0];

  // Fallback: if no truly upcoming event exists, use the most recent completed
  let isFallback = false;
  if (!event) {
    const { data: recent, error: recErr } = await sb
      .from('events')
      .select('id, name, event_date, location, ufc_url')
      .eq('is_upcoming', false)
      .order('event_date', { ascending: false })
      .limit(1);
    if (recErr) {
      document.getElementById('countdownBar').innerHTML = cfl.errorHtml('Failed to load events: ' + recErr.message);
      return;
    }
    event = recent && recent[0];
    isFallback = true;
  }

  if (!event) {
    document.getElementById('countdownBar').innerHTML = cfl.errorHtml('No events found in the database.');
    return;
  }

  renderCountdown(event, isFallback);
  await loadFights(event);
  loadStatOfDay(event);
}

function renderCountdown(event, isFallback) {
  const days = cfl.daysUntil(event.event_date);
  let pillContent;
  if (isFallback) {
    pillContent = `<span>Most recent</span><span class="num">${cfl.formatDateShort(event.event_date)}</span>`;
  } else if (days === 0) {
    pillContent = '<span>Tonight</span>';
  } else if (days === 1) {
    pillContent = '<span>Tomorrow</span>';
  } else if (days < 0) {
    pillContent = `<span>Result pending</span>`;
  } else {
    pillContent = `<span>In</span><span class="num">${days}</span><span>day${days === 1 ? '' : 's'}</span>`;
  }

  document.getElementById('countdownBar').innerHTML = `
    <div class="countdown-eyebrow">${isFallback ? 'Most recent event' : 'Next event'}</div>
    <div class="countdown-event-name">${cfl.escapeHtml(event.name)}</div>
    <div class="countdown-meta">${cfl.formatDate(event.event_date)} · ${cfl.escapeHtml(event.location || 'Location TBD')}</div>
    <div class="countdown-pill">${pillContent}</div>
  `;
}

async function loadFights(event) {
  const list = document.getElementById('fightsList');
  list.innerHTML = cfl.loadingHtml('Loading card…');
  const sb = window.cflSupabase;

  const { data: fights, error } = await sb
    .from('fights')
    .select('*')
    .eq('event_id', event.id)
    .order('is_main_event', { ascending: false })
    .order('id', { ascending: true });

  if (error) {
    list.innerHTML = cfl.errorHtml('Failed to load fights: ' + error.message);
    return;
  }

  if (!fights || fights.length === 0) {
    list.innerHTML = '<div class="no-results">No fights listed for this event yet.</div>';
    document.getElementById('cardCount').textContent = '';
    return;
  }

  document.getElementById('cardCount').textContent = `${fights.length} fight${fights.length === 1 ? '' : 's'}`;

  // Collect all fighter ids referenced
  const fighterIds = new Set();
  fights.forEach(f => {
    if (f.fighter_a_id) fighterIds.add(f.fighter_a_id);
    if (f.fighter_b_id) fighterIds.add(f.fighter_b_id);
  });

  // Bulk-fetch all those fighters in one query
  const { data: fighters, error: fErr } = await sb
    .from('fighters')
    .select('id, name, nickname, division, stance, age, height_in, reach_in, ' +
            'wins, losses, draws, ufc_wins, ufc_losses, ufc_draws, ' +
            'slpm, sapm, td_avg, td_def, str_acc, str_def, sub_avg, last_5')
    .in('id', Array.from(fighterIds));

  if (fErr) {
    list.innerHTML = cfl.errorHtml('Failed to load fighter details: ' + fErr.message);
    return;
  }

  const fighterMap = {};
  fighters.forEach(f => { fighterMap[f.id] = f; });

  // Fetch recent form for each fighter on this card (for edge panel).
  // Reads from v_fighter_recent_form which derives from the fights table
  // directly — bypasses the broken last_5 column on the fighters table.
  const streakMap = {};
  try {
    const { data: streaks } = await sb
      .from('v_fighter_recent_form')
      .select('fighter_id, last_result, current_streak, last_5')
      .in('fighter_id', Array.from(fighterIds));
    (streaks || []).forEach(s => {
      // current_streak in the view is signed: +N for N consecutive wins,
      // -N for N consecutive losses, 0 otherwise. Split into two non-negative
      // fields so each edge function can reason about exactly the streak it
      // cares about, with no sign-stripping confusion.
      const raw = s.current_streak || 0;
      streakMap[s.fighter_id] = {
        last_result: s.last_result,
        win_streak: raw > 0 ? raw : 0,
        loss_streak: raw < 0 ? Math.abs(raw) : 0,
        last_5: s.last_5,
      };
    });
  } catch (e) {
    console.warn('Recent form data not available:', e.message);
  }

  // Fetch cardio data for everyone on the card. Reset cache so a new event
  // load doesn't reuse the previous card's fighter set.
  _cardioMap = null;
  await loadCardioMap(fighterIds);

  list.innerHTML = fights.map(fight =>
    renderFight(fight, fighterMap, streakMap, true)
  ).join('');
}

function renderFight(fight, fmap, streakMap, isTopFight) {
  const a = fmap[fight.fighter_a_id];
  const b = fmap[fight.fighter_b_id];

  if (!a || !b) {
    return `<div class="fight-card"><div class="fight-card-header">Fight data incomplete</div></div>`;
  }

  const tags = [];
  let cardClass = 'fight-card';
  if (fight.is_title_fight) {
    tags.push('<span class="badge title">Title</span>');
    cardClass += ' title';
  }
  if (fight.is_main_event) {
    tags.push('<span class="badge">Main event</span>');
    if (!fight.is_title_fight) cardClass += ' main';
  }

  const weight = fight.weight_class ? `<span class="weight">${cfl.escapeHtml(fight.weight_class)}</span>` : '';

  const edgePanel = isTopFight ? renderEdgePanel(a, b, streakMap || {}, fight.weight_class) : '';

  return `
    <div class="${cardClass}">
      <div class="fight-card-header">
        ${tags.join(' ')}
        ${weight}
      </div>
      <div class="fight-body">
        ${renderFighterSide(a, 'left')}
        <div class="fight-vs">
          VS
          <a class="compare" href="${cfl.h2hUrl(a.id, b.id)}">Compare →</a>
        </div>
        ${renderFighterSide(b, 'right')}
      </div>
      ${renderQuickStats(a, b, fight.weight_class)}
      ${edgePanel}
    </div>
  `;
}

function renderFighterSide(f, side) {
  const w = f.wins ?? 0;
  const l = f.losses ?? 0;
  const d = f.draws ?? 0;
  const recordStr = (w + l + d) > 0
    ? `${w}-${l}${d ? '-' + d : ''}`
    : '0-0';
  const recordLabel = (w + l + d) > 0 ? 'pro' : '';

  return `
    <a class="fight-fighter ${side}" href="${cfl.fighterUrl(f.id)}">
      <div class="cfl-avatar lg">${cfl.escapeHtml(cfl.initials(f.name))}</div>
      <div class="meta-block">
        <div class="name">${cfl.escapeHtml(f.name)}</div>
        ${f.nickname ? `<div class="nick">"${cfl.escapeHtml(f.nickname)}"</div>` : ''}
        <div class="record"><strong>${recordStr}</strong>${recordLabel ? ' ' + recordLabel : ''}</div>
      </div>
    </a>
  `;
}

// =============================================================================
// EDGE PANEL — describes statistical edges + summarizes verdict
// =============================================================================

function ageEdge(a, b) {
  if (a.age == null || b.age == null) return null;
  const gap = Math.abs(a.age - b.age);
  if (gap < 1) return null;
  let pct;
  if (gap <= 2)      pct = 52.0;
  else if (gap <= 4) pct = 55.9;
  else if (gap <= 6) pct = 58.2;
  else if (gap <= 9) pct = 63.3;
  else               pct = 65.2;
  // The calibrated age edge assumes both fighters are established UFC fighters.
  // If either fighter has fewer than 5 UFC fights, the edge is much weaker
  // because raw age vs prospect-vs-veteran dynamics dominate. Discount toward
  // 50% in that case.
  const aTotal = (a.ufc_wins ?? 0) + (a.ufc_losses ?? 0);
  const bTotal = (b.ufc_wins ?? 0) + (b.ufc_losses ?? 0);
  if (aTotal < 5 || bTotal < 5) {
    pct = 50 + (pct - 50) * 0.5;  // halve the edge magnitude
  }
  const youngerIsA = a.age < b.age;
  return {
    favors: youngerIsA ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(youngerIsA ? a.name : b.name)}</strong> is ${gap} year${gap===1?'':'s'} younger`
  };
}

function streakEdge(a, b, streakMap) {
  // Win streak edge: only credits a fighter who is on an active winning run.
  // A fighter on a 6-fight LOSING streak is not "hot" — they will have
  // win_streak=0 (and a non-zero loss_streak instead, handled separately).
  const sa = streakMap[a.id], sb = streakMap[b.id];
  if (!sa || !sb) return null;
  const ra = sa.win_streak || 0;
  const rb = sb.win_streak || 0;
  if (ra === rb) return null;
  if (Math.max(ra, rb) < 2) return null;
  const aIsHotter = ra > rb;
  const hot = aIsHotter ? ra : rb;
  let pct;
  if (hot >= 5)      pct = 62.9;
  else if (hot >= 3) pct = 55.1;
  else if (hot >= 2) pct = 53.3;
  else               pct = 50.4;
  return {
    favors: aIsHotter ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(aIsHotter ? a.name : b.name)}</strong> on a ${hot}-fight win streak`
  };
}

function lossStreakEdge(a, b, streakMap) {
  // Loss streak edge: penalizes a fighter on a 2+ losing skid by favoring
  // the opponent. A fighter who has lost 3+ in a row is in trouble — that's
  // a meaningful signal that bookmakers and bettors react to.
  // (This is distinct from postLossEdge, which fires off a single loss.)
  const sa = streakMap[a.id], sb = streakMap[b.id];
  if (!sa || !sb) return null;
  const la = sa.loss_streak || 0;
  const lb = sb.loss_streak || 0;
  // Skip if neither has a real losing skid, or both are skidding equally.
  if (la === lb) return null;
  if (Math.max(la, lb) < 2) return null;
  const aColder = la > lb;
  const cold = aColder ? la : lb;
  let pct;
  if (cold >= 5)      pct = 60.0;  // 5+ losses in a row — career-trouble territory
  else if (cold >= 3) pct = 55.5;  // 3-4 losses — clear cold streak
  else                pct = 53.0;  // 2 losses — borderline
  // Edge favors the OPPONENT of the colder fighter
  return {
    favors: aColder ? 'b' : 'a',
    pct,
    desc: `<strong>${cfl.escapeHtml(aColder ? a.name : b.name)}</strong> on a ${cold}-fight losing streak`
  };
}

function postLossEdge(a, b, streakMap) {
  const sa = streakMap[a.id], sb = streakMap[b.id];
  if (!sa || !sb) return null;
  const aOffLoss = sa.last_result !== 'W';
  const bOffLoss = sb.last_result !== 'W';
  if (aOffLoss === bOffLoss) return null;
  const offLossName = aOffLoss ? a.name : b.name;
  return {
    favors: aOffLoss ? 'b' : 'a',
    pct: 53.0,
    desc: `<strong>${cfl.escapeHtml(offLossName)}</strong> coming off a loss`
  };
}

function reachEdge(a, b) {
  if (a.reach_in == null || b.reach_in == null) return null;
  const gap = Math.abs(a.reach_in - b.reach_in);
  if (gap < 2) return null;
  return {
    favors: a.reach_in > b.reach_in ? 'a' : 'b',
    pct: 52.0,
    desc: `<strong>${cfl.escapeHtml(a.reach_in > b.reach_in ? a.name : b.name)}</strong> has ${gap}" reach advantage`
  };
}

function stanceEdge(a, b) {
  if (a.stance && b.stance && a.stance !== b.stance &&
      ['Orthodox','Southpaw'].includes(a.stance) && ['Orthodox','Southpaw'].includes(b.stance)) {
    const southpawIsA = a.stance === 'Southpaw';
    return {
      favors: southpawIsA ? 'a' : 'b',
      pct: 51.5,
      desc: `Stance mismatch: <strong>${cfl.escapeHtml(southpawIsA ? a.name : b.name)}</strong> southpaw vs orthodox`
    };
  }
  return null;
}

// =============================================================================
// PROFESSIONAL RECORD EDGE — uses total career record (UFC + pre-UFC fights).
// More inclusive sample than UFC-only, especially for fighters with regional
// careers before signing. Still uses Laplace smoothing to handle small samples.
//
// Examples:
//   - 0-0 vs 0-0: 50% (no edge surfaces)
//   - 5-0 vs 5-5: smoothed 70% vs 50% → ~57% edge to undefeated
//   - 25-3 vs 12-8: smoothed 84% vs 58% → 60% edge to vet
//   - 18-2 vs 0-2: 83% vs 33% → 62% edge (max)
// We surface only when smoothed gap is ≥ 8pp.
// =============================================================================
function recordEdge(a, b) {
  const aw = a.wins ?? 0, al = a.losses ?? 0;
  const bw = b.wins ?? 0, bl = b.losses ?? 0;
  const aTotal = aw + al;
  const bTotal = bw + bl;
  // Skip if both fighters have essentially no recorded pro history
  if (aTotal + bTotal < 3) return null;
  // Smoothed (Laplace) win rates: (W + 2) / (W + L + 4)
  const aRate = (aw + 2) / (aTotal + 4);
  const bRate = (bw + 2) / (bTotal + 4);
  const gap = Math.abs(aRate - bRate);
  if (gap < 0.08) return null;
  let pct;
  if (gap >= 0.40)      pct = 62.0;
  else if (gap >= 0.25) pct = 60.0;
  else if (gap >= 0.15) pct = 56.5;
  else                  pct = 53.5;
  const aBetter = aRate > bRate;
  const aRec = `${aw}-${al}`;
  const bRec = `${bw}-${bl}`;
  return {
    favors: aBetter ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(aBetter ? a.name : b.name)}</strong> has stronger pro record (${aBetter ? aRec : bRec} vs ${aBetter ? bRec : aRec})`
  };
}

// SLpM differential — pace/output edge. Modest predictor; surface only on
// meaningful gaps (≥1.0/min). Capped at 55% because raw output without
// accounting for accuracy/defense is noisy.
function slpmEdge(a, b) {
  if (a.slpm == null || b.slpm == null) return null;
  const gap = Math.abs(a.slpm - b.slpm);
  if (gap < 1.0) return null;
  let pct;
  if (gap >= 3.0)      pct = 55.0;
  else if (gap >= 2.0) pct = 53.5;
  else                 pct = 52.0;
  const aBetter = a.slpm > b.slpm;
  return {
    favors: aBetter ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(aBetter ? a.name : b.name)}</strong> throws ${gap.toFixed(1)} more strikes/min`
  };
}

// Takedown defense edge — strong predictor when the gap is wide, because it
// indicates whether one fighter can keep the fight where they want it.
// Surface only on ≥10pp gap. Capped at 56%.
function tdDefEdge(a, b) {
  if (a.td_def == null || b.td_def == null) return null;
  const gap = Math.abs(a.td_def - b.td_def);
  if (gap < 10) return null;
  let pct;
  if (gap >= 30)      pct = 56.0;
  else if (gap >= 20) pct = 54.0;
  else                pct = 52.5;
  const aBetter = a.td_def > b.td_def;
  return {
    favors: aBetter ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(aBetter ? a.name : b.name)}</strong> has ${gap}pp better takedown defense`
  };
}

// Cardio edge — uses the consistency_score from v_fighter_consistency.
// New scale: 100 = R3+ matches R1 baseline. >115 = tireless. <70 = fades.
// We surface the edge when there's a meaningful gap between fighters,
// scaled to the new range.
function cardioEdge(a, b, fightWeightClass) {
  const ca = cardioFor(a.id, fightWeightClass);
  const cb = cardioFor(b.id, fightWeightClass);
  if (!ca || !cb) return null;
  if (!ca.tier_word || !cb.tier_word) return null;
  const gap = Math.abs((ca.score || 0) - (cb.score || 0));
  if (gap < 15) return null; // small gaps not meaningful on the 0-150 scale
  // Confidence-aware capping. Limited or career fallback = more conservative.
  const eitherLimited = (ca.confidence === 'limited' || cb.confidence === 'limited');
  const eitherCareerFallback = (ca.source === 'career' || cb.source === 'career');
  const conservative = eitherLimited || eitherCareerFallback;
  let pct;
  if (gap >= 50)      pct = conservative ? 55.0 : 58.0;
  else if (gap >= 30) pct = conservative ? 53.5 : 56.0;
  else                pct = conservative ? 52.5 : 54.0;
  const aBetter = (ca.score || 0) > (cb.score || 0);
  const limited = conservative ? ' (limited data)' : '';
  return {
    favors: aBetter ? 'a' : 'b',
    pct,
    desc: `<strong>${cfl.escapeHtml(aBetter ? a.name : b.name)}</strong> has stronger late-round cardio${limited}`
  };
}

function computeEdges(a, b, streakMap, fightWeightClass) {
  const edges = [
    recordEdge(a, b),         // pro record — usually the dominant signal
    cardioEdge(a, b, fightWeightClass), // late-round sustain (per weight class)
    ageEdge(a, b),
    streakEdge(a, b, streakMap),     // win streaks (positive signal for hot fighter)
    lossStreakEdge(a, b, streakMap), // loss streaks (negative signal for cold fighter)
    postLossEdge(a, b, streakMap),
    tdDefEdge(a, b),
    slpmEdge(a, b),
    reachEdge(a, b),
    stanceEdge(a, b),
  ].filter(Boolean);

  // Bayesian-style combination of independent edges. Imperfect (the edges are
  // not truly independent — e.g. UFC record correlates with age), so we cap
  // aggressively at the end.
  let aProb = 0.5;
  for (const e of edges) {
    const factor = e.favors === 'a' ? (e.pct / 100) : (1 - e.pct / 100);
    aProb = (aProb * factor) / (aProb * factor + (1 - aProb) * (1 - factor));
  }
  // Cap to prevent the model from claiming 80%+ certainty from stacked
  // marginal factors. The hard ceiling is 70%, and we also bound by the
  // strongest single edge + a small bump.
  const strongest = edges.length ? Math.max(...edges.map(e => e.pct)) / 100 : 0.5;
  const cap = Math.min(0.70, strongest + 0.04);
  if (aProb > cap) aProb = cap;
  if (aProb < 1 - cap) aProb = 1 - cap;

  return { edges, aProb };
}

function renderEdgePanel(a, b, streakMap, fightWeightClass) {
  const { edges, aProb } = computeEdges(a, b, streakMap, fightWeightClass);

  if (edges.length === 0) {
    return `
      <div class="edge-panel">
        <div class="edge-eyebrow"><span class="dot"></span>Cannon Fight Lab edges</div>
        <div class="edge-list">
          <div class="edge-row">
            <div class="marker neutral">Even</div>
            <div class="desc">No clear statistical edge for either fighter — this looks like a coin flip on paper.</div>
          </div>
        </div>
        <div class="edge-summary">
          <div class="verdict-label">Verdict</div>
          <div class="verdict-name even">Even matchup</div>
          <div class="verdict-pct even">50<span class="small">%</span></div>
        </div>
      </div>
    `;
  }

  edges.sort((x, y) => y.pct - x.pct);

  const rowsHtml = edges.map(e => `
    <div class="edge-row">
      <div class="marker favors-${e.favors}">${cfl.escapeHtml(cfl.initials(e.favors === 'a' ? a.name : b.name))}</div>
      <div class="desc">${e.desc}</div>
      <div class="pct">${e.pct.toFixed(1)}%</div>
    </div>
  `).join('');

  let verdictName, verdictPct, verdictClass;
  const aPct = aProb * 100;
  if (Math.abs(aProb - 0.5) < 0.025) {
    verdictName = 'Even matchup';
    verdictPct = 50;
    verdictClass = 'even';
  } else {
    const winner = aProb > 0.5 ? a : b;
    verdictName = winner.name;
    verdictPct = aProb > 0.5 ? aPct : (100 - aPct);
    verdictClass = '';
  }

  return `
    <div class="edge-panel">
      <div class="edge-eyebrow"><span class="dot"></span>Cannon Fight Lab edges</div>
      <div class="edge-list">${rowsHtml}</div>
      <div class="edge-summary">
        <div class="verdict-label">Data favors</div>
        <div class="verdict-name ${verdictClass}">${cfl.escapeHtml(verdictName)}</div>
        <div class="verdict-pct ${verdictClass}">${Math.round(verdictPct)}<span class="small">%</span></div>
      </div>
    </div>
  `;
}

// =============================================================================
// COMPARISON-BAR STATS — 3 rows per fight
//
// Each row computes magnitudes for fighter A and B, picks a winner, and renders
// two bar segments diverging from the centerline label. The leader's bar fills
// to the outer edge; the trailing fighter's bar fills proportionally to their
// fraction of the leader's value.
//
// Stats shown (in priority order):
//   1. Strikes per minute (SLpM)  — pace differential
//   2. Takedown defense (%)        — striker-vs-grappler control
//   3. Cardio composite             — late-round sustain (from cardioMap)
// =============================================================================

// Cardio data lookup — fighter_id -> { byWc: {wc -> entry}, career: entry }
// Each entry has {score, tier_word, confidence, r3p_min, fight_count,
// sig_apm_pct, sig_lpm_pct, td_pct} from v_fighter_consistency.
//
// At lookup time (renderQuickStats / cardioEdge) the caller passes the fight's
// weight_class. If we have data at that weight class, use it. Otherwise fall
// back to the CAREER row. This handles fighters moving up/down weight classes.
let _cardioMap = null;

async function loadCardioMap(fighterIds) {
  if (_cardioMap !== null) return _cardioMap;
  const sb = window.cflSupabase;
  _cardioMap = {};
  try {
    // Read from v_fighter_consistency. Each fighter has rows for each weight
    // class they fought at, plus a 'CAREER' row with the cross-weight aggregate.
    const { data, error } = await sb
      .from('v_fighter_consistency')
      .select('fighter_id, weight_class, consistency_score, cardio_tier, confidence_tier, r3p_minutes, recent_fights, sig_apm_ratio_pct, sig_lpm_ratio_pct, td_ratio_pct')
      .in('fighter_id', Array.from(fighterIds));
    if (error) {
      console.warn('Cardio data not available:', error.message);
      return _cardioMap;
    }
    (data || []).forEach(r => {
      const slot = _cardioMap[r.fighter_id] || (_cardioMap[r.fighter_id] = { byWc: {}, career: null });
      const entry = {
        score: r.consistency_score,
        tier_word: r.cardio_tier,           // 'tireless' / 'steady' / 'tapers' / 'fades' / 'collapses'
        confidence: r.confidence_tier,       // 'high' / 'limited'
        r3p_min: r.r3p_minutes,
        fight_count: r.recent_fights,
        sig_apm_pct: r.sig_apm_ratio_pct,
        sig_lpm_pct: r.sig_lpm_ratio_pct,
        td_pct: r.td_ratio_pct,
      };
      if (r.weight_class === 'CAREER') {
        slot.career = entry;
      } else {
        slot.byWc[r.weight_class] = entry;
      }
    });
  } catch (e) {
    console.warn('Cardio data not available:', e.message);
  }
  return _cardioMap;
}

// Look up cardio for a fighter at a specific weight class. Prefer weight-class
// data when it exists with a real tier_word; fall back to CAREER otherwise.
// Returns null when the fighter has no usable data anywhere.
function cardioFor(fighterId, weightClass) {
  if (!_cardioMap) return null;
  const slot = _cardioMap[fighterId];
  if (!slot) return null;
  // Prefer weight-class-specific data when it has a tier
  if (weightClass && slot.byWc[weightClass] && slot.byWc[weightClass].tier_word) {
    return { ...slot.byWc[weightClass], source: 'weight_class' };
  }
  // Fall back to career
  if (slot.career && slot.career.tier_word) {
    return { ...slot.career, source: 'career' };
  }
  return null;
}

// One bar row. Pass the raw values for both fighters and a label.
// `higherIsBetter` controls who the green winner is (false for things like age).
// `format` turns the raw value into the displayed string (e.g. v => v + '%').
function statBarRow(label, va, vb, format, higherIsBetter, opts) {
  opts = opts || {};
  const noData = (va == null && vb == null);
  if (noData) return ''; // skip entirely — don't show empty rows
  const fa = va != null ? format(va) : '—';
  const fb = vb != null ? format(vb) : '—';
  // Determine winner. higherIsBetter=null means neutral — neither side wins
  // (used for height/weight where the "advantage" depends on style, not magnitude).
  let aWins = false, bWins = false;
  if (higherIsBetter !== null && va != null && vb != null && va !== vb) {
    aWins = higherIsBetter ? va > vb : va < vb;
    bWins = !aWins;
  }
  // Bar widths: leader fills 100%, trailer fills proportionally
  const maxAbs = Math.max(Math.abs(va ?? 0), Math.abs(vb ?? 0)) || 1;
  const aPct = va != null ? Math.min(100, (Math.abs(va) / maxAbs) * 100) : 0;
  const bPct = vb != null ? Math.min(100, (Math.abs(vb) / maxAbs) * 100) : 0;
  // Tier tag for cardio rows (small amber pill on low-confidence)
  const aTier = opts.aTier && opts.aTier === 'low' ? '<span class="fstat-tier-tag">limited</span>' : '';
  const bTier = opts.bTier && opts.bTier === 'low' ? '<span class="fstat-tier-tag">limited</span>' : '';
  // Label can optionally link out (e.g. cardio score label -> cardio methodology page)
  const labelInner = opts.labelHref
    ? `<a href="${opts.labelHref}" class="fstat-label-link" title="How this is calculated">${label}</a>`
    : label;
  return `
    <div class="fstat-row">
      <div class="fstat-side left">
        <div class="fstat-bar"><div class="fstat-fill ${aWins ? 'winner' : ''}" style="width:${aPct}%"></div></div>
        <div class="fstat-val ${aWins ? 'winner' : ''}">${fa}</div>
        ${aTier}
      </div>
      <div class="fstat-label">${labelInner}</div>
      <div class="fstat-side right">
        <div class="fstat-bar"><div class="fstat-fill ${bWins ? 'winner' : ''}" style="width:${bPct}%"></div></div>
        <div class="fstat-val ${bWins ? 'winner' : ''}">${fb}</div>
        ${bTier}
      </div>
    </div>
  `;
}

// Text-comparison row for non-numeric stats (stance). Highlights the
// statistically-favored side when known (southpaw in mixed bouts), neutral
// when both fighters share the same value or value is missing.
function statTextRow(label, va, vb, opts) {
  opts = opts || {};
  if (va == null && vb == null) return '';
  const fa = va || '—';
  const fb = vb || '—';
  // opts.winnerSide: 'a' | 'b' | null — caller determines who's favored
  const aWins = opts.winnerSide === 'a';
  const bWins = opts.winnerSide === 'b';
  return `
    <div class="fstat-row">
      <div class="fstat-side left">
        <div class="fstat-bar"><div class="fstat-fill ${aWins ? 'winner' : ''}" style="width:100%"></div></div>
        <div class="fstat-val ${aWins ? 'winner' : ''}">${cfl.escapeHtml(fa)}</div>
      </div>
      <div class="fstat-label">${label}</div>
      <div class="fstat-side right">
        <div class="fstat-bar"><div class="fstat-fill ${bWins ? 'winner' : ''}" style="width:100%"></div></div>
        <div class="fstat-val ${bWins ? 'winner' : ''}">${cfl.escapeHtml(fb)}</div>
      </div>
    </div>
  `;
}

// Determine the favored stance side. Per our southpaw_winrate analysis,
// southpaw beats orthodox at ~51.5% in mixed-stance fights. Same-stance
// matchups have no edge (return null).
function stanceWinnerSide(stanceA, stanceB) {
  if (!stanceA || !stanceB || stanceA === stanceB) return null;
  if (stanceA === 'Southpaw' && stanceB === 'Orthodox') return 'a';
  if (stanceB === 'Southpaw' && stanceA === 'Orthodox') return 'b';
  return null; // switch stance or unknown matchup combos = neutral
}

// Format weight class as a clean number+lbs string. The fight's weight_class
// is the contracted limit (e.g. 'Welterweight' = 170). Both fighters always
// share this, so the row is purely visual symmetry, not a comparison signal.
function formatWeightClass(wc) {
  const map = {
    'Strawweight': '115 lbs',
    'Flyweight': '125 lbs',
    'Bantamweight': '135 lbs',
    'Featherweight': '145 lbs',
    'Lightweight': '155 lbs',
    'Welterweight': '170 lbs',
    'Middleweight': '185 lbs',
    'Light Heavyweight': '205 lbs',
    'Heavyweight': '265 lbs',
    'Catch Weight': 'Catch',
    "Women's Strawweight": '115 lbs',
    "Women's Flyweight": '125 lbs',
    "Women's Bantamweight": '135 lbs',
    "Women's Featherweight": '145 lbs',
  };
  return map[wc] || wc || '—';
}

function renderQuickStats(a, b, fightWeightClass) {
  const cardioA = cardioFor(a.id, fightWeightClass);
  const cardioB = cardioFor(b.id, fightWeightClass);

  // ====================================================================
  // PHYSICALS BLOCK — Tape of the tape, UFC-broadcast convention.
  // Five rows: Age, Height, Weight, Reach, Stance.
  // - Age: younger highlighted green (we already use this as an edge factor)
  // - Height: neutral (taller has range advantage but worse TD def — wash)
  // - Weight: neutral (both fighters always at the contracted limit)
  // - Reach: longer highlighted green (52% edge factor at 2"+ gap)
  // - Stance: southpaw highlighted in mixed-stance bouts (51.5% edge)
  // ====================================================================
  const physRows = [
    statBarRow('Age', a.age, b.age, v => v + '', false),                     // lower=better
    statBarRow('Height', a.height_in, b.height_in, cfl.formatHeight, null),  // neutral
    statTextRow('Weight', formatWeightClass(fightWeightClass), formatWeightClass(fightWeightClass), { winnerSide: null }),
    statBarRow('Reach', a.reach_in, b.reach_in, cfl.formatReach, true),      // longer=better
    statTextRow('Stance', a.stance, b.stance, { winnerSide: stanceWinnerSide(a.stance, b.stance) }),
  ].filter(Boolean);

  // ====================================================================
  // PERFORMANCE BLOCK — derived stats from fight history.
  // ====================================================================
  const perfRows = [
    statBarRow('Strikes / min', a.slpm, b.slpm, v => Number(v).toFixed(1), true),
    statBarRow('Takedown defense', a.td_def, b.td_def, v => v + '%', true),
  ];

  // Cardio row uses a custom renderer because the primary value is a TIER WORD
  // (Tireless / Steady / Tapers / Fades / Collapses) with the numeric score
  // shown muted beneath it. This is what bettors actually read.
  if (cardioA || cardioB) {
    perfRows.push(renderCardioRow(cardioA, cardioB));
  }

  const physHtml = physRows.length
    ? `<div class="fstat-section physicals">${physRows.join('')}</div>`
    : '';
  const perfPopulated = perfRows.filter(Boolean);
  const perfHtml = perfPopulated.length
    ? `<div class="fstat-section performance">${perfPopulated.join('')}</div>`
    : '';

  if (!physHtml && !perfHtml) return '';
  return `<div class="fight-stats">${physHtml}${perfHtml}</div>`;
}

// Custom cardio row: shows tier word as primary, score as secondary.
// Bar length scales with score relative to the higher of the two; winner
// (higher score) is highlighted green. "Limited" tag appears if the
// confidence is limited OR we fell back to career data.
function renderCardioRow(ca, cb) {
  const sa = ca ? (ca.score || 0) : null;
  const sb = cb ? (cb.score || 0) : null;
  if (sa == null && sb == null) return '';

  // Tier word, capitalized
  const cap = w => w ? (w.charAt(0).toUpperCase() + w.slice(1)) : '—';
  const wordA = ca ? cap(ca.tier_word) : '—';
  const wordB = cb ? cap(cb.tier_word) : '—';
  const scoreA = sa != null ? Math.round(sa) : '—';
  const scoreB = sb != null ? Math.round(sb) : '—';

  // Winner = higher score
  let aWins = false, bWins = false;
  if (sa != null && sb != null && sa !== sb) {
    aWins = sa > sb;
    bWins = !aWins;
  }

  // Bar widths proportional to the higher score
  const maxAbs = Math.max(Math.abs(sa ?? 0), Math.abs(sb ?? 0)) || 1;
  const aPct = sa != null ? Math.min(100, (Math.abs(sa) / maxAbs) * 100) : 0;
  const bPct = sb != null ? Math.min(100, (Math.abs(sb) / maxAbs) * 100) : 0;

  // Limited tag if confidence is limited or using career fallback
  const aLimited = ca && (ca.confidence === 'limited' || ca.source === 'career');
  const bLimited = cb && (cb.confidence === 'limited' || cb.source === 'career');
  const aTag = aLimited ? '<span class="fstat-tier-tag">limited</span>' : '';
  const bTag = bLimited ? '<span class="fstat-tier-tag">limited</span>' : '';

  return `
    <div class="fstat-row cardio-row">
      <div class="fstat-side left">
        <div class="fstat-bar"><div class="fstat-fill ${aWins ? 'winner' : ''}" style="width:${aPct}%"></div></div>
        <div class="cardio-stack">
          <div class="cardio-tier-word ${aWins ? 'winner' : ''}">${wordA}</div>
          <div class="cardio-score-small">${scoreA}</div>
        </div>
        ${aTag}
      </div>
      <div class="fstat-label">
        <a href="cardio.html" class="fstat-label-link" title="How this is calculated">Cardio</a>
      </div>
      <div class="fstat-side right">
        <div class="fstat-bar"><div class="fstat-fill ${bWins ? 'winner' : ''}" style="width:${bPct}%"></div></div>
        <div class="cardio-stack">
          <div class="cardio-tier-word ${bWins ? 'winner' : ''}">${wordB}</div>
          <div class="cardio-score-small">${scoreB}</div>
        </div>
        ${bTag}
      </div>
    </div>
  `;
}

async function loadStatOfDay(event) {
  const strip = document.getElementById('statStrip');
  const sb = window.cflSupabase;
  const { count: fightsCount } = await sb.from('fights').select('id', { count: 'exact', head: true });
  const { count: fightersCount } = await sb.from('fighters').select('id', { count: 'exact', head: true });
  strip.innerHTML = `
    <div class="stat-of-day">
      <div class="lbl">Card breakdown</div>
      <div class="big" id="cardBreakdown">—</div>
      <div class="sub">on this card</div>
    </div>
    <div class="stat-of-day">
      <div class="lbl">Database</div>
      <div class="big">${(fightersCount || 0).toLocaleString()} fighters</div>
      <div class="sub">${(fightsCount || 0).toLocaleString()} fights tracked</div>
    </div>
    <div class="stat-of-day">
      <div class="lbl">Stat of the day</div>
      <div class="big" id="statOfDay">Loading…</div>
      <div class="sub" id="statOfDaySub">&nbsp;</div>
    </div>
  `;
  setTimeout(async () => {
    const { data: cardFights } = await sb.from('fights').select('weight_class, is_title_fight').eq('event_id', event.id);
    if (cardFights) {
      const titles = cardFights.filter(f => f.is_title_fight).length;
      document.getElementById('cardBreakdown').innerHTML =
        `${cardFights.length} fights<span class="sec">${titles} title</span>`;
    }
  }, 100);
  loadDailyStat();
}

async function loadDailyStat() {
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const stats = [
    { label: 'Younger fighters win', fallback: { big: '54%', sub: 'of UFC fights since 2010 (sample)' } },
    { label: 'Southpaw vs orthodox', fallback: { big: '52%', sub: 'southpaws beat orthodox in our sample' } },
    { label: 'Most KO wins (UFC)', fallback: { big: 'Coming soon', sub: 'awaiting per-fight stats' } }
  ];
  const pick = stats[dayOfYear % stats.length];
  const out = pick.fallback;
  document.getElementById('statOfDay').textContent = out.big;
  document.getElementById('statOfDaySub').textContent = out.sub;
  document.querySelector('#statStrip .stat-of-day:nth-child(3) .lbl').textContent = pick.label;
}

load();
</script>

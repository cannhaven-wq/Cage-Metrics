<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign in — Cannon Fight Lab</title>
<meta name="description" content="Sign in to Cannon Fight Lab.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://cannonfightlab.com/login.html">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer data-domain="cannonfightlab.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>

<nav class="cfl-nav"></nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">Welcome back. Sign in to access your account.</p>

    <div id="msgArea"></div>

    <form class="auth-form" id="loginForm" autocomplete="on">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-footer">
      <a href="/reset.html">Forgot password?</a>
    </div>
    <div class="auth-footer">
      Don't have an account? <a href="/signup.html">Create one</a>
    </div>
  </div>
</div>

<footer class="cfl-footer"></footer>

<script src="_shared.js"></script>
<script src="_auth.js"></script>
<script>
cfl.renderNav('login');
cfl.renderFooter();

const msgArea = document.getElementById('msgArea');
const form = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');

// Handle redirects from email confirmation, password reset, etc.
const params = new URLSearchParams(window.location.search);
if (params.has('confirmed')) {
  msgArea.innerHTML = '<div class="auth-success">Email confirmed. You can sign in now.</div>';
}
if (params.has('reset')) {
  msgArea.innerHTML = '<div class="auth-success">Password updated. Sign in with your new password.</div>';
}

// If already signed in, bounce to where they were going (or home)
cflAuth.ready().then(() => {
  if (cflAuth.isSignedIn()) {
    const next = params.get('next') || '/';
    window.location.href = next;
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgArea.innerHTML = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const { error } = await cflAuth.signIn(email, password);

  if (error) {
    msgArea.innerHTML = `<div class="auth-error">${cfl.escapeHtml(error.message)}</div>`;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
    return;
  }

  const next = params.get('next') || '/';
  window.location.href = next;
});
</script>
</body>
</html>

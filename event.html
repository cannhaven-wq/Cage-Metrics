<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.min.js" integrity="sha384-9dsYHX1/12VQI+gHRtPXSM3YFsgJ+iIPjTy4WCtY7XbKG/q7MTdZxZhMd4cL9Gif" crossorigin="anonymous"></script>
<script defer data-domain="cannonfightlab.com" src="https://plausible.io/js/script.js"></script>
<style>
  .event-hero {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 32px;
    text-align: center;
  }
  .event-hero h1 {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    margin-bottom: 8px;
  }
  .event-hero .meta {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 14px;
  }
  .event-hero .pill {
    display: inline-block;
    background: var(--bg-3);
    color: var(--text-2);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .event-hero .pill.upcoming { background: var(--red); color: #fff; }

  .model-acc-strip {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .model-acc-strip .acc-label {
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-weight: 700;
  }
  .model-acc-strip .acc-cells {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .model-acc-strip .acc-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 16px;
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    min-width: 76px;
  }
  .model-acc-strip .acc-mv {
    font: 700 11px var(--font-body);
    color: var(--text-3);
    letter-spacing: 0.06em;
  }
  .model-acc-strip .acc-rec {
    font: 700 18px var(--font-display);
    line-height: 1;
    color: var(--text);
  }
  .model-acc-strip .acc-pct {
    font: 600 10px var(--font-body);
    color: var(--text-3);
  }
  .model-acc-strip .acc-rec.good, .model-acc-strip .acc-pct.good { color: var(--green); }
  .model-acc-strip .acc-rec.ok,   .model-acc-strip .acc-pct.ok   { color: var(--text-2); }
  .model-acc-strip .acc-rec.bad,  .model-acc-strip .acc-pct.bad  { color: var(--red); }

  .model-picks-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-3);
  }
  .model-picks-row .mp-label {
    font: 700 10px var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    margin-right: 4px;
  }
  .model-pick-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 999px;
    font: 600 11px var(--font-body);
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-2);
  }
  .model-pick-pill .mp-mv {
    font: 800 10px var(--font-body);
    color: var(--text-3);
    letter-spacing: 0.04em;
  }
  .model-pick-pill .mp-pct { color: var(--text-3); font-weight: 500; }
  .model-pick-pill .mp-mark { font-weight: 700; }
  .model-pick-pill.correct {
    background: rgba(34,197,94,0.10);
    border-color: rgba(34,197,94,0.30);
    color: var(--green);
  }
  .model-pick-pill.correct .mp-mv,
  .model-pick-pill.correct .mp-pct { color: var(--green); opacity: 0.85; }
  .model-pick-pill.value {
    border-color: color-mix(in srgb, var(--blue) 45%, transparent);
    background: color-mix(in srgb, var(--blue) 10%, transparent);
  }
  .model-pick-pill.value .mp-mv { color: var(--blue); }
  .model-pick-pill.wrong {
    background: rgba(239,68,68,0.10);
    border-color: rgba(239,68,68,0.30);
    color: var(--red);
  }
  .model-pick-pill.wrong .mp-mv,
  .model-pick-pill.wrong .mp-pct { color: var(--red); opacity: 0.85; }

  .fight-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .fight-card.main { border-color: var(--red); }
  .fight-card.title { border-color: #d4af37; }
  .fight-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .fight-card-header .badge {
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--red);
    color: #fff;
  }
  .fight-card-header .badge.title { background: #d4af37; color: #1a1a1a; }
  .fight-card-header .weight { color: var(--text-2); }
  .fight-card-header .result-pill {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 11px;
  }

  .fight-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 18px 20px;
  }
  .fight-fighter {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
    /* Grid items default to min-width:auto, so a long fighter name held the
       1fr track open and pushed the right-hand column off the card. */
    min-width: 0;
  }
  .fight-fighter:hover { opacity: 0.85; }
  .fight-fighter.right { flex-direction: row-reverse; text-align: right; }
  .fight-fighter.winner .name { color: var(--green); }
  .fight-fighter.loser .name { color: var(--text-3); }
  .fight-fighter .meta-block { flex: 1; min-width: 0; }
  .fight-fighter .name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fight-fighter .nick { font-size: 12px; color: var(--text-2); font-style: italic; margin-top: 2px; }
  .fight-fighter .record { font-size: 11px; color: var(--text-3); margin-top: 4px; font-family: var(--font-display); }
  .fight-vs {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 800;
    color: var(--red);
    text-align: center;
  }
  .fight-vs .compare {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .fight-vs .compare:hover { color: var(--red); }

  /* Comparison module — tale of the tape and recent form as ONE centred block.
     These used to inherit .fight-body's full-bleed 1fr/auto/1fr tracks, which
     on a wide card threw the two values ~1200px apart with the label marooned
     in the middle. Two numbers that far apart are not a comparison. Capping
     the measure and centring it puts them back in one eyeful, and folding the
     two strips into a single panel drops a hairline off an already banded card. */
  .fight-stats {
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, .014);
    padding: 12px 20px 14px;
  }
  .fs-inner { max-width: 560px; margin: 0 auto; }

  .tot-row {
    display: grid;
    grid-template-columns: 1fr 88px 1fr;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .05);
  }
  .tot-val {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    /* Both values face the label. Capping the module narrowed the box but the
       text still sat at its outer edges — 509px apart, which is not a
       comparison either. Facing them inward makes the gap the label's width. */
    text-align: right;
  }
  .tot-val.right { text-align: left; }
  /* Only the physical-advantage rows (height, reach) mark a side. */
  .tot-val.lead { color: #fff; font-weight: 800; }
  .tot-lbl {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-3);
    text-align: center;
    white-space: nowrap;
  }

  /* Recent form closes the module, so it takes no bottom rule. */
  .fs-form {
    display: grid;
    grid-template-columns: 1fr 88px 1fr;
    align-items: center;
    padding-top: 10px;
  }
  .rf-set { display: flex; gap: 3px; min-width: 0; flex-wrap: wrap; justify-content: flex-end; }
  .rf-set.right { justify-content: flex-start; }
  .rf-pill {
    font-family: var(--font-display);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 5px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .rf-pill.win  { color: var(--green); background: rgba(63, 208, 122, .12); border-color: rgba(63, 208, 122, .3); }
  .rf-pill.loss { color: var(--red);   background: rgba(255, 77, 61, .12);  border-color: rgba(255, 77, 61, .3); }
  .rf-pill.none { color: var(--text-3); background: var(--bg-3); border-color: var(--border); }
  .rf-empty { font-size: 11px; color: var(--text-3); font-style: italic; }

  .fight-result-detail {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 20px;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  /* Model verdict band — shown on every fight, upcoming and past. */
  .fight-verdict {
    border-top: 1px solid var(--border);
    background: var(--bg-3);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .fight-verdict .label {
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .fight-verdict .pick {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .fight-verdict .pick .pct { color: var(--red); margin-left: 6px; font-weight: 600; }
  .fight-verdict.too-close .pick { color: var(--text-3); font-style: italic; font-weight: 500; }
  .fight-verdict .check {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: 0.04em;
  }
  .fight-verdict .check.correct { background: rgba(0,180,90,0.18); color: var(--green); }
  .fight-verdict .check.wrong   { background: rgba(255,56,56,0.18); color: var(--red); }
  /* Distance band sits flush against the winner band (same fight card). */
  .fight-verdict + .fight-verdict { padding-top: 8px; }
  .fight-verdict.distance .pick strong { color: var(--text); font-weight: 700; }
  .fight-verdict.distance .pick .pct { color: var(--red); margin-left: 6px; font-weight: 600; }
  /* Market band — shows consensus odds + the model's edge over the market. */
  .fight-verdict.market .market-odds {
    color: var(--text-3);
    font-family: var(--font-display);
    margin-left: 4px;
  }
  .fight-verdict.market .edge {
    margin-left: auto;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 6px;
    color: var(--text-2);
    background: var(--bg);
  }
  .fight-verdict.market .edge.pos { color: var(--green); background: rgba(0,180,90,0.12); }
  .fight-verdict.market .edge.neg { color: var(--red);   background: rgba(255,56,56,0.10); }
  .fight-verdict.market .value-badge {
    margin-left: 8px;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 6px;
    color: #1a1a1a;
    background: var(--amber, #ffb547);
    letter-spacing: 0.06em;
  }

  /* Model selector — sits above the fight list, lets the user swap which
     variant of the heuristic model runs on every card. Re-renders verdicts
     in place, no page reload. */
  .model-selector {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .model-selector .ms-label {
    font: 700 10px var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--text-3);
  }
  .model-selector select {
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 6px 10px;
    font: 600 12px var(--font-body);
    cursor: pointer;
  }
  .model-selector .ms-blurb {
    font: 500 11px var(--font-body);
    color: var(--text-3);
    margin-left: auto;
    max-width: 380px;
    line-height: 1.4;
  }
  @media (max-width: 560px) {
    .model-selector .ms-blurb { margin-left: 0; max-width: none; }
  }

  /* Method-of-victory pill row — sits inside the winner verdict band, shows
     the picked fighter's expected KO / SUB / DEC split. The pill that
     represents the highest probability is highlighted. */
  .mov-pills {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-left: 6px;
  }
  .mov-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    font: 600 10px var(--font-body);
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    color: var(--text-3);
    letter-spacing: 0.04em;
  }
  .mov-pill .mov-kind { font-weight: 800; color: var(--text-2); }
  .mov-pill.lead {
    background: rgba(255,56,56,0.10);
    border-color: rgba(255,56,56,0.30);
    color: var(--red);
  }
  .mov-pill.lead .mov-kind { color: var(--red); }

  /* "Why this pick?" disclosure under each verdict band. Lists every edge
     factor that fired, who it favors, and its base probability. Collapsed
     by default — visitor opts in. */
  .fight-why {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 0 20px;
  }
  .fight-why summary {
    cursor: pointer;
    padding: 8px 0;
    font: 600 11px var(--font-body);
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    list-style: none;
    user-select: none;
  }
  .fight-why summary::-webkit-details-marker { display: none; }
  .fight-why summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    color: var(--text-3);
    transition: transform 0.15s;
  }
  .fight-why[open] summary::before { transform: rotate(90deg); }
  .fight-why summary:hover { color: var(--text-2); }
  .fight-why .why-body {
    padding: 4px 0 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fight-why .why-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font: 500 12px var(--font-body);
    color: var(--text-2);
    line-height: 1.4;
  }
  .fight-why .why-factor {
    display: inline-block;
    font: 800 10px var(--font-body);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    background: var(--bg-3);
    padding: 3px 8px;
    border-radius: 4px;
    min-width: 72px;
    text-align: center;
  }
  .fight-why .why-pct {
    font: 700 12px var(--font-display);
    color: var(--red);
    min-width: 44px;
  }
  .fight-why .why-fighter { font-weight: 700; color: var(--text); }
  .fight-why .why-none {
    font-style: italic;
    color: var(--text-3);
    padding: 4px 0;
  }
  .fight-why .why-mov {
    border-top: 1px dashed var(--border);
    margin-top: 4px;
    padding-top: 10px;
    font-size: 11px;
    color: var(--text-3);
  }

  /* Net-effect waterfall — visual of how the verdict was built from a 50/50
     coin flip, each edge factor pushing the pick's win probability up (green)
     or down (red), ending at the final verdict (blue). */
  .wf { margin-bottom: 12px; }
  .wf-legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    font: 500 10px var(--font-body); color: var(--text-3);
    margin-bottom: 10px;
  }
  .wf-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .wf-dot { width: 9px; height: 9px; border-radius: 2px; }
  .wf-chart { display: flex; }
  .wf-axis { width: 26px; flex-shrink: 0; position: relative; }
  .wf-axis span {
    position: absolute; right: 5px; transform: translateY(-50%);
    font: 500 10px var(--font-body); color: var(--text-3);
  }
  .wf-plot { flex: 1; position: relative; border-bottom: 1px solid var(--border-2); }
  .wf-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .wf-base { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border-2); }
  .wf-bar {
    position: absolute; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font: 700 11px var(--font-display); letter-spacing: 0.5px;
    color: #fff; overflow: hidden;
  }
  .wf-x { display: flex; margin-top: 6px; padding-left: 26px; }
  .wf-x > div { flex: 1; text-align: center; padding: 0 2px; }
  .wf-xf {
    font: 800 9px var(--font-body); text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-2);
  }
  .wf-xc { font: 600 10px var(--font-body); margin-top: 2px; }
  .wf-cap { font: italic 500 10px var(--font-body); color: var(--text-3); margin-top: 8px; }

  @media (max-width: 768px) {
    .event-hero { padding: 24px 16px; }
    .event-hero h1 { font-size: 26px; }
    /* Both corners stay side by side on a phone, facing each other across the
       VS the way a fight card should. min-width:0 on .fight-fighter is what
       keeps the right-hand column from being clipped off; the room it needs
       comes out of the avatar, which is decoration — 60px plus its gap, per
       corner — and the nickname. Name and record are what you actually read. */
    .fight-body { gap: 6px; padding: 12px 10px; }
    .fight-fighter { gap: 0; }
    .fight-fighter .cfl-avatar { display: none; }
    .fight-fighter .name { font-size: 13px; line-height: 1.15; }
    .fight-fighter .nick { display: none; }
    .fight-fighter .record { font-size: 10px; margin-top: 2px; }
    .fight-fighter .cfl-flag { font-size: 10px; gap: 5px; }
    .fight-fighter .cfl-flag img { width: 16px; height: 11px; }
    .fight-vs { font-size: 14px; }
    .fight-vs .compare { font-size: 8px; letter-spacing: 0.06em; margin-top: 4px; }

    .fight-stats { padding: 9px 10px 11px; }
    .tot-row { grid-template-columns: 1fr 66px 1fr; padding: 5px 0; }
    .tot-val { font-size: 12.5px; }
    .tot-lbl { font-size: 9px; letter-spacing: 0.09em; }

    /* Recent form stays side by side too, under its own corner. Ten pills plus
       a centred label will not cross 343px, so the label takes its own line
       above and the pills drop a step; a narrower screen wraps, never clips. */
    .fs-form { grid-template-columns: 1fr 1fr; gap: 8px; padding-top: 9px; }
    .fs-form > .tot-lbl { grid-column: 1 / -1; order: -1; margin-bottom: 3px; }
    .rf-set { gap: 2px; justify-content: flex-start; }
    .rf-set.right { justify-content: flex-end; }
    .rf-pill { font-size: 8.5px; padding: 2px 3px; letter-spacing: 0; }

    .wf-xf { font-size: 8px; }
    .wf-xc { font-size: 9px; }
  }
</style>
</head>
<body>

<nav class="cfl-nav"></nav>

<div id="content">
  <div class="loading-state" style="padding: 80px;">
    <div class="loading-spinner"></div>
    <div>Loading event…</div>
  </div>
</div>

<footer class="cfl-footer"></footer>

<script src="_shared.js?v=rd15"></script>
<script src="_auth.js"></script>
<script src="edges.js?v=cardio-retired"></script>
<script src="distanceEdges.js"></script>
<script>
cfl.renderNav('home');
cfl.renderFooter();

const eventId = parseInt(cfl.getQueryParam('id'), 10);

function setMeta(attr, key, value) {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute(attr, key);
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', value);
}

function injectJsonLd(id, data) {
  let script = document.getElementById(id);
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = id;
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(data);
}

function updateEventSEO(event, fights, fighterMap) {
  const url = `https://cannonfightlab.com/event.html?id=${event.id}`;
  const dateStr = cfl.formatDate(event.event_date);
  const verb = event.is_upcoming ? 'predictions and edge factors' : 'results and breakdown';
  const title = `${event.name} — UFC ${event.is_upcoming ? 'Predictions' : 'Results'} | Cannon Fight Lab`;
  const fightCount = (fights || []).length;
  const desc = `${event.name} on ${dateStr}${event.location ? ' in ' + event.location : ''}. Full card with model ${verb} for ${fightCount > 0 ? 'all ' + fightCount + ' fights' : 'every fight'}.`;

  document.title = title;
  setMeta('name', 'description', desc);
  setMeta('property', 'og:title', `${event.name} — Cannon Fight Lab`);
  setMeta('property', 'og:description', desc);
  setMeta('property', 'og:url', url);
  setMeta('name', 'twitter:title', `${event.name} — Cannon Fight Lab`);
  setMeta('name', 'twitter:description', desc);

  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.setAttribute('href', url);

  // SportsEvent schema (https://schema.org/SportsEvent)
  const sportsEvent = {
    '@context': 'https://schema.org',
    '@type': 'SportsEvent',
    'name': event.name,
    'sport': 'Mixed Martial Arts',
    'startDate': event.event_date,
    'eventStatus': event.is_upcoming ? 'https://schema.org/EventScheduled' : 'https://schema.org/EventCompleted',
    'eventAttendanceMode': 'https://schema.org/MixedEventAttendanceMode',
    'url': url,
    'organizer': { '@type': 'SportsOrganization', 'name': 'Ultimate Fighting Championship', 'alternateName': 'UFC' }
  };
  if (event.location) {
    sportsEvent.location = { '@type': 'Place', 'name': event.location };
  }
  if (fighterMap && Object.keys(fighterMap).length > 0) {
    sportsEvent.competitor = Object.values(fighterMap).map(f => ({
      '@type': 'Person',
      'name': f.name,
      'url': `https://cannonfightlab.com/fighter.html?id=${f.id}`
    }));
  }
  injectJsonLd('event-schema', sportsEvent);

  injectJsonLd('breadcrumb-schema', {
    '@context': 'https://schema.org',
    '@type': 'BreadcrumbList',
    'itemListElement': [
      { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': 'https://cannonfightlab.com/' },
      { '@type': 'ListItem', 'position': 2, 'name': event.name, 'item': url }
    ]
  });
}

async function load() {
  if (!eventId) {
    document.getElementById('content').innerHTML = cfl.errorHtml('No event id provided.');
    return;
  }

  const sb = window.cflSupabase;

  const { data: event, error } = await sb.from('events').select('*').eq('id', eventId).single();
  if (error || !event) {
    document.getElementById('content').innerHTML = cfl.errorHtml('Event not found.');
    return;
  }

  const { data: fightsRaw } = await sb
    .from('fights')
    .select('*')
    .eq('event_id', event.id);
  // True card order + dead-booking cleanup — see cfl.orderCard in _shared.js.
  const fights = cfl.orderCard(fightsRaw || [], event.name);

  const fighterIds = [...new Set((fights || []).flatMap(f => [f.fighter_a_id, f.fighter_b_id]).filter(Boolean))];
  let fighterMap = {};
  // streakMap, cardioMap, finishRateMap feed the verdict modules. Empty
  // objects are safe — edges.js and distanceEdges.js both short-circuit
  // cleanly when a fighter's entry is missing.
  let streakMap = {};
  let cardioMap = {};
  let finishRateMap = {};
  let oddsMap = {};

  // All four lookups (fighters, cardio, finish-rate, odds) are independent of
  // each other — fanned out in parallel rather than awaited sequentially, which
  // used to add ~4 round trips of latency before render. streakMap is left
  // empty; the v_fighter_recent_form view query was removed when edges.js's
  // streak factors went away.
  const fighterColumns = 'id, name, nickname, age, height_in, ufc_wins, ufc_losses, ufc_draws, wins, losses, draws, slpm, sapm, td_avg, td_acc, td_def, str_acc, str_def, reach_in, stance, last_fight_date, country, country_code';
  const fightIds = (fights || []).map(f => f.id);
  const idList = fighterIds.join(',');
  const [fightersR, cardioR, finishR, oddsR, engPicksR, engEdgesR, formR] = await Promise.all([
    fighterIds.length
      ? sb.from('fighters').select(fighterColumns).in('id', fighterIds)
      : Promise.resolve({ data: [] }),
    fighterIds.length
      ? sb.from('v_fighter_consistency').select('fighter_id, weight_class, cardio_tier, confidence_tier').in('fighter_id', fighterIds)
      : Promise.resolve({ data: [] }),
    fighterIds.length
      ? sb.from('v_fighter_finish_rate').select('fighter_id, total_fights, decision_rate, ko_tko_rate, sub_rate').in('fighter_id', fighterIds)
      : Promise.resolve({ data: [] }),
    sb.from('v_fight_odds_consensus').select('fight_id, american_odds_a, american_odds_b, implied_prob_a, implied_prob_b, bookmaker_count, fetched_at').eq('event_id', event.id),
    // Engine picks + edges. cfl_engine is the canonical stack — the only one
    // with a passed leak audit, PIT structural verification and calibration
    // checks — so it is the only model this page renders. The legacy v1-v6
    // pipeline still runs and still writes to model_predictions; its disclosed
    // archive lives on track-record.html.
    //
    // The graded views join fights server-side, so `hit` / `won` are NULL
    // while a fight is unresolved (render as pending, never as a loss). No
    // honest-window clamp applies: every backtest row is out-of-sample by
    // construction (walk-forward, uncalibrated fold 0 excluded at publish).
    fightIds.length
      ? sb.from('v_model_picks_graded').select('fight_id, p_cal, pick_fighter_id, tier, source, hit').in('fight_id', fightIds)
      : Promise.resolve({ data: [] }),
    fightIds.length
      ? sb.from('v_model_edges_graded').select('fight_id, bet_fighter_id, edge, stake_frac, source, won').in('fight_id', fightIds)
      : Promise.resolve({ data: [] }),
    // Recent form. One batched fetch of every settled fight belonging to any
    // fighter on this card, not one request per fighter — a full card is ~27
    // fighters and ~150 history rows. `method=not.is.null` drops future
    // bookings; the ordering and the five-row cut happen below, because a
    // fight's date lives on `events`, not on `fights`.
    fighterIds.length
      ? cfl.fetchAll(() => sb.from('fights')
          .select('event_id, fighter_a_id, fighter_b_id, winner_id, method, events!inner(event_date)')
          .or(`fighter_a_id.in.(${idList}),fighter_b_id.in.(${idList})`)
          .not('method', 'is', null))
          .then(data => ({ data }), err => ({ data: [], error: err }))
      : Promise.resolve({ data: [] }),
  ]);

  if (fightersR.error) console.warn('Fighter details not available:', fightersR.error.message);
  (fightersR.data || []).forEach(f => { fighterMap[f.id] = f; });

  if (cardioR.error) console.warn('Cardio data not available:', cardioR.error.message);
  (cardioR.data || []).forEach(r => {
    const slot = cardioMap[r.fighter_id] || (cardioMap[r.fighter_id] = { byWc: {}, career: null });
    const entry = { tier_word: r.cardio_tier, confidence: r.confidence_tier };
    if (r.weight_class === 'CAREER') slot.career = entry;
    else slot.byWc[r.weight_class] = entry;
  });

  if (finishR.error) console.warn('Fighter finish-rate data not available:', finishR.error.message);
  (finishR.data || []).forEach(r => { finishRateMap[r.fighter_id] = r; });

  if (oddsR.error) console.warn('Market odds not available:', oddsR.error.message);
  (oddsR.data || []).forEach(r => { oddsMap[r.fight_id] = r; });

  // formMap[fighter_id] = up to five settled fights, oldest first.
  //
  // Only fights BEFORE this event count. On a past event that keeps the card's
  // own result out of its own form row (it is already in the header), and on
  // any event it keeps a later fight from appearing as "recent" form for a
  // bout that happened before it.
  //
  // Win/loss comes from winner_id vs the fighter's own id, never from which
  // slot they sit in — the scraper puts the winner in fighter_a on roughly
  // two thirds of rows, so side is not a result.
  const formMap = {};
  if (formR.error) console.warn('Recent form not available:', formR.error.message);
  (formR.data || []).forEach(r => {
    const d = r.events && r.events.event_date;
    if (!d || !event.event_date || d >= event.event_date) return;
    [r.fighter_a_id, r.fighter_b_id].forEach(fid => {
      if (!fid || !fighterMap[fid]) return;
      (formMap[fid] || (formMap[fid] = [])).push({
        date: d,
        result: r.winner_id == null ? 'draw' : (r.winner_id === fid ? 'win' : 'loss'),
        method: r.method,
      });
    });
  });
  Object.keys(formMap).forEach(fid => {
    formMap[fid] = formMap[fid]
      .sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0))
      .slice(0, 5)
      .reverse();
  });

  // ---------------------------------------------------------------------
  // Engine picks + edges, keyed by fight.
  //   engineByFight[fight_id] = { fighterId, pCal, tier, hit, edge, stakeFrac }
  // A locked 'live' row always outranks a 'backtest' replay row for the same
  // fight (same precedence rule the homepage uses). engineAcc is the graded
  // record on this card — only fights with a known result count.
  // ---------------------------------------------------------------------
  const engineByFight = {};
  const engineAcc = { n: 0, wins: 0 };
  if (engPicksR.error) {
    console.warn('Engine picks not available:', engPicksR.error.message);
  } else {
    const bestPick = {};
    (engPicksR.data || []).forEach(p => {
      const prev = bestPick[p.fight_id];
      if (prev && prev.source === 'live' && p.source !== 'live') return;
      bestPick[p.fight_id] = p;
    });
    Object.values(bestPick).forEach(p => {
      engineByFight[p.fight_id] = {
        fighterId: p.pick_fighter_id,
        pCal: +p.p_cal,
        tier: p.tier,
        hit: p.hit,
        edge: null,
        stakeFrac: null,
      };
      if (p.hit === true)       { engineAcc.n += 1; engineAcc.wins += 1; }
      else if (p.hit === false) { engineAcc.n += 1; }
    });
  }
  if (engEdgesR.error) {
    console.warn('Engine edges not available:', engEdgesR.error.message);
  } else {
    const bestEdge = {};
    (engEdgesR.data || []).forEach(e => {
      const prev = bestEdge[e.fight_id];
      if (prev && prev.source === 'live' && e.source !== 'live') return;
      bestEdge[e.fight_id] = e;
    });
    Object.values(bestEdge).forEach(e => {
      const slot = engineByFight[e.fight_id];
      // Only attach the edge when it backs the same fighter the pick names;
      // otherwise the card would show a % for one man and a stake for the other.
      if (!slot || slot.fighterId !== e.bet_fighter_id) return;
      slot.edge = e.edge != null ? +e.edge : null;
      slot.stakeFrac = e.stake_frac != null ? +e.stake_frac : null;
    });
  }

  updateEventSEO(event, fights, fighterMap);

  // Stash everything renderFight needs so the model selector can re-render
  // verdicts in place when the visitor swaps modes.
  _renderState = {
    fights: fights || [],
    fighterMap,
    isUpcoming: event.is_upcoming,
    streakMap,
    cardioMap,
    finishRateMap,
    oddsMap,
    eventDate: event.event_date,
    engineByFight,
    formMap,
  };

  document.getElementById('content').innerHTML = `
    <div class="event-hero">
      <h1>${cfl.escapeHtml(event.name)}</h1>
      <div class="meta">${cfl.formatDate(event.event_date)} · ${cfl.escapeHtml(event.location || 'Location TBD')}</div>
      <span class="pill ${event.is_upcoming ? 'upcoming' : ''}">${event.is_upcoming ? 'Upcoming' : 'Completed'}</span>
    </div>
    ${renderEngineAccuracyStrip(engineAcc)}
    <div class="page">
      <div id="fightsList">
        ${_renderState.fights.map(f => renderFight(f, fighterMap, event.is_upcoming, streakMap, cardioMap, finishRateMap, oddsMap, event.event_date, engineByFight, _currentModelMode, formMap)).join('')}
      </div>
    </div>
  `;

}

// =============================================================================
// Fight-card re-render
// =============================================================================
// The "Model" dropdown that used to sit here swapped which subset of edge
// factors the client-side heuristic ran on (full / record-only / TD-defence).
// It was removed when cfl_engine became the canonical stack: offering factor
// subsets as selectable "models" reads as a version picker, and users should
// see one set of predictions. The heuristic still runs — it produces the
// "why this pick" factor breakdown below each fight — but only in its full
// form, which is what edges.js ships.

let _renderState = null;
const _currentModelMode = 'full';

// =============================================================================
// Method-of-victory inference
// =============================================================================
// edges.js produces a single winner probability (aProb). It does NOT predict
// finish method directly. We split the winner's probability across KO / SUB /
// DEC using the picked fighter's career finish-rate distribution (from
// v_fighter_finish_rate) as a base, then nudge by matchup-specific signals:
//   - Opponent has fading/collapsing cardio  → boost KO  (gas tank fails late)
//   - Opponent has weak td_def AND we have   → boost SUB (positional control
//     real takedown ability                                opens up subs)
// Returns { ko, sub, dec } that sum to 1. NOT multiplied by aProb — caller
// can do that if it wants the full {pick wins by X} probability.
function computeMOV(picked, opponent, finishRateMap, cardioMap, fightWeightClass) {
  const fr = (finishRateMap || {})[picked.id] || {};
  // Defaults reflect rough UFC base rates: ~30% KO, ~15% SUB, ~55% DEC.
  let ko  = fr.ko_tko_rate  != null ? +fr.ko_tko_rate  : 0.30;
  let sub = fr.sub_rate     != null ? +fr.sub_rate     : 0.15;
  let dec = fr.decision_rate != null ? +fr.decision_rate : 0.55;

  // Opponent's cardio: fades/collapses → boost KO probability.
  if (window.cflEdges && cardioMap) {
    const oppCardio = window.cflEdges.cardioFor(opponent.id, fightWeightClass, cardioMap);
    if (oppCardio && (oppCardio.tier_word === 'fades' || oppCardio.tier_word === 'collapses')) {
      ko += 0.10;
    }
  }
  // Opponent has weak takedown defense AND picked has real grappling output
  // (td_avg ≥ 2 attempts per 15 min) → boost SUB. The td_avg gate prevents
  // boosting SUB for a pure striker who happens to fight a sub-vulnerable
  // grappler.
  if (opponent.td_def != null && opponent.td_def < 60
      && picked.td_avg != null && picked.td_avg >= 2.0) {
    sub += 0.10;
  }

  const total = ko + sub + dec;
  if (total <= 0) return { ko: 0.30, sub: 0.15, dec: 0.55 };
  return { ko: ko / total, sub: sub / total, dec: dec / total };
}

function renderMovPills(mov, pickedFighter) {
  const items = [
    { key: 'ko',  label: 'KO',  pct: mov.ko  * 100 },
    { key: 'sub', label: 'SUB', pct: mov.sub * 100 },
    { key: 'dec', label: 'DEC', pct: mov.dec * 100 },
  ];
  const leader = items.reduce((max, it) => it.pct > max.pct ? it : max, items[0]);
  return `<span class="mov-pills">` + items.map(it =>
    `<span class="mov-pill ${it.key === leader.key ? 'lead' : ''}">
       <span class="mov-kind">${it.label}</span>
       <span>${it.pct.toFixed(0)}%</span>
     </span>`
  ).join('') + `</span>`;
}

// Past-event-only banner showing each public model's pick accuracy on this
// card. Picks are sides where model_p > 0.5 (ties excluded). Renders nothing
// for upcoming events or events without graded predictions. If every graded
// pick was dropped by the honest-window gate (old card inside the models'
// training data), we say so instead of showing hindsight numbers.
function renderEngineAccuracyStrip(engineAcc) {
  if (!engineAcc || !engineAcc.n) return '';
  const pct = engineAcc.wins / engineAcc.n * 100;
  const cls = pct >= 60 ? 'good' : (pct >= 50 ? 'ok' : 'bad');
  return `
    <div class="model-acc-strip">
      <div class="acc-label">How the model did on this card</div>
      <div class="acc-cells">
        <div class="acc-cell">
          <div class="acc-mv">${cfl.escapeHtml(cfl.ENGINE.accuracy.name)}</div>
          <div class="acc-rec ${cls}">${engineAcc.wins}/${engineAcc.n}</div>
          <div class="acc-pct ${cls}">${pct.toFixed(0)}%</div>
        </div>
      </div>
    </div>`;
}

function renderFight(fight, fmap, isUpcoming, streakMap, cardioMap, finishRateMap, oddsMap, eventDate, engineByFight, modelMode, formMap) {
  const a = fmap[fight.fighter_a_id];
  const b = fmap[fight.fighter_b_id];
  if (!a || !b) return '';

  const aWon = !isUpcoming && fight.winner_id === a.id;
  const bWon = !isUpcoming && fight.winner_id === b.id;
  const draw = !isUpcoming && fight.winner_id == null && (fight.method || '').startsWith('Decision');

  const tags = [];
  let cardClass = 'fight-card';
  if (fight.is_title_fight) { tags.push('<span class="badge title">Title</span>'); cardClass += ' title'; }
  if (fight.is_main_event) {
    tags.push('<span class="badge">Main event</span>');
    if (!fight.is_title_fight) cardClass += ' main';
  }

  const resultPill = !isUpcoming && fight.method
    ? `<span class="result-pill" style="color:${fight.method.startsWith('KO') || fight.method.startsWith('TKO') ? 'var(--red)' : fight.method === 'Submission' ? 'var(--blue)' : 'var(--text-2)'}">${cfl.escapeHtml(fight.method)}</span>`
    : '';

  const finishLine = !isUpcoming && fight.end_round
    ? `Round ${fight.end_round} · ${cfl.escapeHtml(fight.end_time || '—')}`
    : '';

  const odds = (oddsMap || {})[fight.id] || null;
  const verdict = renderVerdict(a, b, fight, isUpcoming, streakMap || {}, cardioMap || {}, finishRateMap || {}, odds, eventDate, modelMode);
  const modelPicks = renderEnginePick(fmap, (engineByFight || {})[fight.id]);

  return `
    <div class="${cardClass}">
      <div class="fight-card-header">
        ${tags.join(' ')}
        ${fight.weight_class ? `<span class="weight">${cfl.escapeHtml(fight.weight_class)}</span>` : ''}
        ${resultPill}
      </div>
      <div class="fight-body">
        ${renderFighterSide(a, 'left', aWon, bWon)}
        <div class="fight-vs">
          ${draw ? 'DRAW' : 'VS'}
          <a class="compare" href="${cfl.h2hUrl(a.id, b.id)}">Compare →</a>
        </div>
        ${renderFighterSide(b, 'right', bWon, aWon)}
      </div>
      ${renderStats(a, b, (formMap || {})[a.id], (formMap || {})[b.id])}
      ${finishLine ? `<div class="fight-result-detail">${finishLine}</div>` : ''}
      ${verdict}
      ${modelPicks}
    </div>
  `;
}

// The engine's call on a single fight: who it picks, its calibrated
// confidence, the confidence tier, and — when the engine also flagged this
// fight as +EV — the edge over the vig-free market price and the suggested
// stake. On settled fights the pill is coloured by the result; while a fight
// is unresolved `hit` is null and the pill stays neutral (pending, not a loss).
//
// One pill, one model. The v1-v6 row that used to sit here was removed when
// cfl_engine became canonical; that archive lives on track-record.html.
function renderEnginePick(fmap, eng) {
  if (!eng) return '';
  const picked = fmap[eng.fighterId];
  if (!picked) return '';

  let cls = 'neutral', mark = '';
  if (eng.hit === true)       { cls = 'correct'; mark = ' ✓'; }
  else if (eng.hit === false) { cls = 'wrong';   mark = ' ✗'; }

  const pct = (eng.pCal * 100).toFixed(0);
  const valueBits = (eng.edge != null)
    ? `<span class="model-pick-pill value">
        <span class="mp-mv">VALUE</span>
        <span class="mp-pct">+${(eng.edge * 100).toFixed(0)}% over the market</span>
        ${eng.stakeFrac != null ? `<span class="mp-pct">· ${(eng.stakeFrac * 100).toFixed(1)}% stake</span>` : ''}
      </span>`
    : '';

  return `
    <div class="model-picks-row">
      <span class="mp-label">Model pick</span>
      <span class="model-pick-pill ${cls}">
        <span class="mp-mv">${cfl.escapeHtml(eng.tier)}</span>
        <span class="mp-name">${cfl.escapeHtml(picked.name)}</span>
        <span class="mp-pct">${pct}%</span><span class="mp-mark">${mark}</span>
      </span>
      ${valueBits}
    </div>`;
}

// Renders the model-verdict band on each fight card — winner pick + distance
// prediction stacked. For past fights with a known winner / method we tag
// each band with ✓ or ✗ comparing the model's call to the actual outcome.
//
// Past-event caveat: verdicts here are computed against CURRENT fighter
// career stats, not stats as of the fight date. For very recent events that's
// fine (career averages don't shift in 2 weeks). For older events this is
// hindsight-biased, same issue as research/validate.js.
function renderVerdict(a, b, fight, isUpcoming, streakMap, cardioMap, finishRateMap, marketOdds, eventDate, modelMode) {
  let html = '';

  // Translate the model-selector value into a `factors` whitelist for
  // edges.js. 'full' = all three (no filter). Single-factor modes restrict to
  // one edge type.
  const factorsByMode = {
    full:   null,
    record: ['record'],
    cardio: ['cardio'],
    tddef:  ['td_def'],
  };
  const factors = factorsByMode[modelMode || 'full'];

  // Winner verdict (edges.js). Hoist `edges`, `aProb`, and the picked fighter
  // to function scope so the methodology disclosure at the bottom of the card
  // can render the same edges without recomputing.
  let edges = [];
  let aProb = 0.5;
  let steps = [];
  let capped = false;
  let picked = null;
  let opponent = null;
  if (window.cflEdges) {
    const r = window.cflEdges.computeEdges(a, b, {
      streakMap,
      cardioMap,
      fightWeightClass: fight.weight_class,
      eventDate,
      factors,
    });
    edges = r.edges;
    aProb = r.aProb;
    steps = r.steps || [];
    capped = !!r.capped;

    if (!edges.length || Math.abs(aProb - 0.5) < 0.001) {
      html += '<div class="fight-verdict too-close"><span class="label">Model</span><span class="pick">Too close to call</span></div>';
    } else {
      const pickIsA = aProb > 0.5;
      picked   = pickIsA ? a : b;
      opponent = pickIsA ? b : a;
      const confidence = ((pickIsA ? aProb : 1 - aProb) * 100).toFixed(1);
      const labelText = isUpcoming ? 'Winner pick' : 'Winner picked';

      // Method-of-victory split for the picked fighter. Shown as three pills
      // right after the confidence — visitor sees at a glance whether the
      // model thinks this is a KO matchup, a sub matchup, or a likely
      // decision.
      const mov = computeMOV(picked, opponent, finishRateMap, cardioMap, fight.weight_class);
      const movHtml = renderMovPills(mov, picked);
      const pickHtml = `<span class="pick">${cfl.escapeHtml(picked.name)}<span class="pct">${confidence}%</span>${movHtml}</span>`;

      let checkHtml = '';
      if (!isUpcoming && fight.winner_id != null) {
        const correct = (pickIsA && fight.winner_id === a.id) || (!pickIsA && fight.winner_id === b.id);
        checkHtml = `<span class="check ${correct ? 'correct' : 'wrong'}">${correct ? '✓ Correct' : '✗ Missed'}</span>`;
      }
      html += `<div class="fight-verdict"><span class="label">${labelText}</span>${pickHtml}${checkHtml}</div>`;
    }
  }

  // Distance verdict (distanceEdges.js)
  if (window.cflDistanceEdges) {
    const { distanceProb } = window.cflDistanceEdges.computeDistance(a, b, fight, { cardioMap, finishRateMap });
    const distPct = (distanceProb * 100).toFixed(0);
    const expectsDistance = distanceProb >= 0.50;
    const labelText = isUpcoming ? 'Distance' : 'Distance call';
    const callText = expectsDistance
      ? `<strong>Goes the distance</strong> <span class="pct">${distPct}%</span>`
      : `<strong>Ends early</strong> <span class="pct">${(100 - distPct)}%</span>`;

    let checkHtml = '';
    if (!isUpcoming && fight.method) {
      // Treat any "Decision …" as went-the-distance. KO / TKO / Submission /
      // DQ / Doctor Stop all count as early finishes. NC / Other → skip the ✓/✗
      // tag because we can't honestly grade an inconclusive method.
      const m = fight.method;
      const wentDistance = m.startsWith('Decision');
      const endedEarly   = m.includes('KO') || m.includes('TKO') || m === 'Submission' || m === 'DQ' || m === "Doctor's Stoppage";
      if (wentDistance || endedEarly) {
        const correct = (expectsDistance && wentDistance) || (!expectsDistance && endedEarly);
        checkHtml = `<span class="check ${correct ? 'correct' : 'wrong'}">${correct ? '✓ Correct' : '✗ Missed'}</span>`;
      }
    }
    html += `<div class="fight-verdict distance"><span class="label">${labelText}</span><span class="pick">${callText}</span>${checkHtml}</div>`;
  }

  // Market consensus + edge vs model. Skipped silently if we have no odds
  // row for this fight (most past events won't, since we just started
  // fetching). Edge is model probability minus market-implied probability,
  // both expressed as the side the MODEL picks. Uses the already-computed
  // aProb from the winner band so the market edge respects the model toggle.
  if (marketOdds && window.cflEdges) {
    const modelPickA = aProb > 0.5;
    const modelProb  = modelPickA ? aProb : (1 - aProb);
    const marketProb = modelPickA ? marketOdds.implied_prob_a : marketOdds.implied_prob_b;
    const marketOddsAm = modelPickA ? marketOdds.american_odds_a : marketOdds.american_odds_b;
    const pickedName = modelPickA ? a.name : b.name;
    if (marketProb != null) {
      const edgePp = (modelProb - marketProb) * 100;
      const edgeRound = Math.round(edgePp);
      // Sign formatting + value badge threshold (>=3pp model-over-market edge
      // on the model's pick = "value bet")
      const edgeStr = (edgeRound > 0 ? '+' : '') + edgeRound + 'pp';
      const isValue = edgePp >= 3;
      const oddsStr = marketOddsAm != null ? (marketOddsAm > 0 ? '+' + marketOddsAm : String(marketOddsAm)) : '—';
      const labelText = isUpcoming ? 'Market' : 'Closing market';
      const valueBadge = isValue ? '<span class="value-badge">⚡ Value</span>' : '';
      html += `<div class="fight-verdict market">
        <span class="label">${labelText}</span>
        <span class="pick">${cfl.escapeHtml(pickedName)} <span class="market-odds">${oddsStr}</span> <span class="pct">${Math.round(marketProb * 100)}%</span></span>
        <span class="edge ${edgePp > 0 ? 'pos' : (edgePp < 0 ? 'neg' : '')}">Edge ${edgeStr}</span>
        ${valueBadge}
      </div>`;
    }
  }

  // "Why this pick?" disclosure. Lists every edge factor that fired plus a
  // plain-text gloss on the method-of-victory split. Collapsed by default
  // so visitors who just want the call aren't buried in detail.
  if (window.cflEdges) {
    const waterfall = (picked && steps.length)
      ? renderVerdictWaterfall(steps, aProb > 0.5, (aProb > 0.5 ? aProb : 1 - aProb) * 100, capped, picked.name)
      : '';
    const whyRows = edges.length
      ? edges.map(renderWhyRow).join('')
      : '<div class="why-none">No clear edges in this matchup — coin flip on paper.</div>';
    const movExplanation = picked
      ? renderMovExplanation(picked, opponent, finishRateMap, cardioMap, fight.weight_class)
      : '';
    html += `
      <details class="fight-why">
        <summary>Why this pick?</summary>
        <div class="why-body">
          ${waterfall}
          ${whyRows}
          ${movExplanation}
        </div>
      </details>`;
  }

  return html;
}

function renderWhyRow(edge) {
  const factorLabel = edge.factor === 'td_def' ? 'TD Def'
                    : edge.factor.charAt(0).toUpperCase() + edge.factor.slice(1);
  return `
    <div class="why-row">
      <span class="why-factor">${factorLabel}</span>
      <span class="why-pct">${edge.pct.toFixed(0)}%</span>
      <span><span class="why-fighter">${cfl.escapeHtml(edge.fighterName)}</span> ${cfl.escapeHtml(edge.desc)}</span>
    </div>`;
}

// Draws the net-effect waterfall: a 50/50 coin flip, then each edge factor
// pushing the picked fighter's win probability up (green) or down (red),
// ending at the final verdict (blue). Driven by the `steps` array edges.js
// returns so the Bayesian math stays in one place.
function renderVerdictWaterfall(steps, pickIsA, finalPickPct, capped, pickedName) {
  const PLOT = 150;
  const lastName = n => { const t = String(n || '').trim().split(/\s+/); return t[t.length - 1] || n; };
  const factorLabel = f => f === 'td_def' ? 'TD Def' : f.charAt(0).toUpperCase() + f.slice(1);

  // Running pick-side win % after each step (A-prob -> pick-prob), bookended by
  // the 50% coin flip and the final (capped) verdict.
  const toPick = v => (pickIsA ? v : 1 - v) * 100;
  const vals = [50];
  steps.forEach(s => vals.push(toPick(s.aProbAfter)));
  vals.push(finalPickPct);

  // Auto-scale the axis around the values so small moves stay visible.
  const lo = Math.min(50, Math.min.apply(null, vals));
  const hi = Math.max.apply(null, vals);
  const vMin = Math.max(0, Math.floor(lo) - 6);
  let vMax = Math.min(100, Math.ceil(hi) + 6);
  if (vMax - vMin < 24) vMax = Math.min(100, vMin + 24);
  const span = vMax - vMin;
  const y = v => PLOT * (vMax - v) / span;

  const nCols = steps.length + 2;
  const colW = 100 / nCols;
  const barW = Math.min(13, colW * 0.5);
  const barLeft = i => (i + 0.5) * colW - barW / 2;
  const bar = (i, top, h, bg, label) =>
    `<div class="wf-bar" style="left:${barLeft(i).toFixed(2)}%;width:${barW.toFixed(2)}%;top:${top.toFixed(1)}px;height:${Math.max(h, 3).toFixed(1)}px;background:${bg};">${label}</div>`;

  let grid = '';
  for (let g = Math.ceil(vMin / 10) * 10; g <= vMax; g += 10) {
    grid += `<div class="wf-grid" style="top:${y(g).toFixed(1)}px;"></div>`;
  }
  grid += `<div class="wf-base" style="top:${y(50).toFixed(1)}px;"></div>`;

  const axis = `<span style="top:${y(vMax).toFixed(1)}px;">${Math.round(vMax)}</span>`
             + `<span style="top:${y(50).toFixed(1)}px;">50</span>`
             + `<span style="top:${y(vMin).toFixed(1)}px;">${Math.round(vMin)}</span>`;

  let bars = bar(0, y(50), PLOT - y(50), '#4b5563', '50%');
  let xcells = `<div><div class="wf-xf">Coin flip</div><div class="wf-xc" style="color:var(--text-3);">even</div></div>`;

  for (let i = 0; i < steps.length; i++) {
    const from = vals[i], to = vals[i + 1];
    const up = to >= from;
    const color = up ? 'var(--green)' : 'var(--red)';
    const delta = to - from;
    const lbl = (delta >= 0 ? '+' : '−') + Math.abs(delta).toFixed(1);
    bars += bar(i + 1, y(Math.max(from, to)), Math.abs(y(from) - y(to)), color, lbl);
    xcells += `<div><div class="wf-xf">${factorLabel(steps[i].factor)}</div>`
            + `<div class="wf-xc" style="color:${color};">${cfl.escapeHtml(lastName(steps[i].fighterName))}</div></div>`;
  }

  const vi = nCols - 1;
  bars += bar(vi, y(finalPickPct), PLOT - y(finalPickPct), 'var(--blue)', finalPickPct.toFixed(1) + '%');
  xcells += `<div><div class="wf-xf">Verdict</div><div class="wf-xc" style="color:var(--blue);">${cfl.escapeHtml(lastName(pickedName))}</div></div>`;

  const capNote = capped
    ? '<div class="wf-cap">Capped to avoid over-confidence from stacked edges.</div>'
    : '';

  return `
    <div class="wf">
      <div class="wf-legend">
        <span><span class="wf-dot" style="background:var(--green);"></span>helps the pick</span>
        <span><span class="wf-dot" style="background:var(--red);"></span>helps the opponent</span>
        <span><span class="wf-dot" style="background:var(--blue);"></span>final verdict</span>
      </div>
      <div class="wf-chart">
        <div class="wf-axis" style="height:${PLOT}px;">${axis}</div>
        <div class="wf-plot" style="height:${PLOT}px;">${grid}${bars}</div>
      </div>
      <div class="wf-x">${xcells}</div>
      ${capNote}
    </div>`;
}

function renderMovExplanation(picked, opponent, finishRateMap, cardioMap, fightWeightClass) {
  const reasons = [];
  const fr = (finishRateMap || {})[picked.id];
  if (fr && fr.ko_tko_rate != null && +fr.ko_tko_rate >= 0.40) {
    reasons.push(`${picked.name} finishes ${(fr.ko_tko_rate * 100).toFixed(0)}% of wins by KO/TKO`);
  }
  if (fr && fr.sub_rate != null && +fr.sub_rate >= 0.30) {
    reasons.push(`${picked.name} finishes ${(fr.sub_rate * 100).toFixed(0)}% of wins by submission`);
  }
  if (window.cflEdges && cardioMap) {
    const oppCardio = window.cflEdges.cardioFor(opponent.id, fightWeightClass, cardioMap);
    if (oppCardio && (oppCardio.tier_word === 'fades' || oppCardio.tier_word === 'collapses')) {
      reasons.push(`${opponent.name}'s cardio (${oppCardio.tier_word}) opens up late KO`);
    }
  }
  if (opponent.td_def != null && opponent.td_def < 60
      && picked.td_avg != null && picked.td_avg >= 2.0) {
    reasons.push(`${opponent.name} only ${opponent.td_def}% TD defense vs ${picked.name}'s grappling`);
  }
  if (!reasons.length) return '';
  return `<div class="why-mov"><strong>Method signals:</strong> ${reasons.map(r => cfl.escapeHtml(r)).join(' · ')}</div>`;
}

// The comparison module: tale of the tape, then recent form, in one centred
// panel under the two names.
//
// Height and reach bold the bigger number because bigger is the advantage.
// Age and stance don't: older is not worse, and southpaw is not better than
// orthodox — bolding either would be us making a claim we can't support.
// A null shows a dash and keeps its row, so the panel is the same height on
// every card and the eye can run straight down the labels.
//
// No weight row. Weight isn't stored as a number, and the division is already
// in the card header.
function renderStats(a, b, formA, formB) {
  return `
    <div class="fight-stats">
      <div class="fs-inner">
        ${tapeRow('Height', a.height_in, b.height_in, v => cfl.formatHeight(v), true)}
        ${tapeRow('Reach', a.reach_in, b.reach_in, v => cfl.formatReach(Math.round(v * 10) / 10), true)}
        ${tapeRow('Age', a.age, b.age, v => String(v), false)}
        ${tapeRow('Stance', a.stance, b.stance, v => String(v), false)}
        ${renderForm(formA, formB)}
      </div>
    </div>
  `;
}

function tapeRow(label, va, vb, fmt, boldLarger) {
  const has = v => v != null && v !== '';
  let ca = 'tot-val', cb = 'tot-val right';
  if (boldLarger && has(va) && has(vb) && va !== vb) {
    if (va > vb) ca += ' lead'; else cb += ' lead';
  }
  const fa = has(va) ? cfl.escapeHtml(fmt(va)) : '—';
  const fb = has(vb) ? cfl.escapeHtml(fmt(vb)) : '—';
  return `
    <div class="tot-row">
      <div class="${ca}">${fa}</div>
      <div class="tot-lbl">${label}</div>
      <div class="${cb}">${fb}</div>
    </div>
  `;
}

// Last five, oldest on the left, newest on the right — the same direction a
// record reads. Built from the fights table: `fighters.last_5` is a bare
// W/L/dash string with no method in it and a length that doesn't always
// reach five, so it can't fill this row.
function renderForm(formA, formB) {
  if (!(formA && formA.length) && !(formB && formB.length)) return '';
  return `
    <div class="fs-form">
      ${formSet(formA, '')}
      <div class="tot-lbl">Last 5</div>
      ${formSet(formB, ' right')}
    </div>
  `;
}

// Each set sits under its own corner at every width, so it needs no name.
function formSet(rows, side) {
  if (!rows || !rows.length) {
    return `<div class="rf-set${side}"><span class="rf-empty">No UFC fights yet</span></div>`;
  }
  return `<div class="rf-set${side}">${rows.map(formPill).join('')}</div>`;
}

// KO/TKO and doctor's stoppage are both KO. Overturned, DQ, could-not-continue
// and anything unrecognised are NC — those carry no W or L, so the pill is
// just the two letters.
function formShortMethod(m) {
  const s = String(m || '');
  if (/^(KO|TKO)/i.test(s)) return 'KO';
  if (/^Sub/i.test(s)) return 'SUB';
  if (/^Dec/i.test(s)) return 'DEC';
  return 'NC';
}

function formPill(r) {
  const method = formShortMethod(r.method);
  const cls = r.result === 'win' ? 'win' : r.result === 'loss' ? 'loss' : 'none';
  const mark = r.result === 'win' ? 'W' : r.result === 'loss' ? 'L' : 'D';
  const text = method === 'NC' ? 'NC' : `${mark} ${method}`;
  return `<span class="rf-pill ${cls}">${text}</span>`;
}

function renderFighterSide(f, side, won, opponentWon) {
  let cls = 'fight-fighter ' + side;
  if (won) cls += ' winner';
  else if (opponentWon) cls += ' loser';
  const recordStr = (f.ufc_wins ?? 0) + (f.ufc_losses ?? 0) + (f.ufc_draws ?? 0) > 0
    ? `${f.ufc_wins ?? 0}-${f.ufc_losses ?? 0}${f.ufc_draws ? '-' + f.ufc_draws : ''} UFC`
    : `${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''} career`;
  // These rows are wide, so the background wash used on the home card would
  // read as a colour bar. State the country instead — there is room for it.
  return `
    <a class="${cls}" href="${cfl.fighterUrl(f.id)}">
      <div class="cfl-avatar lg">${cfl.escapeHtml(cfl.initials(f.name))}</div>
      <div class="meta-block">
        <div class="name">${cfl.escapeHtml(f.name)}</div>
        ${f.nickname ? `<div class="nick">"${cfl.escapeHtml(f.nickname)}"</div>` : ''}
        <div class="record">${recordStr}</div>
        ${cfl.flagChip ? cfl.flagChip(f) : ''}
      </div>
    </a>
  `;
}

load().catch(err => {
  console.error('[event] load failed:', err);
  document.getElementById('content').innerHTML = cfl.errorHtml(
    'Failed to load this event: ' + (err && err.message ? err.message : err) +
    '. Try refreshing the page.'
  );
});
</script>
</body>
</html>

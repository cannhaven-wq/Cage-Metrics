<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== Primary SEO =====
     Static defaults. Per-event values are overwritten at runtime by
     updateSEO() once the event loads from Supabase. -->
<title>UFC Event Card — Predictions & Edge Factors | Cannon Fight Lab</title>
<meta name="description" content="Full UFC event card with model verdicts and edge factors for every fight. See cardio, striking, grappling, and matchup edges before the cage closes.">
<meta name="keywords" content="UFC event card, UFC fight predictions, UFC event analysis, MMA event picks, UFC fight breakdown">
<meta name="author" content="Cannon Fight Lab">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://cannonfightlab.com/event.html">

<!-- ===== Open Graph ===== -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="Cannon Fight Lab">
<meta property="og:title" content="UFC Event Card — Cannon Fight Lab">
<meta property="og:description" content="Full UFC event card with model verdicts and edge factors for every fight.">
<meta property="og:url" content="https://cannonfightlab.com/event.html">
<meta property="og:image" content="https://cannonfightlab.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cannon Fight Lab — UFC event card analysis">
<meta property="og:locale" content="en_US">

<!-- ===== Twitter Card ===== -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UFC Event Card — Cannon Fight Lab">
<meta name="twitter:description" content="Full UFC event card with model verdicts and edge factors for every fight.">
<meta name="twitter:image" content="https://cannonfightlab.com/og-image.png">

<!-- ===== Theme & favicon ===== -->
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- ===== Fonts & styles ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://uftancejftcryfvbggll.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">

<!-- ===== Scripts ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer data-domain="cannonfightlab.com" src="https://plausible.io/js/script.js"></script>
<style>
  .event-hero {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 32px;
    text-align: center;
  }
  .event-hero h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 38px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    margin-bottom: 8px;
  }
  .event-hero .meta {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 14px;
  }
  .event-hero .pill {
    display: inline-block;
    background: var(--bg-3);
    color: var(--text-2);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .event-hero .pill.upcoming { background: var(--red); color: #fff; }

  .fight-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .fight-card.main { border-color: var(--red); }
  .fight-card.title { border-color: #d4af37; }
  .fight-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .fight-card-header .badge {
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--red);
    color: #fff;
  }
  .fight-card-header .badge.title { background: #d4af37; color: #1a1a1a; }
  .fight-card-header .weight { color: var(--text-2); }
  .fight-card-header .result-pill {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
  }

  .fight-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 18px 20px;
  }
  .fight-fighter {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .fight-fighter:hover { opacity: 0.85; }
  .fight-fighter.right { flex-direction: row-reverse; text-align: right; }
  .fight-fighter.winner .name { color: var(--green); }
  .fight-fighter.loser .name { color: var(--text-3); }
  .fight-fighter .meta-block { flex: 1; min-width: 0; }
  .fight-fighter .name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fight-fighter .nick { font-size: 12px; color: var(--text-2); font-style: italic; margin-top: 2px; }
  .fight-fighter .record { font-size: 11px; color: var(--text-3); margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; }
  .fight-vs {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--red);
    text-align: center;
  }
  .fight-vs .compare {
    display: block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .fight-vs .compare:hover { color: var(--red); }

  .fight-result-detail {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 20px;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  /* Model verdict band — shown on every fight, upcoming and past. */
  .fight-verdict {
    border-top: 1px solid var(--border);
    background: var(--bg-3);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .fight-verdict .label {
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }
  .fight-verdict .pick {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .fight-verdict .pick .pct { color: var(--red); margin-left: 6px; font-weight: 600; }
  .fight-verdict.too-close .pick { color: var(--text-3); font-style: italic; font-weight: 500; }
  .fight-verdict .check {
    margin-left: auto;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: 0.04em;
  }
  .fight-verdict .check.correct { background: rgba(0,180,90,0.18); color: var(--green); }
  .fight-verdict .check.wrong   { background: rgba(255,56,56,0.18); color: var(--red); }

  @media (max-width: 768px) {
    .event-hero { padding: 24px 16px; }
    .event-hero h1 { font-size: 26px; }
    .fight-body { gap: 8px; padding: 14px 12px; }
    .fight-fighter .name { font-size: 16px; }
  }
</style>
</head>
<body>

<nav class="cfl-nav"></nav>

<div id="content">
  <div class="loading-state" style="padding: 80px;">
    <div class="loading-spinner"></div>
    <div>Loading event…</div>
  </div>
</div>

<footer class="cfl-footer"></footer>

<script src="_shared.js"></script>
<script src="_auth.js"></script>
<script src="edges.js"></script>
<script>
cfl.renderNav('home');
cfl.renderFooter();

const eventId = parseInt(cfl.getQueryParam('id'), 10);

function setMeta(attr, key, value) {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute(attr, key);
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', value);
}

function injectJsonLd(id, data) {
  let script = document.getElementById(id);
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = id;
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(data);
}

function updateEventSEO(event, fights, fighterMap) {
  const url = `https://cannonfightlab.com/event.html?id=${event.id}`;
  const dateStr = cfl.formatDate(event.event_date);
  const verb = event.is_upcoming ? 'predictions and edge factors' : 'results and breakdown';
  const title = `${event.name} — UFC ${event.is_upcoming ? 'Predictions' : 'Results'} | Cannon Fight Lab`;
  const fightCount = (fights || []).length;
  const desc = `${event.name} on ${dateStr}${event.location ? ' in ' + event.location : ''}. Full card with model ${verb} for ${fightCount > 0 ? 'all ' + fightCount + ' fights' : 'every fight'}.`;

  document.title = title;
  setMeta('name', 'description', desc);
  setMeta('property', 'og:title', `${event.name} — Cannon Fight Lab`);
  setMeta('property', 'og:description', desc);
  setMeta('property', 'og:url', url);
  setMeta('name', 'twitter:title', `${event.name} — Cannon Fight Lab`);
  setMeta('name', 'twitter:description', desc);

  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.setAttribute('href', url);

  // SportsEvent schema (https://schema.org/SportsEvent)
  const sportsEvent = {
    '@context': 'https://schema.org',
    '@type': 'SportsEvent',
    'name': event.name,
    'sport': 'Mixed Martial Arts',
    'startDate': event.event_date,
    'eventStatus': event.is_upcoming ? 'https://schema.org/EventScheduled' : 'https://schema.org/EventCompleted',
    'eventAttendanceMode': 'https://schema.org/MixedEventAttendanceMode',
    'url': url,
    'organizer': { '@type': 'SportsOrganization', 'name': 'Ultimate Fighting Championship', 'alternateName': 'UFC' }
  };
  if (event.location) {
    sportsEvent.location = { '@type': 'Place', 'name': event.location };
  }
  if (fighterMap && Object.keys(fighterMap).length > 0) {
    sportsEvent.competitor = Object.values(fighterMap).map(f => ({
      '@type': 'Person',
      'name': f.name,
      'url': `https://cannonfightlab.com/fighter.html?id=${f.id}`
    }));
  }
  injectJsonLd('event-schema', sportsEvent);

  injectJsonLd('breadcrumb-schema', {
    '@context': 'https://schema.org',
    '@type': 'BreadcrumbList',
    'itemListElement': [
      { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': 'https://cannonfightlab.com/' },
      { '@type': 'ListItem', 'position': 2, 'name': event.name, 'item': url }
    ]
  });
}

async function load() {
  if (!eventId) {
    document.getElementById('content').innerHTML = cfl.errorHtml('No event id provided.');
    return;
  }

  const sb = window.cflSupabase;

  const { data: event, error } = await sb.from('events').select('*').eq('id', eventId).single();
  if (error || !event) {
    document.getElementById('content').innerHTML = cfl.errorHtml('Event not found.');
    return;
  }

  const { data: fights } = await sb
    .from('fights')
    .select('*')
    .eq('event_id', event.id)
    .order('is_main_event', { ascending: false })
    .order('id', { ascending: true });

  const fighterIds = [...new Set((fights || []).flatMap(f => [f.fighter_a_id, f.fighter_b_id]).filter(Boolean))];
  let fighterMap = {};
  // streakMap and cardioMap feed cflEdges.computeEdges. Empty objects are
  // safe — edges.js short-circuits cleanly when a fighter is missing.
  let streakMap = {};
  let cardioMap = {};

  if (fighterIds.length > 0) {
    // Need every column edges.js touches (age, reach, stance, striking/grappling
    // averages, td defense). Without them, the verdict has nothing to chew on.
    const { data: fighters } = await sb
      .from('fighters')
      .select('id, name, nickname, age, ufc_wins, ufc_losses, ufc_draws, wins, losses, draws, slpm, sapm, td_avg, td_acc, td_def, str_acc, str_def, reach_in, stance, last_fight_date')
      .in('id', fighterIds);
    (fighters || []).forEach(f => { fighterMap[f.id] = f; });

    // Recent form (current_streak / last_result) — matches the shape used by
    // index.html so verdicts stay consistent across pages.
    try {
      const { data: streaks } = await sb
        .from('v_fighter_recent_form')
        .select('fighter_id, last_result, current_streak, last_5')
        .in('fighter_id', fighterIds);
      (streaks || []).forEach(s => {
        const raw = s.current_streak || 0;
        streakMap[s.fighter_id] = {
          last_result: s.last_result,
          win_streak:  raw > 0 ? raw : 0,
          loss_streak: raw < 0 ? Math.abs(raw) : 0,
          last_5: s.last_5,
        };
      });
    } catch (e) {
      console.warn('Recent form data not available:', e.message);
    }

    // Cardio scores per weight class + CAREER fallback row.
    try {
      const { data: cardio } = await sb
        .from('v_fighter_consistency')
        .select('fighter_id, weight_class, cardio_tier, confidence_tier')
        .in('fighter_id', fighterIds);
      (cardio || []).forEach(r => {
        const slot = cardioMap[r.fighter_id] || (cardioMap[r.fighter_id] = { byWc: {}, career: null });
        const entry = { tier_word: r.cardio_tier, confidence: r.confidence_tier };
        if (r.weight_class === 'CAREER') slot.career = entry;
        else slot.byWc[r.weight_class] = entry;
      });
    } catch (e) {
      console.warn('Cardio data not available:', e.message);
    }
  }

  updateEventSEO(event, fights, fighterMap);

  document.getElementById('content').innerHTML = `
    <div class="event-hero">
      <h1>${cfl.escapeHtml(event.name)}</h1>
      <div class="meta">${cfl.formatDate(event.event_date)} · ${cfl.escapeHtml(event.location || 'Location TBD')}</div>
      <span class="pill ${event.is_upcoming ? 'upcoming' : ''}">${event.is_upcoming ? 'Upcoming' : 'Completed'}</span>
    </div>
    <div class="page">
      <div id="fightsList">
        ${(fights || []).map(f => renderFight(f, fighterMap, event.is_upcoming, streakMap, cardioMap, event.event_date)).join('')}
      </div>
    </div>
  `;
}

function renderFight(fight, fmap, isUpcoming, streakMap, cardioMap, eventDate) {
  const a = fmap[fight.fighter_a_id];
  const b = fmap[fight.fighter_b_id];
  if (!a || !b) return '';

  const aWon = !isUpcoming && fight.winner_id === a.id;
  const bWon = !isUpcoming && fight.winner_id === b.id;
  const draw = !isUpcoming && fight.winner_id == null && (fight.method || '').startsWith('Decision');

  const tags = [];
  let cardClass = 'fight-card';
  if (fight.is_title_fight) { tags.push('<span class="badge title">Title</span>'); cardClass += ' title'; }
  if (fight.is_main_event) {
    tags.push('<span class="badge">Main event</span>');
    if (!fight.is_title_fight) cardClass += ' main';
  }

  const resultPill = !isUpcoming && fight.method
    ? `<span class="result-pill" style="color:${fight.method.startsWith('KO') || fight.method.startsWith('TKO') ? 'var(--red)' : fight.method === 'Submission' ? 'var(--blue)' : 'var(--text-2)'}">${cfl.escapeHtml(fight.method)}</span>`
    : '';

  const finishLine = !isUpcoming && fight.end_round
    ? `Round ${fight.end_round} · ${cfl.escapeHtml(fight.end_time || '—')}`
    : '';

  const verdict = renderVerdict(a, b, fight, isUpcoming, streakMap || {}, cardioMap || {}, eventDate);

  return `
    <div class="${cardClass}">
      <div class="fight-card-header">
        ${tags.join(' ')}
        ${fight.weight_class ? `<span class="weight">${cfl.escapeHtml(fight.weight_class)}</span>` : ''}
        ${resultPill}
      </div>
      <div class="fight-body">
        ${renderFighterSide(a, 'left', aWon, bWon)}
        <div class="fight-vs">
          ${draw ? 'DRAW' : 'VS'}
          <a class="compare" href="${cfl.h2hUrl(a.id, b.id)}">Compare →</a>
        </div>
        ${renderFighterSide(b, 'right', bWon, aWon)}
      </div>
      ${finishLine ? `<div class="fight-result-detail">${finishLine}</div>` : ''}
      ${verdict}
    </div>
  `;
}

// Renders the model-verdict band on each fight card. For upcoming fights this
// is just the pick. For past fights with a known winner we also tag the band
// with ✓ or ✗ comparing the model's pick to the actual outcome.
//
// Past-event caveat: verdicts here are computed against CURRENT fighter
// career stats, not stats as of the fight date. For very recent events that's
// fine (career averages don't shift in 2 weeks). For older events this is
// hindsight-biased, same issue as research/validate.js.
function renderVerdict(a, b, fight, isUpcoming, streakMap, cardioMap, eventDate) {
  if (!window.cflEdges) return '';
  const { edges, aProb } = window.cflEdges.computeEdges(a, b, {
    streakMap,
    cardioMap,
    fightWeightClass: fight.weight_class,
    eventDate,
  });

  if (!edges.length || Math.abs(aProb - 0.5) < 0.001) {
    return '<div class="fight-verdict too-close"><span class="label">Model</span><span class="pick">Too close to call</span></div>';
  }

  const pickIsA = aProb > 0.5;
  const picked  = pickIsA ? a : b;
  const confidence = ((pickIsA ? aProb : 1 - aProb) * 100).toFixed(1);
  const labelText = isUpcoming ? 'Model pick' : 'Model picked';
  const pickHtml = `<span class="pick">${cfl.escapeHtml(picked.name)}<span class="pct">${confidence}%</span></span>`;

  let checkHtml = '';
  if (!isUpcoming && fight.winner_id != null) {
    const correct = (pickIsA && fight.winner_id === a.id) || (!pickIsA && fight.winner_id === b.id);
    checkHtml = `<span class="check ${correct ? 'correct' : 'wrong'}">${correct ? '✓ Correct' : '✗ Missed'}</span>`;
  }

  return `<div class="fight-verdict"><span class="label">${labelText}</span>${pickHtml}${checkHtml}</div>`;
}

function renderFighterSide(f, side, won, opponentWon) {
  let cls = 'fight-fighter ' + side;
  if (won) cls += ' winner';
  else if (opponentWon) cls += ' loser';
  const recordStr = (f.ufc_wins ?? 0) + (f.ufc_losses ?? 0) + (f.ufc_draws ?? 0) > 0
    ? `${f.ufc_wins ?? 0}-${f.ufc_losses ?? 0}${f.ufc_draws ? '-' + f.ufc_draws : ''} UFC`
    : `${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''} career`;
  return `
    <a class="${cls}" href="${cfl.fighterUrl(f.id)}">
      <div class="cfl-avatar lg">${cfl.escapeHtml(cfl.initials(f.name))}</div>
      <div class="meta-block">
        <div class="name">${cfl.escapeHtml(f.name)}</div>
        ${f.nickname ? `<div class="nick">"${cfl.escapeHtml(f.nickname)}"</div>` : ''}
        <div class="record">${recordStr}</div>
      </div>
    </a>
  `;
}

load();
</script>
</body>
</html>

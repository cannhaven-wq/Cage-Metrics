<!DOCTYPE html>
<html lang="en">
<head>

<!-- ===== Fonts & styles ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://uftancejftcryfvbggll.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css?v=lab1">

<!-- ===== Scripts ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.1/dist/umd/supabase.min.js" integrity="sha384-9dsYHX1/12VQI+gHRtPXSM3YFsgJ+iIPjTy4WCtY7XbKG/q7MTdZxZhMd4cL9Gif" crossorigin="anonymous"></script>
<script defer data-domain="cannonfightlab.com" src="https://plausible.io/js/script.js"></script>
<style>
  .contact-wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  .contact-intro {
    color: var(--text-2);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 28px;
    text-align: center;
  }
  .contact-form {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block;
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-row input[type="text"],
  .form-row input[type="email"],
  .form-row select,
  .form-row textarea {
    width: 100%;
    background: var(--bg-3);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #fff;
    font-family: var(--font-body);
    transition: border-color 0.15s;
  }
  .form-row textarea {
    min-height: 140px;
    resize: vertical;
    line-height: 1.6;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none;
    border-color: var(--red);
  }
  .submit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }
  .submit-row .helper {
    font-size: 11px;
    color: var(--text-3);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-2);
    border: 1px solid var(--border-2);
    border-left: 3px solid var(--amber);
    color: var(--text);
    padding: 14px 22px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1000;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast strong { color: var(--amber); display: block; margin-bottom: 4px; font-family: var(--font-display); font-size: 15px; letter-spacing: 0.5px; }
  .toast.success { border-left-color: var(--green); }
  .toast.success strong { color: var(--green); }
</style>
</head>
<body>

<nav class="cfl-nav"></nav>

<div class="page-hero">
  <div class="eyebrow">Get in touch</div>
  <h1>Contact</h1>
  <p>Found a bug, a missing fighter, a stat that looks wrong, or have a feature idea?</p>
</div>

<div class="page">
  <div class="contact-wrap">
    <p class="contact-intro">
      We read every message. Be specific — if it's a bug or wrong stat, please include the fighter name or page URL so we can chase it down.
    </p>

    <form class="contact-form" id="contactForm" action="https://formspree.io/f/mgodznag" method="POST" onsubmit="handleSubmit(event)">
      <!-- Spam honeypot — bots fill hidden fields, humans don't. Formspree drops anything where this is non-empty. -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute; left:-5000px; opacity:0;" />
      <div class="form-row">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required maxlength="100" autocomplete="name" />
      </div>

      <div class="form-row">
        <label for="email">Email <span style="color:var(--text-3); text-transform: none; letter-spacing: 0;">(so we can reply)</span></label>
        <input type="email" id="email" name="email" required maxlength="200" autocomplete="email" />
      </div>

      <div class="form-row">
        <label for="topic">Topic</label>
        <select id="topic" name="topic" required>
          <option value="">Choose one…</option>
          <option value="bug">Found a bug</option>
          <option value="data">Wrong stat or missing fighter</option>
          <option value="feature">Feature request</option>
          <option value="partnership">Partnership / business</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="2000" placeholder="What's on your mind?"></textarea>
      </div>

      <div class="submit-row">
        <span class="helper">We typically respond within 48 hours.</span>
        <button type="submit" class="btn">Send message</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<footer class="cfl-footer"></footer>

<script src="_shared.js?v=rd8"></script>
<script src="_auth.js"></script>
<script>
cfl.renderNav('');
cfl.renderFooter();

async function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const button = form.querySelector('button[type="submit"]');
  const originalLabel = button.textContent;
  button.disabled = true;
  button.textContent = 'Sending…';

  try {
    const res = await fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    });
    if (res.ok) {
      form.reset();
      showToast('Message sent', 'Thanks — we\'ll get back to you within 48 hours.', 'success');
    } else {
      const json = await res.json().catch(() => ({}));
      const msg = (json.errors && json.errors[0] && json.errors[0].message)
        || 'Please try again, or email reed@cannonfightlab.com directly.';
      showToast('Couldn\'t send', msg);
    }
  } catch (err) {
    showToast('Couldn\'t send', 'Network error. Please try again or email reed@cannonfightlab.com directly.');
  } finally {
    button.disabled = false;
    button.textContent = originalLabel;
  }
}

function showToast(title, body, variant) {
  const t = document.getElementById('toast');
  t.classList.remove('success');
  if (variant === 'success') t.classList.add('success');
  t.innerHTML = '<strong>' + cfl.escapeHtml(title) + '</strong>' + cfl.escapeHtml(body);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 5000);
}
</script>
</body>
</html>

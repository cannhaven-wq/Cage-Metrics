name: DUR-001 / DUR-002 — lock PROP-0001 duration predictions

# Writes immutable PROP-0001 prediction locks (prop_model_locks) for every
# eligible 3-round fight on any card in the next 8 days. First lock wins:
# re-runs skip fights already on the ledger for the current model_version, so a
# daily schedule is safe and a fight is locked the first day it enters the
# window (i.e. with the data available THAT day — see cfl_engine/dur001/README.md).
#
# The database itself refuses a lock whose training cutoff is after the lock,
# whose fight already has a result, or whose best-known start is not after the
# lock, so a late run cannot backfill anything.

on:
  workflow_dispatch:
  schedule:
    # Daily at 11:00 UTC — after the event scraper and the 10:00 props refresh.
    - cron: '0 11 * * *'

concurrency:
  group: prop-locks
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://uftancejftcryfvbggll.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cfl_engine/requirements.txt

      - name: Install deps
        run: pip install -q -r cfl_engine/requirements.txt

      - name: Guard — service key present
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set."
            exit 1
          fi

      - name: Lock PROP-0001@v1 for the next 8 days of cards (DUR-001)
        run: python cfl_engine/dur001/lock_prop0001.py --within-days 8 --execute

      # DUR-002: the same fights locked under PROP-0001@v2, the uncalibrated
      # hazard. Specification frozen 2026-09-16T01:03:45Z, before this step
      # existed and before any v2 prediction was made.
      #
      # Runs as a SEPARATE step after v1, never instead of it. The two versions
      # coexist in prop_model_locks under different model_version values and are
      # never merged, reconciled or substituted for one another. v2 failing must
      # not cost us the v1 lock, which is why it does not share a step.
      #
      # continue-on-error is deliberate in the other direction too: a v2 failure
      # is surfaced (the job is marked failed by the check below) but only after
      # v1 has already been written.
      - name: Lock PROP-0001@v2 for the next 8 days of cards (DUR-002)
        id: lock_v2
        continue-on-error: true
        run: python cfl_engine/dur002/lock_prop0002.py --within-days 8 --execute

      - name: Surface a v2 failure without having blocked v1
        if: steps.lock_v2.outcome == 'failure'
        run: |
          echo "::error::PROP-0001@v2 locking failed; PROP-0001@v1 locks were written first."
          exit 1

name: T-082 — live engine path audit

# One-off, read-only diagnostic for T-082: does the live engine compute what its
# backtest computed? See research/t082/diagnose_live_path.py for the three
# checks. It exists as a workflow only because the agent sandbox cannot reach
# the Supabase host; nothing here writes to the database or the repository.
#
#   permissions: contents: read   — the token cannot push.
#   export_data.py / the script   — GET requests only (PostgREST reads).
#
# Delete this file once T-082 is closed; the script stays as the record of how
# the finding was produced.

on:
  workflow_dispatch:
  push:
    branches: [claude/peaceful-goldberg-yhcgmw]
    paths:
      - 'research/t082/**'
      - '.github/workflows/t082-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: t082-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://uftancejftcryfvbggll.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cfl_engine/requirements.txt

      - name: Install deps (same unpinned set production installs)
        run: pip install -q -r cfl_engine/requirements.txt

      - name: Export completed history (read-only)
        run: PYTHONPATH=cfl_engine python cfl_engine/export_data.py

      - name: Run the three checks
        run: PYTHONPATH=cfl_engine python research/t082/diagnose_live_path.py --outdir out_t082

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t082-report
          path: out_t082/
          retention-days: 30

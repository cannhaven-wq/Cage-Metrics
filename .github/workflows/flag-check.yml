name: Flag check — the right flag for every fighter on the next cards

# PLAIN ENGLISH: once a day, ask Wikidata which country each fighter on the
# next two weeks of cards competes for. Fill a missing flag, confirm one that
# agrees, and list every disagreement in ONE GitHub issue for a person to
# settle. It never overwrites a flag that is already there. Full reasoning at
# the top of build/check-fighter-flags.js.
#
# Rule (owner, 2026-10-16): the flag is the country a fighter REPRESENTS.
#
# One rolling issue, labelled `flag-check`, rewritten each run so it is the
# current list rather than a pile of history; it closes itself when the list is
# empty. A disagreement is settled by setting the fighter's country by hand
# with country_src = 'manual', after which this job never looks at them again.
#
# Permissions: contents read (checkout only — this job commits nothing),
# issues write (the list).

on:
  schedule:
    # Daily, between the 08:00 odds baseline and US afternoon. A dropped wake
    # costs a day of lead time, never a wrong flag.
    - cron: '20 13 * * *'
  workflow_dispatch:
    inputs:
      lookahead_days:
        description: 'How many days of cards to check'
        required: false
        default: '14'
      dry_run:
        description: 'Decide and report only — write nothing to the database'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: flag-check
  cancel-in-progress: false

jobs:
  check:
    name: Fighter flags on upcoming cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: global fetch only, so the check has nothing to fail on
      # before it starts.
      - name: Check flags
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FLAG_LOOKAHEAD_DAYS: ${{ github.event.inputs.lookahead_days || '14' }}
          FLAG_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          FLAG_JSON_OUT: flags.json
        run: node build/check-fighter-flags.js

      - name: Update the flag-check issue
        if: ${{ hashFiles('flags.json') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('flags.json', 'utf8'));
            const { owner, repo } = context.repo;
            const LABEL = 'flag-check';
            const MARK = '<!-- cfl-flag-check -->';
            const FOOT = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'fbca04',
              description: 'A fighter on an upcoming card needs their flag checked by a person.' }); }

            const open = (await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: LABEL, per_page: 100 }))
              .find(i => (i.body || '').includes(MARK));

            const needs = (report.results || []).filter(r => ['disagree', 'ambiguous', 'not_found'].includes(r.action));
            const filled = (report.results || []).filter(r => r.action === 'fill');
            const wd = r => (r.qids || []).map(q => `[${q}](https://www.wikidata.org/wiki/${q})`).join(' ') || '—';
            const who = r => `[${r.name}](https://cannonfightlab.com/fighter.html?id=${r.id})`;
            const what = r => r.action === 'disagree'
              ? `we show **${r.have}**, Wikidata says **${r.want}** (${r.wantLabel}, from ${r.via === 'sport' ? 'country for sport' : 'citizenship'})`
              : r.action === 'ambiguous' ? `ambiguous — ${r.note || 'several matches'}`
              : `not found on Wikidata${r.note ? ' — ' + r.note : ''}; we show ${r.have || 'no flag'}`;

            if (!needs.length) {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number,
                  body: `Nothing left to check as of \`${report.now}\`. [run log](${run})${FOOT}` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              }
              core.notice(`No flag needs a person. Filled ${filled.length}.`);
              return;
            }

            const body = [MARK,
              `Fighters on cards in the next two weeks whose flag a person should settle. Checked \`${report.now}\`${report.dry ? ' (dry run)' : ''} — [run log](${run}).`,
              '',
              'The flag is the country a fighter **represents**. To settle one, set `country`, `country_code` and `country_src = \'manual\'` on the fighter; this job never looks at them again. Nothing here was changed automatically.',
              '',
              '| fighter | card | what |', '|---|---|---|',
              ...needs.map(r => `| ${who(r)} | ${r.card || ''} (${r.date || ''}) | ${what(r)} · ${wd(r)} |`),
              filled.length ? `\nFilled automatically this run: ${filled.map(r => `${r.name} → ${r.code}`).join(', ')}.` : '',
            ].join('\n') + FOOT;

            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              core.notice(`Updated #${open.number}: ${needs.length} to settle.`);
            } else {
              const c = await github.rest.issues.create({ owner, repo, labels: [LABEL],
                title: 'Fighter flags to check on upcoming cards', body });
              core.notice(`Opened #${c.data.number}: ${needs.length} to settle.`);
            }

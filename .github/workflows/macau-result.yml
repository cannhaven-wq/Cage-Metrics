name: Macau v5 result fetch

# Runs research/macau-fetch.js on a GitHub runner (which CAN reach Supabase,
# unlike the cloud dev sandbox) and commits the output to
# research/macau-result.md so it can be pulled back and read.
#
# Triggers:
#   - push to the feature branch (re-run when the fetch script changes)
#   - workflow_dispatch (manual re-run from the Actions tab)
#   - schedule: every 2 hours, to auto-capture results once the card is graded.
#     NOTE: GitHub only runs `schedule` triggers for workflow files on the
#     DEFAULT branch (main). On a feature branch this cron never fires — the
#     workflow has to be on main for the schedule to take effect.
#
# The auto-commit carries [skip ci] so it does not re-trigger the push event.
# Once the card is graded and macau-result.md is captured, delete the
# `schedule:` block (or the whole file) so the cron stops running.

on:
  push:
    branches:
      - claude/macau-event-v5-accuracy-kWvZe
    paths:
      - 'research/macau-fetch.js'
      - 'research/ufcstats-probe.js'
      - '.github/workflows/macau-result.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch v5 picks + actual results
        run: node research/macau-fetch.js 113 v5

      - name: Probe ufcstats (diagnose scraper)
        run: node research/ufcstats-probe.js || true

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/macau-result.md research/ufcstats-probe.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: macau v5 fetch result [skip ci]"
            git push
          fi

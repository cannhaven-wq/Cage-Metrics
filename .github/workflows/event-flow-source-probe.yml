# T-030 — which running-order source can a GitHub runner actually read?
#
# UFCStats answers runners with an HTTP 200 anti-bot page. This asks the
# alternatives once each (ESPN's public MMA JSON, the Wikipedia MediaWiki API)
# and prints what came back, with every sample gzip+base64'd into the log and
# attached as an artifact. UFC.com is NOT probed: its Terms of Use prohibit
# automated access.
#
# No secrets, no database, read-only token, writes nothing to the repo.
name: Event flow — source probe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/gallant-cannon-sefkcs-running-order
    paths:
      - cfl_engine/event_flow/source_probe.py
      - cfl_engine/event_flow/sources.py
      - .github/workflows/event-flow-source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe sources
        run: python cfl_engine/event_flow/source_probe.py --out-dir probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe
          path: probe/
          if-no-files-found: warn

name: PRED-002 — preflight on real data (no scoring)

# One-off, removed after it runs. Verifies the development export and Stage 1's
# preflight on the real data BEFORE the preregistration is frozen.
# stage1.py --preflight-only stops before any forecast is compared with a
# result, so under PRED-002 amendment A5 this is not a look. Read-only.

on:
  push:
    branches: [claude/peaceful-goldberg-yhcgmw]
    paths: ['.github/workflows/pred002-preflight.yml']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://uftancejftcryfvbggll.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -r cfl_engine/requirements.txt
      - name: Development export (dates before 2025-01-01 only)
        run: python research/pred002_data/export_dev.py --outdir pred002_dev
      - name: Stage 1 preflight only
        run: python research/experiments/PRED-002/stage1.py --indir pred002_dev --outdir pred002_pre --preflight-only

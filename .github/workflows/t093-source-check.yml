name: T-093 source check (read-only)

# Fetches the public UFCStats fight-details pages for the 21 early fights that
# have no rows in fight_rounds, plus two control fights that do, and records
# whether the source page publishes per-round stats. READ-ONLY: no secrets,
# contents: read, no database access, commits nothing. The result is printed
# to the log and uploaded as an artifact; a person commits it on purpose.

on:
  push:
    branches: ['claude/gallant-cannon-sefkcs-t093-source-check']
    paths:
      - '.github/workflows/t093-source-check.yml'
      - 'research/data-integrity/t093_source_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and inspect UFCStats pages
        run: python -I research/data-integrity/t093_source_check.py t093-out
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t093-source-check
          path: t093-out/
          if-no-files-found: warn

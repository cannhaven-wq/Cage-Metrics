name: DISC-001 DEV export (one-off, branch only)

# One-off. Writes research/experiments/DISC-001/data/ from fights before
# 2025-01-01 and commits it back to the research branch it ran on. The agent
# environment cannot reach the database host, so the export runs here.
#
# It triggers only on a push to the DISC-001 branch that touches the export
# script or this file, and it is deleted in the same pull request before
# anything merges: no write-capable workflow lands on main.

on:
  push:
    branches: [claude/brave-bohr-e8j482]
    paths:
      - build/disc001-export.js
      - .github/workflows/disc001-export.yml

permissions:
  contents: write

concurrency:
  group: disc001-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Export DEV data
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node build/disc001-export.js | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the export to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add research/experiments/DISC-001/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "DISC-001: DEV export (fights before 2025-01-01) [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

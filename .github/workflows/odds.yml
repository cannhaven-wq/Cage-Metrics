name: Fetch UFC odds

# Pulls current UFC moneyline odds from The Odds API and writes per-book snapshot
# rows into `fight_odds` (same shape the BFO Railway cron uses), which the
# `v_fight_odds_consensus` view and the index/event/parlay pages read.
#
# Requires two repo secrets:
#   - ODDS_API_KEY               (the-odds-api.com)
#   - SUPABASE_SERVICE_ROLE_KEY  (Supabase → Project Settings → API; legacy JWT
#                                 service_role key — bypasses RLS to write)
#
# Cost: one request per run (regions=us, markets=h2h) = 1 credit, returns the
# whole MMA slate.
#
# CADENCE (2026-09-16, CLV-001 Amendments 3 and 4): wakes every 5 minutes;
# build/fetch-odds.js decides whether the wake is worth a credit BEFORE calling
# the API (shouldCaptureNow). Three tiers:
#
#   * card IN FLOW              -> every 5 minutes, budget permitting
#   * a card today or tomorrow  -> hourly
#   * otherwise                 -> one baseline capture a day at 08:00 UTC
#
# "In flow" is the event-flow rule. A card is one scheduled start and then a
# queue: only the first bout begins when the schedule says, and the twelfth
# walks out hours later. So the window opens 3h before the scheduled start and
# stays open until every bout has an exact completion on file, or EVENT_FLOW_MAX_H
# (7h) passes — whichever comes first. Capturing only "near the published
# commence time" would give bout 1 a fresh quote and leave the other twelve
# closing on a line hours stale.
#
# The previous bout ending is a TRIGGER for capture intensity and nothing else.
# It does not define any fight's closing price — that is the last valid pre-live
# quote for the upcoming fight, decided in cfl_engine/clv/scoring.py.
#
# THE HARD CEILING (Amendment 4). Five minutes is a TARGET, not a schedule. A
# card at 5-minute cadence costs ~123 credits, and the measured event rate is
# 3.7 a month with 6 in the busiest — enough to break a 500-credit allowance
# outright. So before each call the job reads the provider's own
# x-requests-remaining header (persisted in odds_api_usage by the previous run),
# counts the cards still to come this month, reserves the floor cost of each of
# them, and takes the finest cadence on the ladder 5 -> 10 -> 15 -> 30 that
# fits. Below a hard floor it stops rather than spending a credit it does not
# have. An unreadable ledger reads as "tight", never as unlimited.
#
# Degrading to 30 minutes still clears the frozen 45-minute staleness limit, so
# the governor costs LEAD TIME and never correctness. build/test-fetch-odds.js
# walks months of 1 to 8 cards and asserts none exceeds the allowance.
#
# NO PAID TIER, EVER, WITHOUT AN L3.
#
# Why never hourly. CLV-001's staleness limit is 45 minutes, derived from a
# MEASURED 30-minute near-card interval plus 15 minutes of grace. Hourly capture
# cannot satisfy it — a bell at :59 leaves the freshest quote 59 minutes old and
# the observation goes unscored on a stale price. Every rung on the ladder is
# 30 minutes or finer, so the frozen limit is satisfiable by construction.
# build/test-fetch-odds.js checks that exhaustively, for every bell minute.
#
# "A real bell" means start_basis bell_at or provider_commence only. The
# event-date fallback in v_fight_start_best is the event date at 18:00 UTC — a
# placeholder — and bursting against it would spend credits on nothing
# (CLV-001 Amendment 2 (b)).
#
# Why this matters: CLV is scored against the last capture before the scheduled
# start. A once-a-day line is not a close, so CLV computed off it is noise.
# Density near the bell is the whole point of this job.
#
# DUR-001 (2026-09-14): the same call also carries the fight TOTALS market when
# build/fetch-odds.js::wantTotals() says so (+1 credit per call), appended to the
# private prop_odds ledger, plus the provider commence time into
# fight_start_estimates. Set ODDS_MARKETS=h2h to switch totals off.
# See cfl_engine/dur001/README.md.

on:
  schedule:
    # Wake every 5 minutes; build/fetch-odds.js::shouldCaptureNow() decides,
    # before any API call, whether the wake is worth a credit. A quiet wake costs
    # nothing — it queries Supabase and exits.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read  # script writes to Supabase, never to the repo

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Fetch and insert odds
        working-directory: build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A hand-fired run always captures — never let the cadence gate make a
          # manual "is this thing on?" check look like a silent success.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node fetch-odds.js

name: Fetch UFC odds (DISABLED)

# DISABLED 2026-05-24. The base `fight_odds` table in Supabase is now owned by
# the cage-metrics-odds-scrapper repo (per-poll BFO snapshots, Railway cron).
# Its schema (`fight_id, side, book_id, american_odds, captured_at, ...`) is
# incompatible with this script's consensus shape (`american_odds_a/b,
# implied_prob_a/b, bookmaker_count, fetched_at`), so every scheduled run was
# failing on upsert with `column does not exist`.
#
# The frontend now reads consensus odds from the `v_fight_odds_consensus` view
# (see v_fight_odds_consensus.sql), which aggregates the snapshot table on
# read. If we ever want a true Odds API consensus alongside the BFO scrape,
# point this script at a separately named table (e.g., fight_odds_oddsapi) and
# re-enable.
#
# Manual dispatch only — no cron — so it doesn't keep failing in the logs.

on:
  workflow_dispatch:

permissions:
  contents: read  # script writes to Supabase, never to the repo

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Fetch and upsert odds
        working-directory: build
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node fetch-odds.js

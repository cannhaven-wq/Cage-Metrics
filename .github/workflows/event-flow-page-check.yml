# T-030 — the real-page check for the running-order reader.
#
# The agent environment cannot reach any of the sources, so this runs where it
# can. It reads the latest completed and the next upcoming card from a REAL
# source with the repo's own adapters, checks the walkout direction against
# each card's name (an event is named after its main event), and uploads
# REAL_PAGE_CHECK.json as an artifact. It also prints the JSON to the log.
#
#   source=espn      (default; what a push runs) ESPN's public MMA scoreboard
#                    JSON, cross-checked bout for bout against the event's
#                    Wikipedia results table.
#   source=ufcstats  UFCStats event pages. Manual only: on 2026-10-21 UFCStats
#                    answered GitHub's runners with an HTTP 200 anti-bot page
#                    (runs 39620237572, 39620364912), which the check records
#                    as source_blocked and fails. It never gets past such a page.
#
# No secrets. No database. Read-only token. It writes nothing to the repo:
# committing the JSON to cfl_engine/event_flow/REAL_PAGE_CHECK.json is a
# deliberate, reviewed commit citing this run.
name: Event flow — real-page check

on:
  workflow_dispatch:
    inputs:
      source:
        description: "espn (default) or ufcstats"
        required: false
        default: "espn"
      events:
        description: "ufcstats only: UFCStats event ids, space-separated"
        required: false
        default: ""
  push:
    branches:
      - claude/gallant-cannon-sefkcs-running-order
    paths:
      - cfl_engine/event_flow/real_page_check.py
      - cfl_engine/event_flow/sources.py
      - .github/workflows/event-flow-page-check.yml

permissions:
  contents: read

jobs:
  page-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parser unit tests
        run: >-
          python -m unittest cfl_engine.event_flow.test_event_flow
          cfl_engine.event_flow.test_real_page_check cfl_engine.event_flow.test_sources

      - name: Read real pages
        env:
          SOURCE: ${{ github.event.inputs.source || 'espn' }}
          EVENTS: ${{ github.event.inputs.events }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args="--source $SOURCE"
          if [ "$SOURCE" = "ufcstats" ]; then
            args="$args --fallback-event 55e94a9b525dcf45"
            for e in $EVENTS; do args="$args --event $e"; done
          fi
          python cfl_engine/event_flow/real_page_check.py \
            --out REAL_PAGE_CHECK.json \
            --save-dir fetched \
            --checked-by "GitHub Actions run ${{ github.run_id }} (real_page_check.py --source $SOURCE; $RUN_URL)" \
            $args

      - name: Upload REAL_PAGE_CHECK.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: REAL_PAGE_CHECK
          path: |
            REAL_PAGE_CHECK.json
            fetched/
          if-no-files-found: warn

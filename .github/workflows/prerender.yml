name: Prerender static stubs

# Generates /f/<slug>-<id>.html and /e/<slug>-<id>.html for every fighter and
# event in Supabase, the /preview and /card pages, sitemap.xml, the Factor Lab
# data (factor-rates.json) and the public claim manifest (data/claims.json),
# and commits any changes back to main.
#
# Triggers:
#   - schedule: every 6 hours (catches scraper updates)
#   - workflow_dispatch: manual run from the Actions tab
#   - push to build/ or this workflow file: re-run when the build itself changes
#
# Pushes from this workflow do NOT re-trigger via the `paths-ignore` filter,
# so there's no infinite loop on the auto-commit.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/prerender.yml'

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Prerender stubs
        working-directory: build
        run: npm run prerender

      # Needs the service key: fight_odds has no SELECT policy for anon and
      # returns 0 rows silently, which would publish an empty market-control
      # column. factor-rates.js hard-fails on that rather than shipping it.
      - name: Recompute factor rates
        working-directory: build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run factor-rates

      # Public claim manifest: every headline record number the site quotes,
      # pulled from the graded views and written to data/claims.json. The
      # service key is only needed for the closing-favorite benchmark
      # (fight_odds); without it that one claim is carried forward as STALE.
      - name: Rebuild claim manifest
        working-directory: build
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run claims

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add f/ e/ preview/ card/ sitemap.xml feed.xml factor-rates.json data/claims.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate prerendered stubs [skip ci]"
            git push
          fi

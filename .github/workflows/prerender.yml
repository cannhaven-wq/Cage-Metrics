name: Prerender static stubs

# Generates /f/<slug>-<id>.html and /e/<slug>-<id>.html for every fighter and
# event in Supabase, regenerates sitemap.xml, commits any changes back to main.
#
# It does NOT touch factor-rates.json. That file is a set of published
# performance verdicts and is refreshed only through factor-rates-validate.yml,
# which is manual and commits nothing. T-027.
#
# Triggers:
#   - schedule: every 6 hours (catches scraper updates)
#   - workflow_dispatch: manual run from the Actions tab
#   - push to build/ or this workflow file: re-run when the build itself changes
#
# Pushes from this workflow do NOT re-trigger via the `paths-ignore` filter,
# so there's no infinite loop on the auto-commit.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build/**'
      - '.github/workflows/prerender.yml'

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Prerender stubs
        working-directory: build
        run: npm run prerender

      # The Factor Lab is NOT regenerated here any more. See T-027.
      #
      # This job used to run `npm run factor-rates` with the service key and
      # commit the result, so every six hours it recomputed and published the
      # Factor Lab's verdicts with nobody reviewing them. That was fine while
      # the numbers were believed correct. It stopped being fine the moment a
      # reader defect was found in the script that produces them: the fix would
      # have been deployed and its effects published in the same unattended
      # step, and the first person to see the corrected verdicts would have been
      # a visitor.
      #
      # `stats.html` verdicts are public performance claims, so changing what
      # they are computed from is an owner decision, not a cron job.
      #
      # Regeneration now lives in factor-rates-validate.yml: manual only,
      # `contents: read`, produces a candidate artifact and commits nothing.
      # Publishing a reviewed candidate is a deliberate commit of
      # factor-rates.json, which is exactly the reviewable event this removes
      # from the schedule.
      #
      # CONSEQUENCE, STATED PLAINLY: factor-rates.json now goes stale until
      # somebody refreshes it on purpose. That is the trade — a stale number
      # that was reviewed beats a fresh one that was not.

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # factor-rates.json is deliberately NOT staged here — see above.
          git add f/ e/ preview/ card/ sitemap.xml feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate prerendered stubs [skip ci]"
            git push
          fi

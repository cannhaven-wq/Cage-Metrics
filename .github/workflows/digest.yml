name: Weekly digest email

# Sends the weekly fight-preview email to every active row in
# email_subscribers. Runs Wednesday 15:00 UTC (≈ 8am PT / 11am ET — well
# before any weekend card, so subscribers have time to read it).
#
# Falls back to dry-run mode if RESEND_API_KEY isn't set, so a fresh fork
# without secrets won't fail the workflow — it just logs what it would send.

on:
  schedule:
    - cron: '0 15 * * 3'   # Wednesdays 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only, do not send (override secret)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Send digest
        working-directory: build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIGEST_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: npm run send-digest

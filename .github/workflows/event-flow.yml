# Capture the running order of upcoming cards.
#
# MANUAL ONLY, deliberately, and it cannot write yet even when dispatched.
#
# Before the schedule below is uncommented:
#
#   1. research/event-card/apply_2026-10-21_running_order.sql is applied (L3,
#      owner; procedure in research/event-card/RUNNING_ORDER_APPLY.md). Until
#      then every run stops with exit 2: the ingester never creates tables.
#   2. cfl_engine/event_flow/REAL_PAGE_CHECK.json records a PASSED real-page
#      check for the source being written (.github/workflows/event-flow-page-check.yml).
#      `--execute` refuses otherwise; dry runs are never gated.
#   3. The source is chosen. UFCStats (the default) answers GitHub's runners
#      with an HTTP 200 anti-bot page, so `source=ufcstats` ends PAGE
#      UNREADABLE here. `source=espn` reads ESPN's public scoreboard JSON,
#      which runners can read — using it on a schedule is the owner's call
#      (research/event-card/SOURCE_EVALUATION_2026-10-21.md).
#
# Enabling the schedule is then a two-line change: replace
#     # schedule:
#     #   - cron: "20 7,19 * * *"
# with
#     schedule:
#       - cron: "20 7,19 * * *"
# and, for ESPN, change the `SOURCE` default below from ufcstats to espn.
# Twice a day is enough: an unchanged card writes nothing, and every
# observation is appended rather than overwritten.
#
# Cost: none. No API key and no credits are involved.
name: Event flow — bout order

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "CFL events.id (blank = every upcoming card)"
        required: false
        default: ""
      execute:
        description: "Write rows (unchecked = dry run)"
        type: boolean
        required: false
        default: false
      source:
        description: "ufcstats (blocked from GitHub runners) or espn"
        required: false
        default: "ufcstats"
  # schedule:
  #   - cron: "20 7,19 * * *"

permissions:
  contents: read

jobs:
  bout-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: >-
          python -m unittest cfl_engine.event_flow.test_event_flow
          cfl_engine.event_flow.test_retirement cfl_engine.event_flow.test_sources

      - name: Ingest running order
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE: ${{ github.event.inputs.source || 'ufcstats' }}
        run: |
          args="--source $SOURCE"
          if [ -n "${{ github.event.inputs.event_id }}" ]; then
            args="$args --event-id ${{ github.event.inputs.event_id }}"
          fi
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            args="$args --execute"
          fi
          python cfl_engine/event_flow/ingest_bout_order.py $args

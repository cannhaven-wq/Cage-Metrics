name: Pipeline health — are the jobs that keep CFL current still working?

# Runs build/check-pipeline-health.js and keeps one labelled GitHub issue open
# per problem it finds, closing it when the problem clears. The dead man
# (dead-man.yml) watches the pre-fight record; this watches everything else:
# critical scheduled workflows, odds freshness, results ingestion and the
# upcoming-card calendar (the last two are how the Railway event scraper is
# watched, since GitHub cannot see Railway).
#
# Added 2026-10-12 after the current-state audit found a daily job failing for
# weeks, a scraper's builds failing for three months and a poster publishing
# retired copy, all without anything saying a word.
#
# Twice a day at odd minutes (GitHub delays schedules on the hour). Running
# often is harmless: the issue step updates the existing issue rather than
# opening a new one.

on:
  schedule:
    - cron: '41 6 * * *'
    - cron: '41 18 * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Pretend it is this ISO instant (testing only; blank = now)'
        required: false
        default: ''
      open_issues:
        description: 'Open/close GitHub issues for breaches'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: pipeline-health
  cancel-in-progress: false

jobs:
  check:
    name: Pipeline health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check health
        id: check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          HEALTH_NOW: ${{ github.event.inputs.now || '' }}
          HEALTH_JSON_OUT: health.json
        shell: bash
        run: |
          set -o pipefail
          node build/check-pipeline-health.js || echo "breached=true" >> "$GITHUB_OUTPUT"
          test -f health.json || { echo "no health.json — the check could not look, which is a failure"; exit 1; }

      - name: Open, update and close issues
        if: ${{ always() && hashFiles('health.json') != '' && github.event.inputs.open_issues != 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('health.json', 'utf8'));
            const { owner, repo } = context.repo;
            const LABEL = 'pipeline-health';
            const FOOT = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n';
            try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: LABEL,
              color: 'd93f0b', description: 'A job that keeps CFL current has stopped or gone stale.' }); }
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: LABEL, per_page: 100 });
            const byMarker = new Map();
            for (const i of open) {
              const m = (i.body || '').match(/<!-- cfl-health:[^>]+-->/);
              if (m) byMarker.set(m[0].trim(), i);
            }
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const seen = new Set();
            for (const b of report.breaches) {
              seen.add(b.marker);
              const body = `${b.message}\n\nChecked at \`${report.now}\` — [run log](${run}).\n\n${b.marker}${FOOT}`;
              const existing = byMarker.get(b.marker);
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Still failing at \`${report.now}\` — [run log](${run}).${FOOT}` });
              } else {
                await github.rest.issues.create({ owner, repo, labels: [LABEL],
                  title: `Pipeline health: ${b.message.split(':')[0]}`, body });
              }
            }
            for (const [marker, issue] of byMarker) {
              if (seen.has(marker)) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `Cleared at \`${report.now}\` — [run log](${run}).${FOOT}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed' });
            }

      - name: Fail the run when something is broken
        if: ${{ steps.check.outputs.breached == 'true' }}
        run: |
          echo "One or more jobs have stopped — see the pipeline-health issues."
          exit 1

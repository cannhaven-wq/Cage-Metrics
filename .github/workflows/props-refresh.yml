name: Prop Board — refresh projections

# Regenerates the prop model's inputs from Supabase and republishes the next
# card's significant-strike + takedown projections to the public
# prop_projections table, which props.html reads live. Full-table replace, so
# the board always shows exactly the next card; between cards the run finds
# nothing and the view hides the finished card automatically.
#
# Self-gating: predict_props_upcoming.py --auto only publishes when there is an
# upcoming card with pending fights inside the window, so a daily schedule is a
# no-op except during fight week.

on:
  workflow_dispatch:
  schedule:
    # Daily at 10:00 UTC — after the odds cron + event scraper + engine-serve.
    - cron: '0 10 * * *'

# Never run two publishes at once — both full-replace the same table.
concurrency:
  group: props-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public anon endpoint (also committed in _shared.js).
      SUPABASE_URL: https://uftancejftcryfvbggll.supabase.co
      # The scripts check SUPABASE_SECRET_KEY first; map the repo's existing
      # service-role secret (legacy JWT) onto it. Writes bypass RLS.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cfl_engine/requirements.txt

      - name: Install deps
        run: pip install -q -r cfl_engine/requirements.txt

      - name: Guard — service key present
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set — add it (Settings → Secrets → Actions) or the publish can't authenticate."
            exit 1
          fi

      # Regenerate the model inputs from Supabase (fresh results = fresh form).
      - name: Export round-level stats
        run: python cfl_engine/export_rounds.py
      - name: Export fights / stats / fighters
        run: PYTHONPATH=cfl_engine python cfl_engine/export_data.py
      - name: Build count features (sig strikes / takedowns)
        run: python cfl_engine/features/build_count_features.py
      - name: Build duration features
        run: python cfl_engine/features/build_features.py

      # Publish the next card's projections (no-op if no card in window).
      - name: Publish prop projections
        run: python cfl_engine/predict_props_upcoming.py --auto --execute

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1f1f1f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left: brand mark + headline -->
  <rect x="80" y="80" width="60" height="6" fill="url(#accent)"/>
  <text x="80" y="135" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#e63946" letter-spacing="3">UFC ANALYTICS PLATFORM</text>

  <text x="80" y="230" font-family="Barlow Condensed, sans-serif" font-size="74" font-weight="800"
        fill="#ffffff" letter-spacing="-1">Calibrated UFC</text>
  <text x="80" y="305" font-family="Barlow Condensed, sans-serif" font-size="74" font-weight="800"
        fill="#ffffff" letter-spacing="-1">predictions backed</text>
  <text x="80" y="380" font-family="Barlow Condensed, sans-serif" font-size="74" font-weight="800"
        fill="#ffffff" letter-spacing="-1">by <tspan fill="#e63946">real data.</tspan></text>

  <text x="80" y="450" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500"
        fill="#999999">Cardio scores. Head-to-head. Edge factors.</text>
  <text x="80" y="478" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500"
        fill="#999999">Validated against 8,000+ historical UFC fights.</text>

  <text x="80" y="585" font-family="Barlow Condensed, sans-serif" font-size="32" font-weight="800"
        fill="#ffffff" letter-spacing="2">CANNON<tspan fill="#e63946">FIGHT</tspan>LAB</text>

  <!-- Right: two big stat boxes (replaced 3-box layout) -->
  <g transform="translate(830, 230)">
    <!-- Stat 1: 75% accuracy -->
    <text x="0" y="0" font-family="Barlow Condensed, sans-serif" font-size="130" font-weight="800"
          fill="#ffffff">75<tspan fill="#e63946" font-size="65">%</tspan></text>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600"
          fill="#999999" letter-spacing="2">UFC PERTH ACCURACY</text>

    <!-- Divider -->
    <rect x="0" y="80" width="240" height="1" fill="#2a2a2a"/>

    <!-- Stat 2: 8,000+ -->
    <text x="0" y="190" font-family="Barlow Condensed, sans-serif" font-size="84" font-weight="800"
          fill="#ffffff">8,000<tspan fill="#e63946" font-size="42">+</tspan></text>
    <text x="0" y="226" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600"
          fill="#999999" letter-spacing="2">FIGHTS BACKTESTED</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#c1121f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1f1f1f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left: brand mark + headline -->
  <rect x="80" y="80" width="60" height="6" fill="url(#accent)"/>
  <text x="80" y="135" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#e63946" letter-spacing="3">UFC ANALYTICS PLATFORM</text>

  <text x="80" y="230" font-family="Barlow Condensed, sans-serif" font-size="74" font-weight="800"
        fill="#ffffff" letter-spacing="-1">UFC models that</text>
  <text x="80" y="305" font-family="Barlow Condensed, sans-serif" font-size="74" font-weight="800"
        fill="#ffffff" letter-spacing="-1">show <tspan fill="#e63946">their work.</tspan></text>

  <text x="80" y="450" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500"
        fill="#999999">A tape-only predictor. A value model graded in public.</text>
  <text x="80" y="478" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500"
        fill="#999999">And the Factor Lab: which stats survive the market.</text>

  <text x="80" y="585" font-family="Barlow Condensed, sans-serif" font-size="32" font-weight="800"
        fill="#ffffff" letter-spacing="2">CANNON<tspan fill="#e63946">FIGHT</tspan>LAB</text>

  <!-- Right: two big stat boxes (replaced 3-box layout) -->
  <!-- Sized for font fallback: headless renderers may not have Barlow
       Condensed installed, and the fallback sans is ~30% wider. Keep every
       right-column line under ~330px at these sizes or it clips at x=1200. -->
  <g transform="translate(790, 230)">
    <!-- Stat 1: fights analyzed -->
    <text x="0" y="0" font-family="Barlow Condensed, sans-serif" font-size="110" font-weight="800"
          fill="#ffffff">8,853</text>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600"
          fill="#999999" letter-spacing="2">FIGHTS ANALYZED</text>

    <!-- Divider -->
    <rect x="0" y="80" width="240" height="1" fill="#2a2a2a"/>

    <!-- Stat 2: the proof promise -->
    <text x="0" y="150" font-family="Barlow Condensed, sans-serif" font-size="29" font-weight="800"
          fill="#ffffff" letter-spacing="1">EVERY PICK <tspan fill="#e63946">LOCKED</tspan></text>
    <text x="0" y="200" font-family="Barlow Condensed, sans-serif" font-size="29" font-weight="800"
          fill="#ffffff" letter-spacing="1">EVERY MISS <tspan fill="#e63946">SHOWN</tspan></text>
  </g>
</svg>

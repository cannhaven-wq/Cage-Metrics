<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks moved to the homepage | Cannon Fight Lab</title>
<!-- The standalone Picks page was retired, and so was card-lab.html after it.
     This used to hop picks.html -> card-lab.html -> / , which costs a crawler a
     redirect and a reader a second flash of nothing. It now goes straight to
     the homepage, where the card lives (T-004). Keep the stub so old links,
     shares and bookmarks land somewhere useful instead of 404ing; noindex so
     crawlers drop the old URL. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://cannonfightlab.com/">
<meta http-equiv="refresh" content="0; url=/">
<style>
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#08090b;color:#e6e9ee;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#e5484d;font-weight:600}
</style>
</head>
<body>
<p>The card is now on the <a href="/">homepage</a>. Taking you there…</p>
<script>setTimeout(function(){location.replace("/");},120);</script>
</body>
</html>

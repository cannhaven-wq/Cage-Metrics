<nav class="cfl-nav"></nav>

<div id="content">
  <div class="loading-state" style="padding: 80px;">

</div>

<footer class="cfl-footer"></footer>

<script>
cfl.renderNav('fighters');
cfl.renderFooter();

const fighterId = parseInt(cfl.getQueryParam('id'), 10);

// Update <head> meta tags + JSON-LD once we know which fighter this is. Modern
// crawlers (Google, Bing) index JS-mutated meta. Twitter/Facebook unfurls
// don't — those need prerendered HTML, handled separately by the build step.
function setMeta(attr, key, value) {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute(attr, key);
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', value);
}

function injectJsonLd(id, data) {
  let script = document.getElementById(id);
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = id;
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(data);
}

function updateFighterSEO(f) {
  const url = `https://cannonfightlab.com/fighter.html?id=${f.id}`;
  const careerRec = `${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''}`;
  const division = f.division ? `, ${f.division}` : '';
  const title = `${f.name} — UFC Fighter Stats & Analytics | Cannon Fight Lab`;
  const desc = `${f.name}${f.nickname ? ' "' + f.nickname + '"' : ''} UFC fighter stats: ${careerRec} career record${division}. Cardio score, striking, grappling, recent form, head-to-head matchups.`;

  document.title = title;
  setMeta('name', 'description', desc);
  setMeta('property', 'og:title', `${f.name} — UFC Fighter Stats`);
  setMeta('property', 'og:description', desc);
  setMeta('property', 'og:url', url);
  setMeta('name', 'twitter:title', `${f.name} — UFC Fighter Stats`);
  setMeta('name', 'twitter:description', desc);

  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.setAttribute('href', url);

  // Athlete schema (schema.org/Person — Athlete is a subtype implied by jobTitle)
  const athlete = {
    '@context': 'https://schema.org',
    '@type': 'Person',
    'name': f.name,
    'url': url,
    'jobTitle': 'Mixed Martial Artist',
    'memberOf': { '@type': 'SportsOrganization', 'name': 'Ultimate Fighting Championship', 'alternateName': 'UFC' }
  };
  if (f.nickname) athlete.alternateName = f.nickname;
  if (f.height_in) athlete.height = cfl.formatHeight(f.height_in);
  injectJsonLd('athlete-schema', athlete);

  injectJsonLd('breadcrumb-schema', {
    '@context': 'https://schema.org',
    '@type': 'BreadcrumbList',
    'itemListElement': [
      { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': 'https://cannonfightlab.com/' },
      { '@type': 'ListItem', 'position': 2, 'name': 'Fighters', 'item': 'https://cannonfightlab.com/fighters.html' },
      { '@type': 'ListItem', 'position': 3, 'name': f.name, 'item': url }
    ]
  });
}

async function load() {
  if (!fighterId) {
    document.getElementById('content').innerHTML = cfl.errorHtml('No fighter id provided. <a href="fighters.html" style="color:var(--red)">Back to fighter list</a>');
    return;
  }

  const sb = window.cflSupabase;

  const { data: f, error } = await sb
    .from('fighters')
    .select('*')
    .eq('id', fighterId)
    .single();

  if (error || !f) {
    document.getElementById('content').innerHTML = cfl.errorHtml('Fighter not found. <a href="fighters.html" style="color:var(--red)">Back to fighter list</a>');
    return;
  }

  updateFighterSEO(f);

  const ufcRec = (f.ufc_wins ?? 0) + (f.ufc_losses ?? 0) + (f.ufc_draws ?? 0);
  const hasUfc = ufcRec > 0;

  document.getElementById('content').innerHTML = `
    <div class="fighter-hero">
      <div class="fighter-hero-inner">
        <div class="cfl-avatar xl">${cfl.escapeHtml(cfl.initials(f.name))}</div>
        <div>
          <h1 class="fh-name">${cfl.escapeHtml(f.name)}</h1>
          ${f.nickname ? `<div class="fh-nick">"${cfl.escapeHtml(f.nickname)}"</div>` : ''}
          ${f.division ? `<div class="fh-division">${cfl.escapeHtml(f.division)}</div>` : ''}
          ${cfl.flagChip && cfl.flagChip(f) ? `<div class="fh-origin" title="${cfl.escapeHtml(f.birth_place || f.country)}">${cfl.flagChip(f)}</div>` : ''}
          <div class="fh-style" id="fhStyle" style="display:none"></div>
        </div>
        <div class="fh-records">
          ${hasUfc ? `
            <div class="record-block">
              <div class="big-record">${f.ufc_wins ?? 0}-${f.ufc_losses ?? 0}${f.ufc_draws ? '-' + f.ufc_draws : ''}</div>
              <div class="record-label">UFC record</div>
            </div>
          ` : ''}
          <div class="record-block career">
            <div class="big-record">${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''}</div>
            <div class="record-label">Career</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="stat-section">
        <h2>Performance stats</h2>
        <div class="stats-grid-4">
          <div class="stat-box"><div class="stat-val accent">${f.slpm != null ? Number(f.slpm).toFixed(1) : '—'}</div><div class="stat-lbl">Sig. strikes per min</div></div>
          <div class="stat-box"><div class="stat-val">${f.sapm != null ? Number(f.sapm).toFixed(1) : '—'}</div><div class="stat-lbl">Absorbed per min</div></div>
          <div class="stat-box"><div class="stat-val accent">${f.td_avg != null ? Number(f.td_avg).toFixed(1) : '—'}</div><div class="stat-lbl">Takedowns per 15 min</div></div>
          <div class="stat-box"><div class="stat-val">${f.td_def != null ? f.td_def + '%' : '—'}</div><div class="stat-lbl">Takedown defense</div></div>
          <div class="stat-box"><div class="stat-val">${f.str_acc != null ? f.str_acc + '%' : '—'}</div><div class="stat-lbl">Strike accuracy</div></div>
          <div class="stat-box"><div class="stat-val">${f.str_def != null ? f.str_def + '%' : '—'}</div><div class="stat-lbl">Strike defense</div></div>
          <div class="stat-box"><div class="stat-val">${f.sub_avg != null ? Number(f.sub_avg).toFixed(1) : '—'}</div><div class="stat-lbl">Sub attempts per 15</div></div>
          <div class="stat-box"><div class="stat-val">${f.last_5 || '—'}</div><div class="stat-lbl">Last 5 fights</div></div>
        </div>
      </div>

      <div class="stat-section" id="finisherSection" hidden>
        <h2>How they finish</h2>
        <div class="fin-wrap" id="finisherCard"></div>
      </div>

      <div class="stat-section" id="cardioSection" hidden>
        <h2>Deep water</h2>
        <div class="fin-wrap" id="cardioCard"></div>
      </div>

      <div class="stat-section">
        <h2>Physical attributes</h2>
        <div class="pa-grid">
          <div class="pa-box"><div class="pa-val">${cfl.formatHeight(f.height_in)}</div><div class="pa-lbl">Height</div></div>
          <div class="pa-box"><div class="pa-val">${cfl.formatReach(f.reach_in)}</div><div class="pa-lbl">Reach</div></div>
          <div class="pa-box"><div class="pa-val">${cfl.escapeHtml(f.stance || '—')}</div><div class="pa-lbl">Stance</div></div>
          <div class="pa-box"><div class="pa-val">${f.age ?? '—'}</div><div class="pa-lbl">Age</div></div>
          <div class="pa-box"><div class="pa-val">${ufcRec || '—'}</div><div class="pa-lbl">UFC fights</div></div>
          <div class="pa-box"><div class="pa-val">${(f.wins ?? 0) + (f.losses ?? 0) + (f.draws ?? 0)}</div><div class="pa-lbl">Career total</div></div>
        </div>
      </div>

      <div class="stat-section">
        <h2>Fight history</h2>
        <div id="historyContainer">
          <div class="loading-state" style="padding: 30px;">
            <div class="loading-spinner"></div>
            <div>Loading fight history…</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Fire style, finisher, cardio and history loads in parallel — none blocks the others
  loadStyle(f);
  loadFinisher(f);
  loadCardio(f);
  await loadHistory();
}

// Does this fighter hold their pace into rounds three and beyond? Reads
// v_fighter_consistency, which compares late-round output to round-one output
// within the SAME fights. The score is a ratio, so 100 means they kept exactly
// the pace they set — which is why we also show the pace itself: a fighter who
// is equally inactive early and late scores well without being hard to fight.
async function loadCardio(f) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('cardioSection');
  const box = document.getElementById('cardioCard');
  if (!sec || !box) return;

  // Weight-class row first, CAREER as the fallback (same pattern as loadStyle).
  let row = null;
  if (f.division) {
    const { data } = await sb.from('v_fighter_consistency').select('*')
      .eq('fighter_id', f.id).eq('weight_class', f.division).maybeSingle();
    if (data && data.consistency_score != null) row = data;
  }
  if (!row) {
    const { data } = await sb.from('v_fighter_consistency').select('*')
      .eq('fighter_id', f.id).eq('weight_class', 'CAREER').maybeSingle();
    if (data && data.consistency_score != null) row = data;
  }
  if (!row) return;   // not enough deep-water film — leave the section hidden

  const score = Number(row.consistency_score);
  const TIER = {
    tireless:  { label: 'Tireless',  cls: 'granite', line: 'Holds their pace into the championship rounds.' },
    steady:    { label: 'Steady',    cls: 'granite', line: 'Output holds up well as the fight wears on.' },
    tapers:    { label: 'Tapers',    cls: '',        line: 'Slows down noticeably in the later rounds.' },
    fades:     { label: 'Fades',     cls: 'fragile', line: 'Output drops off badly once the fight gets deep.' },
    collapses: { label: 'Collapses', cls: 'fragile', line: 'Falls apart in deep water — a real vulnerability.' },
  };
  const t = TIER[row.cardio_tier] || { label: row.cardio_tier, cls: '', line: '' };
  const pace = row.r1_sig_str_per_min != null ? Number(row.r1_sig_str_per_min) : null;
  const lowPace = pace != null && pace < 4.0;
  const limited = row.confidence_tier === 'limited';

  // 50 -> 0%, 100 -> 50%, 150+ -> 100%. The bar is a feel, the number is truth.
  const barPct = Math.max(2, Math.min(100, (score - 50)));

  box.innerHTML = `
    <div class="fin-tags">
      <span class="fin-tag ${t.cls}">${cfl.escapeHtml(t.label)}</span>
      ${lowPace ? '<span class="fin-tag">Low volume</span>' : ''}
      ${limited ? '<span class="fin-tag">Thin sample</span>' : ''}
    </div>
    <div class="fin-bar" style="background:var(--bg-4)">
      <div class="fin-seg ${score >= 90 ? 'sub' : 'ko'}" style="width:${barPct}%">${score.toFixed(0)}</div>
    </div>
    <div class="fin-legend"><span>50 = output halves late</span><span>100 = pace held exactly</span></div>
    <div class="pa-grid">
      <div class="pa-box"><div class="pa-val">${score.toFixed(0)}</div><div class="pa-lbl">Pace held into rounds 3+</div></div>
      <div class="pa-box"><div class="pa-val">${pace != null ? pace.toFixed(1) : '—'}</div><div class="pa-lbl">Strikes thrown per min (R1)</div></div>
      <div class="pa-box"><div class="pa-val">${row.r3p_minutes}m</div><div class="pa-lbl">Late-round film measured</div></div>
    </div>
    <div class="fin-note">${cfl.escapeHtml(t.line)}
      ${lowPace ? ' Worth noting they fight at a low volume to begin with, so holding that pace is easier than it looks.' : ''}
      Measured only in fights that actually reached round three, comparing their late output to their own round-one pace in those same fights.
      ${limited ? ' Based on limited deep-water film — treat it loosely.' : ''}</div>
  `;
  sec.hidden = false;
}

// How this fighter ends fights, and how they get ended. Reads
// v_fighter_finisher, which splits finishes they scored from finishes they
// suffered — the older v_fighter_finish_rate lumped both together, so a fighter
// who kept getting knocked out looked identical to one who did the knocking.
// Career-to-date by design: this describes a record, it doesn't forecast.
async function loadFinisher(f) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('finisherSection');
  const box = document.getElementById('finisherCard');
  if (!sec || !box) return;

  const { data, error } = await sb
    .from('v_fighter_finisher')
    .select('*')
    .eq('fighter_id', f.id)
    .maybeSingle();
  if (error || !data) return;   // under 3 graded fights — leave the section hidden

  const pct = v => Math.round(100 * Number(v || 0));
  const koP = pct(data.ko_rate), subP = pct(data.sub_rate);
  const decP = Math.max(0, 100 - koP - subP);

  const STYLE = {
    ko_artist:           { label: 'Knockout artist',   cls: 'ko' },
    submission_hunter:   { label: 'Submission hunter', cls: 'sub' },
    mixed_finisher:      { label: 'Finisher',          cls: 'ko' },
    occasional_finisher: { label: 'Occasional finisher', cls: '' },
    grinder:             { label: 'Goes to the cards', cls: 'grind' },
  };
  const DURA = {
    granite:    { label: 'Never been finished', cls: 'granite' },
    solid:      { label: 'Hard to finish',      cls: 'granite' },
    vulnerable: { label: 'Can be finished',     cls: '' },
    fragile:    { label: 'Gets finished often', cls: 'fragile' },
  };
  const st = STYLE[data.finish_style] || { label: data.finish_style, cls: '' };
  const du = DURA[data.durability] || { label: data.durability, cls: '' };

  // Only label a segment when there's room for the text to fit.
  const seg = (p, cls) => p >= 8
    ? `<div class="fin-seg ${cls}" style="width:${p}%">${p}%</div>`
    : (p > 0 ? `<div class="fin-seg ${cls}" style="width:${p}%"></div>` : '');

  box.innerHTML = `
    <div class="fin-tags">
      <span class="fin-tag ${st.cls}">${cfl.escapeHtml(st.label)}</span>
      <span class="fin-tag ${du.cls}">${cfl.escapeHtml(du.label)}</span>
    </div>
    <div class="fin-bar">
      ${seg(koP, 'ko')}${seg(subP, 'sub')}${seg(decP, 'dec')}
    </div>
    <div class="fin-legend">
      <span><i style="background:#b8322f"></i>KO/TKO</span>
      <span><i style="background:#2f6bb8"></i>Submission</span>
      <span><i style="background:#4a4a52"></i>Decision</span>
    </div>
    <div class="pa-grid">
      <div class="pa-box"><div class="pa-val">${pct(data.finish_rate)}%</div><div class="pa-lbl">Fights they finish</div></div>
      <div class="pa-box"><div class="pa-val">${data.avg_fight_min}m</div><div class="pa-lbl">Average fight length</div></div>
      <div class="pa-box"><div class="pa-val">${pct(data.finished_rate)}%</div><div class="pa-lbl">Fights they're finished in</div></div>
      <div class="pa-box"><div class="pa-val">${data.ko_wins + data.sub_wins}</div><div class="pa-lbl">Career finishes</div></div>
      <div class="pa-box"><div class="pa-val">${data.times_finished}</div><div class="pa-lbl">Times finished</div></div>
      <div class="pa-box"><div class="pa-val">${data.total_fights}</div><div class="pa-lbl">Fights counted</div></div>
    </div>
    <div class="fin-note">Across ${data.total_fights} graded UFC fights. The split above is how
      <strong>their own wins</strong> came — losses aren't counted as knockouts for them.
      Finishing style tracks how long a fight lasts, not who wins it: in our testing it says
      nothing useful about picking a winner.</div>
  `;
  sec.hidden = false;
}

async function loadStyle(f) {
  const sb = window.cflSupabase;
  const pill = document.getElementById('fhStyle');
  if (!pill) return;

  // Try the fighter's primary division first; fall back to CAREER row.
  // The view returns 'grappler' / 'striker' / 'hybrid'.
  let style = null;
  if (f.division) {
    const { data } = await sb
      .from('v_fighter_style')
      .select('style, sample_fights')
      .eq('fighter_id', f.id)
      .eq('weight_class', f.division)
      .maybeSingle();
    if (data && data.style) style = data.style;
  }
  if (!style) {
    const { data } = await sb
      .from('v_fighter_style')
      .select('style, sample_fights')
      .eq('fighter_id', f.id)
      .eq('weight_class', 'CAREER')
      .maybeSingle();
    if (data && data.style) style = data.style;
  }

  if (!style) return;  // not enough data — leave pill hidden

  pill.textContent = style;
  pill.classList.add(style);
  pill.style.display = 'inline-block';
}

async function loadHistory() {
  const sb = window.cflSupabase;
  const container = document.getElementById('historyContainer');

  // Fetch all fights involving this fighter
  const { data: fights, error } = await sb
    .from('fights')
    .select('id, fighter_a_id, fighter_b_id, fighter_a_name, fighter_b_name, winner_id, method, end_round, end_time, weight_class, is_title_fight, event_id')
    .or(`fighter_a_id.eq.${fighterId},fighter_b_id.eq.${fighterId}`);

  if (error) {
    container.innerHTML = cfl.errorHtml('Failed to load fight history: ' + error.message);
    return;
  }

  if (!fights || fights.length === 0) {
    container.innerHTML = '<div class="no-results">No UFC fights found for this fighter.</div>';
    return;
  }

  // Get event dates so we can sort
  const eventIds = [...new Set(fights.map(f => f.event_id))];
  const { data: events } = await sb
    .from('events')
    .select('id, name, event_date, is_upcoming')
    .in('id', eventIds);
  const eventMap = {};
  (events || []).forEach(e => { eventMap[e.id] = e; });

  // Annotate and sort, most recent first
  fights.forEach(f => {
    f._event = eventMap[f.event_id];
    f._date = f._event ? f._event.event_date : '';
  });
  fights.sort((a, b) => (b._date || '').localeCompare(a._date || ''));

  // Render
  const rows = fights.map(f => {
    const isA = f.fighter_a_id === fighterId;
    const oppId = isA ? f.fighter_b_id : f.fighter_a_id;
    const oppName = isA ? f.fighter_b_name : f.fighter_a_name;
    let result = 'NC';
    if (f._event && f._event.is_upcoming) {
      result = '—';
    } else if (f.winner_id == null) {
      result = (f.method || '').toLowerCase().startsWith('decision') ? 'D' : 'NC';
    } else if (f.winner_id === fighterId) {
      result = 'W';
    } else {
      result = 'L';
    }
    const finish = f.end_round && f.end_time
      ? `R${f.end_round} ${f.end_time}`
      : '—';
    const oppLink = oppId
      ? `<a class="opp-link" href="${cfl.fighterUrl(oppId)}">${cfl.escapeHtml(oppName || '—')}</a>`
      : cfl.escapeHtml(oppName || '—');
    const dateCell = f._event
      ? `<a class="opp-link" href="${cfl.eventUrl(f._event.id)}" title="${cfl.escapeHtml(f._event.name || '')}">${cfl.formatDate(f._event.event_date)}</a>`
      : '—';
    return `
      <tr>
        <td><span class="result-pill ${result}">${result}</span></td>
        <td>${oppLink}</td>
        <td>${cfl.escapeHtml(f.method || '—')}</td>
        <td style="color:var(--text-2)">${finish}</td>
        <td style="color:var(--text-3); font-size: 12px;">${dateCell}</td>
      </tr>
    `;
  }).join('');

  // Compute summary stats from the data
  const completed = fights.filter(f => f._event && !f._event.is_upcoming);
  const wins = completed.filter(f => f.winner_id === fighterId).length;
  const losses = completed.filter(f => f.winner_id != null && f.winner_id !== fighterId).length;

  container.innerHTML = `
    <div style="margin-bottom: 12px; font-size: 13px; color: var(--text-3);">
      <strong style="color:var(--green)">${wins}W</strong> · <strong style="color:var(--red)">${losses}L</strong> in ${completed.length} UFC fight${completed.length === 1 ? '' : 's'}
    </div>
    <div class="card padded" style="padding: 0; overflow: hidden;">
      <table class="history-table">
        <thead>
          <tr>
            <th>Result</th>
            <th>Opponent</th>
            <th>Method</th>
            <th>Finish</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

load();
</script>

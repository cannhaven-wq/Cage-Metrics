  .read-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text-3); border-radius: 4px; }

<body>

<nav class="cfl-nav"></nav>

<div id="content">
  <div class="loading-state" style="padding: 80px;">
    <div class="loading-spinner"></div>
    <div>Loading fighter…</div>
  </div>
</div>

<footer class="cfl-footer"></footer>

<script src="_shared.js?v=rd16"></script>
<script src="_auth.js"></script>
<script src="fight-insights.js?v=6"></script>
<script>
cfl.renderNav('fighters');
cfl.renderFooter();

const fighterId = parseInt(cfl.getQueryParam('id'), 10);

// Update <head> meta tags + JSON-LD once we know which fighter this is. Modern
// crawlers (Google, Bing) index JS-mutated meta. Twitter/Facebook unfurls
// don't — those need prerendered HTML, handled separately by the build step.
function setMeta(attr, key, value) {
  let tag = document.querySelector(`meta[${attr}="${key}"]`);
  if (!tag) {
    tag = document.createElement('meta');
    tag.setAttribute(attr, key);
    document.head.appendChild(tag);
  }
  tag.setAttribute('content', value);
}

function injectJsonLd(id, data) {
  let script = document.getElementById(id);
  if (!script) {
    script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = id;
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify(data);
}

function updateFighterSEO(f) {
  const url = `https://cannonfightlab.com/fighter.html?id=${f.id}`;
  const careerRec = `${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''}`;
  const division = f.division ? `, ${f.division}` : '';
  const title = `${f.name} — UFC Fighter Stats & Analytics | Cannon Fight Lab`;
  const desc = `${f.name}${f.nickname ? ' "' + f.nickname + '"' : ''} UFC fighter stats: ${careerRec} career record${division}. Cardio score, striking, grappling, recent form, head-to-head matchups.`;

  document.title = title;
  setMeta('name', 'description', desc);
  setMeta('property', 'og:title', `${f.name} — UFC Fighter Stats`);
  setMeta('property', 'og:description', desc);
  setMeta('property', 'og:url', url);
  setMeta('name', 'twitter:title', `${f.name} — UFC Fighter Stats`);
  setMeta('name', 'twitter:description', desc);

  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.setAttribute('href', url);

  // Athlete schema (schema.org/Person — Athlete is a subtype implied by jobTitle)
  const athlete = {
    '@context': 'https://schema.org',
    '@type': 'Person',
    'name': f.name,
    'url': url,
    'jobTitle': 'Mixed Martial Artist',
    'memberOf': { '@type': 'SportsOrganization', 'name': 'Ultimate Fighting Championship', 'alternateName': 'UFC' }
  };
  if (f.nickname) athlete.alternateName = f.nickname;
  if (f.height_in) athlete.height = cfl.formatHeight(f.height_in);
  injectJsonLd('athlete-schema', athlete);

  injectJsonLd('breadcrumb-schema', {
    '@context': 'https://schema.org',
    '@type': 'BreadcrumbList',
    'itemListElement': [
      { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': 'https://cannonfightlab.com/' },
      { '@type': 'ListItem', 'position': 2, 'name': 'Fighters', 'item': 'https://cannonfightlab.com/fighters.html' },
      { '@type': 'ListItem', 'position': 3, 'name': f.name, 'item': url }
    ]
  });
}

async function load() {
  if (!fighterId) {
    document.getElementById('content').innerHTML = cfl.errorHtml('No fighter id provided. <a href="fighters.html" style="color:var(--red)">Back to fighter list</a>');
    return;
  }

  const sb = window.cflSupabase;

  const { data: f, error } = await sb
    .from('fighters')
    .select('*')
    .eq('id', fighterId)
    .single();

  if (error || !f) {
    document.getElementById('content').innerHTML = cfl.errorHtml('Fighter not found. <a href="fighters.html" style="color:var(--red)">Back to fighter list</a>');
    return;
  }

  updateFighterSEO(f);

  const ufcRec = (f.ufc_wins ?? 0) + (f.ufc_losses ?? 0) + (f.ufc_draws ?? 0);
  const hasUfc = ufcRec > 0;

  document.getElementById('content').innerHTML = `
    <div class="fighter-hero">
      <div class="fighter-hero-inner">
        <div class="cfl-avatar xl">${cfl.escapeHtml(cfl.initials(f.name))}</div>
        <div>
          <h1 class="fh-name">${cfl.escapeHtml(f.name)}</h1>
          ${f.nickname ? `<div class="fh-nick">"${cfl.escapeHtml(f.nickname)}"</div>` : ''}
          ${f.division ? `<div class="fh-division">${cfl.escapeHtml(f.division)}</div>` : ''}
          ${cfl.flagChip && cfl.flagChip(f) ? `<div class="fh-origin" title="${cfl.escapeHtml(f.birth_place || f.country)}">${cfl.flagChip(f)}</div>` : ''}
          <div class="fh-style" id="fhStyle" style="display:none"></div>
        </div>
        <div class="fh-records">
          ${hasUfc ? `
            <div class="record-block">
              <div class="big-record" id="ufcRecordBig">${f.ufc_wins ?? 0}-${f.ufc_losses ?? 0}${f.ufc_draws ? '-' + f.ufc_draws : ''}</div>
              <div class="record-label">UFC record</div>
            </div>
          ` : ''}
          <div class="record-block career">
            <div class="big-record">${f.wins ?? 0}-${f.losses ?? 0}${f.draws ? '-' + f.draws : ''}</div>
            <div class="record-label">Career</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="stat-section" id="readSection">
        <h2>The read</h2>
        <div class="read-lead" id="readLead">Placing ${cfl.escapeHtml(f.name)} against the division…</div>
        <div class="read-list" id="readList"></div>
      </div>

      <div class="stat-section" id="modelRecSection" hidden>
        <h2>Against the model's expectations</h2>
        <div class="fin-wrap" id="modelRecCard"></div>
      </div>

      <div class="stat-section" id="nextSection" hidden>
        <h2>Next fight</h2>
        <div class="fin-wrap" id="nextCard"></div>
      </div>

      <div class="stat-section" id="finisherSection" hidden>
        <h2>How they finish</h2>
        <div class="fin-wrap" id="finisherCard"></div>
      </div>

      <div class="stat-section" id="cardioSection" hidden>
        <h2>Deep water</h2>
        <div class="fin-wrap" id="cardioCard"></div>
      </div>

      <details class="stat-section all-numbers">
        <summary><h2>All the numbers</h2><span class="an-hint">the raw stats behind the read</span></summary>
        <div class="an-body">
          <h3>Performance</h3>
          <div class="stats-grid-4">
            <div class="stat-box"><div class="stat-val accent">${f.slpm != null ? Number(f.slpm).toFixed(1) : '—'}</div><div class="stat-lbl">Sig. strikes per min</div></div>
            <div class="stat-box"><div class="stat-val">${f.sapm != null ? Number(f.sapm).toFixed(1) : '—'}</div><div class="stat-lbl">Absorbed per min</div></div>
            <div class="stat-box"><div class="stat-val accent">${f.td_avg != null ? Number(f.td_avg).toFixed(1) : '—'}</div><div class="stat-lbl">Takedowns per 15 min</div></div>
            <div class="stat-box"><div class="stat-val">${f.td_def != null ? f.td_def + '%' : '—'}</div><div class="stat-lbl">Takedown defense</div></div>
            <div class="stat-box"><div class="stat-val">${f.str_acc != null ? f.str_acc + '%' : '—'}</div><div class="stat-lbl">Strike accuracy</div></div>
            <div class="stat-box"><div class="stat-val">${f.str_def != null ? f.str_def + '%' : '—'}</div><div class="stat-lbl">Strike defense</div></div>
            <div class="stat-box"><div class="stat-val">${f.sub_avg != null ? Number(f.sub_avg).toFixed(1) : '—'}</div><div class="stat-lbl">Sub attempts per 15</div></div>
            <div class="stat-box"><div class="stat-val">${f.last_5 || '—'}</div><div class="stat-lbl">Last 5 fights</div></div>
          </div>
          <h3>Physical</h3>
          <div class="pa-grid">
            <div class="pa-box"><div class="pa-val">${cfl.formatHeight(f.height_in)}</div><div class="pa-lbl">Height</div></div>
            <div class="pa-box"><div class="pa-val">${cfl.formatReach(f.reach_in)}</div><div class="pa-lbl">Reach</div></div>
            <div class="pa-box"><div class="pa-val">${cfl.escapeHtml(f.stance || '—')}</div><div class="pa-lbl">Stance</div></div>
            <div class="pa-box"><div class="pa-val">${f.age ?? '—'}</div><div class="pa-lbl">Age</div></div>
            <div class="pa-box"><div class="pa-val">${ufcRec || '—'}</div><div class="pa-lbl">UFC fights</div></div>
            <div class="pa-box"><div class="pa-val">${(f.wins ?? 0) + (f.losses ?? 0) + (f.draws ?? 0)}</div><div class="pa-lbl">Career total</div></div>
          </div>
          <div class="pa-grid" id="ratingNumbers"></div>
        </div>
      </details>

      <div class="stat-section">
        <h2>Fight history</h2>
        <div id="historyContainer">
          <div class="loading-state" style="padding: 30px;">
            <div class="loading-spinner"></div>
            <div>Loading fight history…</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Fire style, finisher, cardio and history loads in parallel — none blocks the others
  loadRead(f);
  loadModelRecord(f);
  loadStyle(f);
  loadFinisher(f);
  loadCardio(f);
  const fights = await loadHistory();
  loadNextFight(f, fights);
}

// Does this fighter hold their pace into rounds three and beyond? Reads
// v_fighter_consistency, which compares late-round output to round-one output
// within the SAME fights. The score is a ratio, so 100 means they kept exactly
// the pace they set — which is why we also show the pace itself: a fighter who
// is equally inactive early and late scores well without being hard to fight.
async function loadCardio(f) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('cardioSection');
  const box = document.getElementById('cardioCard');
  if (!sec || !box) return;

  // Weight-class row first, CAREER as the fallback (same pattern as loadStyle).
  let row = null;
  if (f.division) {
    const { data } = await sb.from('v_fighter_consistency').select('*')
      .eq('fighter_id', f.id).eq('weight_class', f.division).maybeSingle();
    if (data && data.consistency_score != null) row = data;
  }
  if (!row) {
    const { data } = await sb.from('v_fighter_consistency').select('*')
      .eq('fighter_id', f.id).eq('weight_class', 'CAREER').maybeSingle();
    if (data && data.consistency_score != null) row = data;
  }
  if (!row) return;   // not enough deep-water film — leave the section hidden

  const score = Number(row.consistency_score);
  const TIER = {
    tireless:  { label: 'Tireless',  cls: 'granite', line: 'Holds their pace into the championship rounds.' },
    steady:    { label: 'Steady',    cls: 'granite', line: 'Output holds up well as the fight wears on.' },
    tapers:    { label: 'Tapers',    cls: '',        line: 'Slows down noticeably in the later rounds.' },
    fades:     { label: 'Fades',     cls: 'fragile', line: 'Output drops off badly once the fight gets deep.' },
    collapses: { label: 'Collapses', cls: 'fragile', line: 'Falls apart in deep water — a real vulnerability.' },
  };
  const t = TIER[row.cardio_tier] || { label: row.cardio_tier, cls: '', line: '' };
  const pace = row.r1_sig_str_per_min != null ? Number(row.r1_sig_str_per_min) : null;
  const lowPace = pace != null && pace < 4.0;
  const limited = row.confidence_tier === 'limited';

  // 50 -> 0%, 100 -> 50%, 150+ -> 100%. The bar is a feel, the number is truth.
  const barPct = Math.max(2, Math.min(100, (score - 50)));

  box.innerHTML = `
    <div class="fin-tags">
      <span class="fin-tag ${t.cls}">${cfl.escapeHtml(t.label)}</span>
      ${lowPace ? '<span class="fin-tag">Low volume</span>' : ''}
      ${limited ? '<span class="fin-tag">Thin sample</span>' : ''}
    </div>
    <div class="fin-bar" style="background:var(--bg-4)">
      <div class="fin-seg ${score >= 90 ? 'sub' : 'ko'}" style="width:${barPct}%">${score.toFixed(0)}</div>
    </div>
    <div class="fin-legend"><span>50 = output halves late</span><span>100 = pace held exactly</span></div>
    <div class="pa-grid">
      <div class="pa-box"><div class="pa-val">${score.toFixed(0)}</div><div class="pa-lbl">Pace held into rounds 3+</div></div>
      <div class="pa-box"><div class="pa-val">${pace != null ? pace.toFixed(1) : '—'}</div><div class="pa-lbl">Strikes thrown per min (R1)</div></div>
      <div class="pa-box"><div class="pa-val">${row.r3p_minutes}m</div><div class="pa-lbl">Late-round film measured</div></div>
    </div>
    <div class="fin-note">${cfl.escapeHtml(t.line)}
      ${lowPace ? ' Worth noting they fight at a low volume to begin with, so holding that pace is easier than it looks.' : ''}
      Measured only in fights that actually reached round three, comparing their late output to their own round-one pace in those same fights.
      ${limited ? ' Based on limited deep-water film — treat it loosely.' : ''}</div>
  `;
  sec.hidden = false;
}

// How this fighter ends fights, and how they get ended. Reads
// v_fighter_finisher, which splits finishes they scored from finishes they
// suffered — the older v_fighter_finish_rate lumped both together, so a fighter
// who kept getting knocked out looked identical to one who did the knocking.
// Career-to-date by design: this describes a record, it doesn't forecast.
async function loadFinisher(f) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('finisherSection');
  const box = document.getElementById('finisherCard');
  if (!sec || !box) return;

  const { data, error } = await sb
    .from('v_fighter_finisher')
    .select('*')
    .eq('fighter_id', f.id)
    .maybeSingle();
  if (error || !data) return;   // under 3 graded fights — leave the section hidden

  const pct = v => Math.round(100 * Number(v || 0));
  const koP = pct(data.ko_rate), subP = pct(data.sub_rate);
  const decP = Math.max(0, 100 - koP - subP);

  const STYLE = {
    ko_artist:           { label: 'Knockout artist',   cls: 'ko' },
    submission_hunter:   { label: 'Submission hunter', cls: 'sub' },
    mixed_finisher:      { label: 'Finisher',          cls: 'ko' },
    occasional_finisher: { label: 'Occasional finisher', cls: '' },
    grinder:             { label: 'Goes to the cards', cls: 'grind' },
  };
  const DURA = {
    granite:    { label: 'Never been finished', cls: 'granite' },
    solid:      { label: 'Hard to finish',      cls: 'granite' },
    vulnerable: { label: 'Can be finished',     cls: '' },
    fragile:    { label: 'Gets finished often', cls: 'fragile' },
  };
  const st = STYLE[data.finish_style] || { label: data.finish_style, cls: '' };
  const du = DURA[data.durability] || { label: data.durability, cls: '' };

  // Only label a segment when there's room for the text to fit.
  const seg = (p, cls) => p >= 8
    ? `<div class="fin-seg ${cls}" style="width:${p}%">${p}%</div>`
    : (p > 0 ? `<div class="fin-seg ${cls}" style="width:${p}%"></div>` : '');

  box.innerHTML = `
    <div class="fin-tags">
      <span class="fin-tag ${st.cls}">${cfl.escapeHtml(st.label)}</span>
      <span class="fin-tag ${du.cls}">${cfl.escapeHtml(du.label)}</span>
    </div>
    <div class="fin-bar">
      ${seg(koP, 'ko')}${seg(subP, 'sub')}${seg(decP, 'dec')}
    </div>
    <div class="fin-legend">
      <span><i style="background:#b8322f"></i>KO/TKO</span>
      <span><i style="background:#2f6bb8"></i>Submission</span>
      <span><i style="background:#4a4a52"></i>Decision</span>
    </div>
    <div class="pa-grid">
      <div class="pa-box"><div class="pa-val">${pct(data.finish_rate)}%</div><div class="pa-lbl">Fights they finish</div></div>
      <div class="pa-box"><div class="pa-val">${data.avg_fight_min}m</div><div class="pa-lbl">Average fight length</div></div>
      <div class="pa-box"><div class="pa-val">${pct(data.finished_rate)}%</div><div class="pa-lbl">Fights they're finished in</div></div>
      <div class="pa-box"><div class="pa-val">${data.ko_wins + data.sub_wins}</div><div class="pa-lbl">Career finishes</div></div>
      <div class="pa-box"><div class="pa-val">${data.times_finished}</div><div class="pa-lbl">Times finished</div></div>
      <div class="pa-box"><div class="pa-val">${data.total_fights}</div><div class="pa-lbl">Fights counted</div></div>
    </div>
    <div class="fin-note">Across ${data.total_fights} graded UFC fights. The split above is how
      <strong>their own wins</strong> came — losses aren't counted as knockouts for them.
      Finishing style tracks how long a fight lasts, not who wins it: in our testing it says
      nothing useful about picking a winner.</div>
  `;
  sec.hidden = false;
}

async function loadStyle(f) {
  const sb = window.cflSupabase;
  const pill = document.getElementById('fhStyle');
  if (!pill) return;

  // Try the fighter's primary division first; fall back to CAREER row.
  // The view returns 'grappler' / 'striker' / 'hybrid'.
  let style = null;
  if (f.division) {
    const { data } = await sb
      .from('v_fighter_style')
      .select('style, sample_fights')
      .eq('fighter_id', f.id)
      .eq('weight_class', f.division)
      .maybeSingle();
    if (data && data.style) style = data.style;
  }
  if (!style) {
    const { data } = await sb
      .from('v_fighter_style')
      .select('style, sample_fights')
      .eq('fighter_id', f.id)
      .eq('weight_class', 'CAREER')
      .maybeSingle();
    if (data && data.style) style = data.style;
  }

  if (!style) return;  // not enough data — leave pill hidden

  pill.textContent = style;
  pill.classList.add(style);
  pill.style.display = 'inline-block';
}

async function loadHistory() {
  const sb = window.cflSupabase;
  const container = document.getElementById('historyContainer');

  // Fetch all fights involving this fighter
  const { data: fights, error } = await sb
    .from('fights')
    .select('id, fighter_a_id, fighter_b_id, fighter_a_name, fighter_b_name, winner_id, method, end_round, end_time, weight_class, is_title_fight, event_id')
    .or(`fighter_a_id.eq.${fighterId},fighter_b_id.eq.${fighterId}`);

  if (error) {
    container.innerHTML = cfl.errorHtml('Failed to load fight history: ' + error.message);
    return [];
  }

  if (!fights || fights.length === 0) {
    container.innerHTML = '<div class="no-results">No UFC fights found for this fighter.</div>';
    return [];
  }

  // Get event dates so we can sort
  const eventIds = [...new Set(fights.map(f => f.event_id))];
  const { data: events } = await sb
    .from('events')
    .select('id, name, event_date, is_upcoming')
    .in('id', eventIds);
  const eventMap = {};
  (events || []).forEach(e => { eventMap[e.id] = e; });

  // Annotate and sort, most recent first
  fights.forEach(f => {
    f._event = eventMap[f.event_id];
    f._date = f._event ? f._event.event_date : '';
  });
  fights.sort((a, b) => (b._date || '').localeCompare(a._date || ''));

  // Render
  const rows = fights.map(f => {
    const isA = f.fighter_a_id === fighterId;
    const oppId = isA ? f.fighter_b_id : f.fighter_a_id;
    const oppName = isA ? f.fighter_b_name : f.fighter_a_name;
    let result = 'NC';
    if (f._event && f._event.is_upcoming) {
      result = '—';
    } else if (f.winner_id == null) {
      result = (f.method || '').toLowerCase().startsWith('decision') ? 'D' : 'NC';
    } else if (f.winner_id === fighterId) {
      result = 'W';
    } else {
      result = 'L';
    }
    const finish = f.end_round && f.end_time
      ? `R${f.end_round} ${f.end_time}`
      : '—';
    const oppLink = oppId
      ? `<a class="opp-link" href="${cfl.fighterUrl(oppId)}">${cfl.escapeHtml(oppName || '—')}</a>`
      : cfl.escapeHtml(oppName || '—');
    const dateCell = f._event
      ? `<a class="opp-link" href="${cfl.eventUrl(f._event.id)}" title="${cfl.escapeHtml(f._event.name || '')}">${cfl.formatDate(f._event.event_date)}</a>`
      : '—';
    return `
      <tr>
        <td><span class="result-pill ${result}">${result}</span></td>
        <td>${oppLink}</td>
        <td>${cfl.escapeHtml(f.method || '—')}</td>
        <td style="color:var(--text-2)">${finish}</td>
        <td style="color:var(--text-3); font-size: 12px;">${dateCell}</td>
      </tr>
    `;
  }).join('');

  // Compute summary stats from the data
  const completed = fights.filter(f => f._event && !f._event.is_upcoming);
  const wins = completed.filter(f => f.winner_id === fighterId).length;
  const losses = completed.filter(f => f.winner_id != null && f.winner_id !== fighterId).length;
  // The fighters table's ufc_wins/ufc_losses field drifts from the fights we
  // actually hold (Jon Jones read 12-11 there against 22-1 on the record
  // below). The hero shows the record the history proves, so the two can
  // never disagree on one page.
  const hero = document.getElementById('ufcRecordBig');
  if (hero && completed.length) {
    const draws = completed.filter(f => f.winner_id == null && (f.method || '').toLowerCase().startsWith('decision')).length;
    hero.textContent = `${wins}-${losses}${draws ? '-' + draws : ''}`;
  }

  container.innerHTML = `
    <div style="margin-bottom: 12px; font-size: 13px; color: var(--text-3);">
      <strong style="color:var(--green)">${wins}W</strong> · <strong style="color:var(--red)">${losses}L</strong> in ${completed.length} UFC fight${completed.length === 1 ? '' : 's'}
    </div>
    <div class="card padded" style="padding: 0; overflow: hidden;">
      <table class="history-table">
        <thead>
          <tr>
            <th>Result</th>
            <th>Opponent</th>
            <th>Method</th>
            <th>Finish</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  return fights;
}

// ---------------------------------------------------------------------------
// THE READ — where this fighter sits inside the division on each thing that
// matters, said in words. Percentiles come from v_fighter_division_read
// (fighters with 3+ UFC fights who fought in the last five years), so "7 of
// 10 lightweights" means the lightweights they actually share a roster with.
// Opponent quality comes from fighter_ratings (the engine's own Elo).
// ---------------------------------------------------------------------------
const lastName = n => { const p = String(n || '').trim().split(/\s+/); return p[p.length - 1] || n; };
const divPlural = d => { const x = String(d || 'fighter').toLowerCase(); return x.endsWith('weight') ? x + 's' : x + ' fighters'; };
const divSingular = d => String(d || 'fighter').toLowerCase();
const tenths = p => Math.max(1, Math.min(9, Math.round(p * 10)));

async function loadRead(f) {
  const sb = window.cflSupabase;
  const lead = document.getElementById('readLead');
  const list = document.getElementById('readList');
  if (!lead || !list) return;

  const ufcN = (f.ufc_wins ?? 0) + (f.ufc_losses ?? 0) + (f.ufc_draws ?? 0);
  const [dR, rR] = await Promise.all([
    sb.from('v_fighter_division_read').select('*').eq('fighter_id', f.id).maybeSingle(),
    sb.from('fighter_ratings').select('*').eq('fighter_id', f.id).maybeSingle(),
  ]);
  const d = dR.data || null;
  const r = rR.data || null;

  if (!d || !d.in_pool) {
    lead.textContent = ufcN === 0
      ? `${f.name} has no UFC fights on record. There is no tape to read yet — treat every number on this page as a guess until there is.`
      : `${f.name} has ${ufcN} UFC fight${ufcN === 1 ? '' : 's'} on record — too few to place against the division honestly. The numbers below are real but thin.`;
    list.innerHTML = '';
    return;
  }

  const L = lastName(f.name);
  const div = divPlural(d.division);
  const one = divSingular(d.division);
  const rows = [];   // { strength, phrase, sentence, stat, pct, good }
  const push = (pct, hiPhrase, hiSent, loPhrase, loSent, midSent, stat, hiIsGood) => {
    if (pct == null) return;
    const n = tenths(pct);
    if (pct >= 0.7)      rows.push({ strength: pct - 0.5, phrase: hiPhrase(n), sentence: hiSent(n), stat, pct, good: hiIsGood });
    else if (pct <= 0.3) rows.push({ strength: 0.5 - pct, phrase: loPhrase(10 - n), sentence: loSent(10 - n), stat, pct, good: hiIsGood == null ? null : !hiIsGood });
    else                 rows.push({ strength: 0, phrase: null, sentence: midSent, stat, pct, good: null });
  };
  const num = (v, dp = 1) => v == null ? '—' : Number(v).toFixed(dp);

  push(d.slpm_pct,
    n => 'a high-volume striker', n => `${L} lands more than ${n} of 10 ${div}.`,
    n => 'a low-volume striker', n => `${L} lands less than ${n} of 10 ${div} — a low-volume fighter by choice or by style.`,
    `${L} lands about what a typical ${one} lands.`,
    `${num(f.slpm)} landed per minute · division median ${num(d.slpm_med)}`, true);
  push(d.sapm_pct,
    n => 'gets hit a lot', n => `${L} gets hit more than ${n} of 10 ${div}.`,
    n => 'hard to hit', n => `${L} gets hit less than ${n} of 10 ${div}.`,
    `${L} absorbs about as much as a typical ${one}.`,
    `${num(f.sapm)} absorbed per minute · division median ${num(d.sapm_med)}`, false);
  push(d.str_def_pct,
    n => 'slippery on defense', n => `${L} slips more strikes than ${n} of 10 ${div}.`,
    n => 'easy to find with strikes', n => `${L} is easier to hit clean than ${n} of 10 ${div} — strike defense is a real weakness.`,
    `${L}'s strike defense is about average for the division.`,
    `${f.str_def ?? '—'}% of strikes avoided · division median ${num(d.str_def_med, 0)}%`, true);
  push(d.td_def_pct,
    n => 'hard to take down', n => `${L} stops more takedowns than ${n} of 10 ${div}.`,
    n => 'easy to take down', n => `${L} gets taken down more easily than ${n} of 10 ${div}.`,
    `${L}'s takedown defense is about average for the division.`,
    `${f.td_def ?? '—'}% of takedowns stopped · division median ${num(d.td_def_med, 0)}%`, true);
  push(d.td_avg_pct,
    n => 'a wrestler first', n => `${L} takes opponents down more than ${n} of 10 ${div}.`,
    n => 'rarely shoots', n => `${L} shoots for takedowns less than ${n} of 10 ${div} — expect this to stay standing when ${L} decides.`,
    `${L} wrestles about as much as a typical ${one}.`,
    `${num(f.td_avg)} takedowns per 15 min · division median ${num(d.td_avg_med)}`, null);
  push(d.reach_pct,
    n => 'long for the division', n => `${L} has a longer reach than ${n} of 10 ${div}.`,
    n => 'gives up reach', n => `${L} gives up reach to ${n} of 10 ${div}.`,
    `${L}'s reach is about average for the division.`,
    `${cfl.formatReach(f.reach_in)} reach · division median ${d.reach_med != null ? cfl.formatReach(d.reach_med) : '—'}`, true);
  push(d.age_pct,
    n => 'older than most of the division', n => `${L} is older than ${n} of 10 ${div}. Age is the one stat that still predicts fights once the odds are accounted for, and it cuts the wrong way here.`,
    n => 'young for the division', n => `${L} is younger than ${n} of 10 ${div}. Age is the one stat that still predicts fights once the odds are accounted for, and it's on ${L}'s side.`,
    `${L} is about the division's typical age.`,
    `${f.age ?? '—'} years old · division median ${num(d.age_med, 0)}`, false);

  // Opponent quality: where this fighter's average opponent rating sits among
  // the division's rated fighters. Two small queries; no join needed.
  if (r && r.opp_elo_avg != null && d.division) {
    const { data: peers } = await sb.from('fighters').select('id').eq('division', d.division).limit(1000);
    const ids = (peers || []).map(p => p.id);
    if (ids.length) {
      const { data: prs } = await sb.from('fighter_ratings').select('fighter_id, elo, opp_elo_avg, n_fights').in('fighter_id', ids).gte('n_fights', 3);
      const pool = (prs || []).filter(x => x.opp_elo_avg != null);
      if (pool.length >= 10) {
        const oppVals = pool.map(x => Number(x.opp_elo_avg)).sort((x, y) => x - y);
        const oppMed = oppVals[Math.floor(oppVals.length / 2)];
        const pctOpp = pool.filter(x => Number(x.opp_elo_avg) < Number(r.opp_elo_avg)).length / pool.length;
        push(pctOpp,
          n => 'battle-tested', n => `${L} has faced tougher opponents than ${n} of 10 ${div}, going by who those opponents had beaten at the time.`,
          n => 'lightly tested', n => `${L} has faced softer opposition than ${n} of 10 ${div} — the record may flatter.`,
          `${L}'s opposition has been about average for the division.`,
          `average opponent rating ${num(r.opp_elo_avg, 0)} · division median ${num(oppMed, 0)} · ${r.wins_vs_rated} wins over above-average opponents`, true);
        const pctElo = pool.filter(x => Number(x.elo) < Number(r.elo)).length / pool.length;
        rows.unshift({ strength: Math.abs(pctElo - 0.5) + 0.01, phrase: null, pct: pctElo, good: pctElo >= 0.5,
          sentence: pctElo >= 0.7 ? `Once you account for who ${L} has beaten, the engine rates ${L} above ${tenths(pctElo)} of 10 ${div}.`
                  : pctElo <= 0.3 ? `Once you account for who ${L} has beaten, the engine rates ${L} below ${10 - tenths(pctElo)} of 10 ${div}.`
                  : `Once you account for who ${L} has beaten, the engine rates ${L} about mid-division.`,
          stat: `opponent-adjusted rating ${num(r.elo, 0)} · peak ${num(r.elo_peak, 0)} · ${r.n_fights} fights rated` });
        const rn = document.getElementById('ratingNumbers');
        if (rn) rn.innerHTML = `
          <div class="pa-box"><div class="pa-val">${num(r.elo, 0)}</div><div class="pa-lbl">Opponent-adjusted rating</div></div>
          <div class="pa-box"><div class="pa-val">${num(r.elo_peak, 0)}</div><div class="pa-lbl">Peak rating</div></div>
          <div class="pa-box"><div class="pa-val">${num(r.opp_elo_avg, 0)}</div><div class="pa-lbl">Avg opponent rating</div></div>
          <div class="pa-box"><div class="pa-val">${num(r.opp_elo_last5, 0)}</div><div class="pa-lbl">Avg opponent, last 5</div></div>`;
      }
    }
  }

  // Lead sentence: the three strongest things about this fighter, in one line.
  const strong = rows.filter(x => x.phrase).sort((x, y) => y.strength - x.strength).slice(0, 3).map(x => x.phrase);
  lead.textContent = strong.length
    ? `${f.name} is ${strong.length === 1 ? strong[0] : strong.slice(0, -1).join(', ') + ' and ' + strong[strong.length - 1]}.`
    : `${f.name} sits close to the division average on everything we measure — no single trait stands out.`;

  list.innerHTML = rows.map(x => {
    const w = Math.round((x.pct ?? 0.5) * 100);
    const cls = x.good === true ? 'good' : (x.good === false ? 'bad' : '');
    return `<div class="read-row ${cls}">
      <div class="read-sent">${cfl.escapeHtml(x.sentence)}</div>
      <div class="read-bar"><i style="width:${w}%"></i><b></b></div>
      <div class="read-stat">${cfl.escapeHtml(x.stat)}</div>
    </div>`;
  }).join('') + `<div class="read-foot">Bars show where ${cfl.escapeHtml(L)} ranks among ${d.pool_n} active ${cfl.escapeHtml(div)} (3+ UFC fights, fought in the last five years). The tick is the division middle.</div>`;
}

// ---------------------------------------------------------------------------
// AGAINST THE MODEL'S EXPECTATIONS — the engine has scored this fighter's past
// fights. Did they win more or fewer than it expected? Reads
// v_fighter_model_record (built from the graded picks table).
// ---------------------------------------------------------------------------
async function loadModelRecord(f) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('modelRecSection');
  const box = document.getElementById('modelRecCard');
  if (!sec || !box) return;
  const { data: m } = await sb.from('v_fighter_model_record').select('*').eq('fighter_id', f.id).maybeSingle();
  if (!m || m.n_scored < 3) return;

  const L = lastName(f.name);
  const exp = Number(m.expected_wins), wins = Number(m.wins), n = Number(m.n_scored);
  const diff = wins - exp;
  let tag, cls, line;
  if (diff >= 1)       { tag = 'Beats expectations'; cls = 'granite'; line = `${L} wins fights the model doesn't expect. Across ${n} scored fights the engine expected about ${exp.toFixed(1)} wins and ${L} got ${wins}${m.won_as_underdog ? `, including ${m.won_as_underdog} as the underdog on our numbers` : ''}.`; }
  else if (diff <= -1) { tag = 'Trails expectations'; cls = 'fragile'; line = `${L} loses fights the model expects ${L} to win. Across ${n} scored fights the engine expected about ${exp.toFixed(1)} wins and ${L} got ${wins}${m.lost_as_pick ? `, losing ${m.lost_as_pick} as our pick` : ''}.`; }
  else                 { tag = 'About as expected';  cls = '';        line = `${L} lands about where the model expects: ${wins} wins across ${n} scored fights against about ${exp.toFixed(1)} expected.`; }
  const wExp = Math.round(100 * exp / n), wAct = Math.round(100 * wins / n);
  box.innerHTML = `
    <div class="fin-tags"><span class="fin-tag ${cls}">${tag}</span><span class="fin-tag">Model called ${m.model_correct} of ${n}</span></div>
    <div class="mr-bars">
      <div class="mr-row"><span>Expected wins</span><div class="mr-track"><i style="width:${wExp}%"></i></div><b>${exp.toFixed(1)}</b></div>
      <div class="mr-row"><span>Actual wins</span><div class="mr-track act"><i style="width:${wAct}%"></i></div><b>${wins}</b></div>
    </div>
    <div class="fin-note">${cfl.escapeHtml(line)} A fighter who keeps beating the number is telling you something the stats don't; one who keeps trailing it is a fade candidate at a short price.</div>`;
  sec.hidden = false;
}

// ---------------------------------------------------------------------------
// NEXT FIGHT — the engine's pick with its reasons, and the prop projection,
// pulled from the same places the card and Prop Board read.
// ---------------------------------------------------------------------------
async function loadNextFight(f, fights) {
  const sb = window.cflSupabase;
  const sec = document.getElementById('nextSection');
  const box = document.getElementById('nextCard');
  if (!sec || !box || !fights) return;
  const up = fights.filter(x => x._event && x._event.is_upcoming).sort((x, y) => (x._date || '').localeCompare(y._date || ''))[0];
  if (!up) return;
  const isA = up.fighter_a_id === f.id;
  const oppId = isA ? up.fighter_b_id : up.fighter_a_id;
  const oppName = isA ? up.fighter_b_name : up.fighter_a_name;

  const [pickR, oppR, propR] = await Promise.all([
    sb.from('model_picks').select('fight_id, pick_fighter_id, p_cal, tier, source').eq('fight_id', up.id),
    oppId ? sb.from('fighters').select('id, name, age, height_in, reach_in, ufc_wins, ufc_losses, ufc_draws, slpm, sapm, td_avg, td_acc, td_def').eq('id', oppId).maybeSingle() : Promise.resolve({ data: null }),
    sb.from('v_prop_projections_current').select('*').eq('fight_id', up.id).eq('fighter_id', f.id).maybeSingle(),
  ]);
  let pick = null;
  (pickR.data || []).forEach(p => { if (!pick || (p.source === 'live' && pick.source !== 'live')) pick = p; });
  const opp = oppR.data;
  const prop = propR.data;

  let pickHtml;
  if (pick && (pick.pick_fighter_id === f.id || pick.pick_fighter_id === oppId)) {
    const pickedMe = pick.pick_fighter_id === f.id;
    const conf = Number(pick.p_cal) * 100;
    const word = conf >= 65 ? 'High confidence' : (conf >= 55 ? 'Medium confidence' : 'Lean');
    const pickedName = pickedMe ? f.name : (oppName || 'the opponent');
    let why = '';
    if (window.cflInsights && opp) {
      const ctx = { weightClass: up.weight_class };
      const picked = pickedMe ? f : opp, other = pickedMe ? opp : f;
      const bullets = window.cflInsights.buildEdgeBullets(picked, other, ctx).slice(0, 3);
      const flags = window.cflInsights.buildRedFlags(picked, other, ctx, null, conf).slice(0, 2);
      const li = t => `<li>${cfl.escapeHtml(t)}</li>`;
      why = (bullets.length ? `<div class="nx-hd">Why the model likes ${cfl.escapeHtml(lastName(pickedName))}</div><ul class="nx-list">${bullets.map(li).join('')}</ul>` : '')
          + (flags.length ? `<div class="nx-hd against">Why it might be wrong</div><ul class="nx-list against">${flags.map(li).join('')}</ul>` : '');
    }
    pickHtml = `<div class="nx-pick">Model pick: <strong>${cfl.escapeHtml(pickedName)}</strong> <span class="nx-pct">${Math.round(conf)}%</span> <span class="nx-word">${word}</span></div>${why}`;
  } else {
    pickHtml = `<div class="nx-pick muted">Not scored yet — the engine's pick lands closer to fight night.</div>`;
  }

  let propHtml = '';
  if (prop) {
    const pd = prop.p_distance != null ? Math.round(Number(prop.p_distance) * 100) : null;
    const td1 = prop.p_td_1plus != null ? Math.round(Number(prop.p_td_1plus) * 100) : null;
    const range = (prop.sig_lo != null && prop.sig_hi != null) ? ` (usually ${Math.round(Number(prop.sig_lo))}–${Math.round(Number(prop.sig_hi))})` : '';
    propHtml = `<div class="nx-hd">Prop projection</div>
      <div class="pa-grid">
        <div class="pa-box"><div class="pa-val">${prop.sig_med != null ? Math.round(Number(prop.sig_med)) : '—'}</div><div class="pa-lbl">Significant strikes${range}</div></div>
        <div class="pa-box"><div class="pa-val">${td1 != null ? td1 + '%' : '—'}</div><div class="pa-lbl">Chance of a takedown</div></div>
        <div class="pa-box"><div class="pa-val">${pd != null ? pd + '%' : '—'}</div><div class="pa-lbl">Goes the distance</div></div>
      </div>
      ${prop.thin_tape ? '<div class="fin-note">Thin tape: under 30 minutes of prior film, so this projection is pulled toward the division average.</div>' : ''}`;
  }

  box.innerHTML = `
    <div class="nx-top">vs <a class="opp-link" href="${oppId ? cfl.fighterUrl(oppId) : '#'}">${cfl.escapeHtml(oppName || 'TBA')}</a>
      <span class="nx-when">${cfl.formatDate(up._event.event_date)} · <a class="opp-link" href="${cfl.eventUrl(up._event.id)}">${cfl.escapeHtml(up._event.name || '')}</a></span></div>
    ${pickHtml}
    ${propHtml}`;
  sec.hidden = false;
}

load();
</script>
